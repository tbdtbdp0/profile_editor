<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자기소개 페이지 생성기</title>
<style>
  :root {
    --ed-bg: #ffffff; --ed-soft: #f7f9fc; --ed-panel: #eef2f7; --ed-line: #e4e9f1; --ed-line-s: #edf1f6;
    --ed-text: #16202c; --ed-sub: #6c7889; --ed-accent: #3a8fd6; --ed-accent-2: #eaf4fc; --ed-danger: #d9534a;
    --r-s: 8px; --r-m: 11px; --r-l: 15px;
    --sh-1: 0 1px 2px rgba(20,45,80,.05);
    --sh-2: 0 6px 18px -10px rgba(20,45,80,.35);
    --fx: .18s cubic-bezier(.3,.8,.4,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-columns: 424px 1fr; height: 100vh;
    font: 14px/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #e8edf4; color: var(--ed-text);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in srgb, var(--ed-accent) 25%, transparent); }

  /* ---------- 좌측 편집기 ---------- */
  #editor { background: var(--ed-bg); border-right: 1px solid var(--ed-line); display: flex; flex-direction: column; min-height: 0; position: relative; z-index: 2; }
  .ed-top { padding: 9px 12px; border-bottom: 1px solid var(--ed-line-s); display: flex; align-items: center; gap: 6px; background: var(--ed-bg); }
  .ed-top h1 { font-size: 14.5px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -.01em; white-space: nowrap; }
  .ed-top h1 i { font-style: normal; margin-right: 5px; }
  .btn-grp { display: inline-flex; background: var(--ed-soft); border: 1px solid var(--ed-line); border-radius: var(--r-s); overflow: hidden; }
  .btn-grp button { border: 0; border-radius: 0; background: none; padding: 5px 9px; }
  .btn-grp button + button { border-left: 1px solid var(--ed-line); }
  .btn-grp button:hover:not(:disabled) { background: #fff; }
  .ico-btn { min-width: 30px; text-align: center; }

  .ed-tabs { display: flex; gap: 3px; padding: 7px 8px; border-bottom: 1px solid var(--ed-line-s); overflow-x: auto; scrollbar-width: none; background: linear-gradient(var(--ed-bg), var(--ed-soft)); }
  .ed-tabs::-webkit-scrollbar { display: none; }
  .ed-tab { flex: 1 0 48px; min-width: 48px; display: grid; justify-items: center; gap: 2px; padding: 7px 3px 6px; border: 0; border-radius: var(--r-m); background: none; font-size: 11px; font-weight: 500; color: var(--ed-sub); transition: background var(--fx), color var(--fx); }
  .ed-tab .lb { max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-tab .ic { font-size: 17px; line-height: 1.15; filter: saturate(.85); transition: filter var(--fx), transform var(--fx); }
  .ed-tab:hover { background: rgba(58,143,214,.08); border: 0; color: var(--ed-text); }
  .ed-tab.on { background: #fff; color: var(--ed-accent); font-weight: 700; box-shadow: var(--sh-1), inset 0 0 0 1px color-mix(in srgb, var(--ed-accent) 22%, transparent); }
  .ed-tab.on .ic { filter: none; transform: translateY(-1px); }

  .ed-scroll { overflow-y: auto; flex: 1; background: var(--ed-soft); scrollbar-width: thin; scrollbar-color: #cbd4e0 transparent; }
  .ed-scroll::-webkit-scrollbar { width: 10px; }
  .ed-scroll::-webkit-scrollbar-thumb { background: #cfd8e4; border: 3px solid var(--ed-soft); border-radius: 99px; }
  .ed-scroll::-webkit-scrollbar-thumb:hover { background: #b6c2d2; }
  .panel { padding: 0 14px 80px; display: grid; gap: 12px; align-content: start; }
  .panel-head { display: flex; align-items: center; gap: 8px; margin: 0 -14px 2px; padding: 13px 14px 11px; position: sticky; top: 0; z-index: 3;
    background: color-mix(in srgb, var(--ed-soft) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--ed-line-s); }
  .panel-head h2 { font-size: 15.5px; margin: 0; letter-spacing: -.01em; }

  details > summary { list-style: none; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: ""; margin-left: auto; width: 6px; height: 6px; flex-shrink: 0; border-right: 1.8px solid var(--ed-sub); border-bottom: 1.8px solid var(--ed-sub); transform: rotate(-45deg) translate(-2px, 0); transition: transform var(--fx); }
  details[open] > summary::after { transform: rotate(45deg) translate(-1px, -1px); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--ed-accent-2); border: 1px solid color-mix(in srgb, var(--ed-accent) 18%, transparent); color: color-mix(in srgb, var(--ed-accent) 78%, var(--ed-text)); font-weight: 600; white-space: nowrap; }
  label.f, .f { display: grid; gap: 5px; color: var(--ed-sub); font-size: 12.5px; font-weight: 500; }
  .f b.val { color: var(--ed-accent); font-weight: 700; }
  input[type=text], input[type=url], input[type=password], textarea, select {
    width: 100%; background: #fff; color: var(--ed-text); border: 1px solid var(--ed-line);
    border-radius: var(--r-s); padding: 8px 10px; font: inherit; font-size: 13.5px;
    transition: border-color var(--fx), box-shadow var(--fx), background var(--fx);
  }
  input[type=text]:hover, input[type=url]:hover, textarea:hover, select:hover { border-color: #c8d2df; }
  select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%236c7889' stroke-width='1.6' stroke-linecap='round'><path d='M3 4.5L6 7.5L9 4.5'/></svg>");
    background-repeat: no-repeat; background-position: right 9px center; background-size: 12px; }
  textarea { resize: vertical; min-height: 44px; line-height: 1.6; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ed-accent); box-shadow: 0 0 0 3px rgba(58,143,214,.16); }
  button:focus-visible, .ed-tab:focus-visible, summary:focus-visible { outline: 2px solid var(--ed-accent); outline-offset: 1px; }
  input[type=range] { width: 100%; accent-color: var(--ed-accent); height: 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row-icon { display: grid; grid-template-columns: 58px 1fr; gap: 8px; }
  input[type=color] { width: 100%; height: 34px; border: 1px solid var(--ed-line); border-radius: var(--r-s); background: #fff; padding: 3px; cursor: pointer; }
  .check { display: flex; align-items: center; gap: 7px; color: var(--ed-text); font-size: 13px; font-weight: 500; cursor: pointer; padding: 7px 10px; border: 1px solid var(--ed-line); border-radius: var(--r-s); background: #fff; transition: border-color var(--fx), background var(--fx); }
  .check:hover { border-color: #c8d2df; }
  .check:has(input:checked) { border-color: color-mix(in srgb, var(--ed-accent) 45%, transparent); background: var(--ed-accent-2); color: color-mix(in srgb, var(--ed-accent) 80%, var(--ed-text)); }
  .check input { accent-color: var(--ed-accent); width: 15px; height: 15px; margin: 0; flex-shrink: 0; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--ed-text); background: #fff; border: 1px solid var(--ed-line);
    border-radius: var(--r-s); padding: 7px 12px; cursor: pointer; transition: background var(--fx), border-color var(--fx), color var(--fx), box-shadow var(--fx), transform .1s;
  }
  button:hover:not(:disabled) { border-color: #c2ccda; background: var(--ed-soft); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .38; cursor: default; }
  button.primary { background: var(--ed-accent); color: #fff; border-color: transparent; font-weight: 600; box-shadow: 0 2px 8px -2px rgba(58,143,214,.55); }
  button.primary:hover:not(:disabled) { background: #2f81c8; border-color: transparent; }
  button.ghost { background: none; border-color: transparent; }
  button.ghost:hover:not(:disabled) { background: rgba(20,45,80,.06); border-color: transparent; }
  button.danger:hover:not(:disabled) { color: var(--ed-danger); background: #fdf1f0; }
  button.add { border-style: dashed; color: var(--ed-sub); background: none; padding: 9px 12px; font-weight: 600; }
  button.add:hover:not(:disabled) { color: var(--ed-accent); border-color: var(--ed-accent); background: var(--ed-accent-2); }
  button.on { border-color: var(--ed-accent); color: var(--ed-accent); background: var(--ed-accent-2); font-weight: 600; }

  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .img-field { display: flex; gap: 10px; align-items: center; padding: 7px; border: 1px solid var(--ed-line); border-radius: var(--r-m); background: #fff; }
  .img-thumb {
    width: 52px; height: 52px; border-radius: var(--r-s); background: var(--ed-panel) center/contain no-repeat;
    border: 1px dashed #c6cfdb; flex-shrink: 0;
  }
  .img-field .btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .img-field input[type=file] { display: none; }
  .acc { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: center; }

  .card { background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-l); padding: 12px; display: grid; gap: 10px; box-shadow: var(--sh-1); }
  .card-title { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--ed-text); display: flex; align-items: center; gap: 6px; }
  details.item { background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-l); box-shadow: var(--sh-1); transition: box-shadow var(--fx), border-color var(--fx); }
  details.item:hover { border-color: #d2dbe6; }
  details.item[open] { box-shadow: var(--sh-2); border-color: color-mix(in srgb, var(--ed-accent) 24%, var(--ed-line)); }
  details.item > summary { padding: 10px 10px 10px 13px; font-weight: 600; font-size: 13px; border-radius: var(--r-l); }
  details.item[open] > summary { border-radius: var(--r-l) var(--r-l) 0 0; border-bottom: 1px solid var(--ed-line-s); }
  details.item > summary .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 0 0 3px color-mix(in srgb, currentColor 0%, transparent); }
  details.item > summary .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.item > summary button { padding: 3px 7px; font-size: 12px; opacity: .55; }
  details.item > summary:hover button, details.item[open] > summary button { opacity: 1; }
  details.item > .item-body { padding: 12px 12px 14px; display: grid; gap: 10px; }
  .grp { margin: 8px 0 -2px; font-size: 11px; font-weight: 700; color: var(--ed-sub); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 9px; }
  .grp::after { content: ""; flex: 1; height: 1px; background: var(--ed-line); }
  .info-row { background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-m); padding: 8px; display: grid; gap: 6px; }
  .info-row .top { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
  .info-row .check { padding: 5px 8px; font-size: 12px; }
  .hint { color: var(--ed-sub); font-size: 12px; line-height: 1.6; margin: 0; }
  .dp-status { border-radius: var(--r-m); padding: 10px 12px; font-size: 13px; line-height: 1.5; margin: 0; word-break: break-all; }
  .dp-status.busy { background: #f0f4f9; color: #4a5566; }
  .dp-status.ok { background: #ecf8f1; color: #206b40; border: 1px solid #c9ecd6; }
  .dp-status.err { background: #fdf1f0; color: #a33232; border: 1px solid #f3d0d0; }
  .dp-status a { color: inherit; font-weight: 700; }
  .guide { background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-m); }
  .guide > summary { padding: 10px 12px; font-weight: 600; font-size: 13px; }
  .guide ol { margin: 0; padding: 0 14px 12px 32px; font-size: 13px; line-height: 1.65; color: var(--ed-text); }
  .guide li + li { margin-top: 4px; }
  .guide b { font-weight: 700; }
  .note { background: var(--ed-accent-2); border: 1px solid #d3e7f7; color: #3a5a78; border-radius: var(--r-m); padding: 10px 12px; font-size: 12.5px; line-height: 1.6; margin: 0; }

  /* 탭 관리 · 템플릿 */
  .tab-row { display: grid; grid-template-columns: 46px 1fr auto auto auto auto; gap: 5px; align-items: center; background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-m); padding: 6px; box-shadow: var(--sh-1); }
  .tab-row .badge { white-space: nowrap; }
  .tab-row input[type=text]:first-child { text-align: center; padding: 8px 2px; }
  .tab-row button { padding: 5px 7px; }
  .tpls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tpl { display: grid; justify-items: center; gap: 2px; padding: 10px 4px 9px; text-align: center; line-height: 1.25; border-radius: var(--r-m); }
  .tpl:hover:not(:disabled) { border-color: var(--ed-accent); background: var(--ed-accent-2); }
  .tpl .ic { font-size: 20px; }
  .tpl b { font-size: 12.5px; }
  .tpl small { font-size: 10.5px; color: var(--ed-sub); }

  /* 세부 탭 (서브 페어) */
  .subtabs { display: flex; flex-wrap: wrap; gap: 5px; padding: 7px; background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-m); box-shadow: var(--sh-1); }
  .subtab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: var(--ed-sub); background: var(--ed-soft); border-color: transparent; }
  .subtab:hover:not(:disabled) { background: var(--ed-panel); border-color: transparent; color: var(--ed-text); }
  .subtab .n { font-size: 10.5px; font-weight: 700; padding: 0 6px; border-radius: 99px; background: rgba(20,45,80,.08); }
  .subtab.on { background: var(--ed-accent); color: #fff; border-color: transparent; box-shadow: 0 2px 8px -3px rgba(58,143,214,.8); }
  .subtab.on:hover { background: #2f81c8; color: #fff; }
  .subtab.on .n { background: rgba(255,255,255,.26); }
  .subtab.new { background: none; border: 1px dashed var(--ed-line); }
  .subtab.new:hover { border-color: var(--ed-accent); color: var(--ed-accent); background: var(--ed-accent-2); }
  .sec-head { display: flex; align-items: center; gap: 8px; margin: 10px 0 -2px; font-size: 12px; font-weight: 700; color: var(--ed-accent); }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--ed-accent) 22%, transparent); }
  .sec-head .n { color: var(--ed-sub); font-weight: 600; }

  .grp-box { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--ed-line); border-radius: var(--r-m); background: var(--ed-soft); }
  .grp-box textarea { min-height: 36px; font-size: 13px; }
  .grp-row, .rule-row { display: grid; gap: 5px; align-items: center; }
  .grp-row { grid-template-columns: 1fr auto auto auto; }
  .rule-row { grid-template-columns: 116px 1fr auto; }
  .grp-row button, .rule-row button { padding: 5px 8px; }

  .layouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .layouts.two { grid-template-columns: 1fr 1fr; }
  .layouts.three { grid-template-columns: repeat(3, 1fr); }
  .lay { display: grid; justify-items: center; gap: 4px; padding: 8px 2px 6px; font-size: 11px; color: var(--ed-sub); line-height: 1.2; border-radius: var(--r-m); }
  .lay svg { width: 44px; height: 30px; color: #9aa6b4; transition: color var(--fx); }
  .lay:hover:not(:disabled) { border-color: #c2ccda; }
  .lay:hover svg { color: #7d8b9c; }
  .lay.on { border-color: var(--ed-accent); color: var(--ed-accent); background: var(--ed-accent-2); font-weight: 700; }
  .lay.on svg { color: var(--ed-accent); }

  /* ---------- 우측 미리보기 ---------- */
  #preview { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pv-top { padding: 9px 14px; border-bottom: 1px solid var(--ed-line); display: flex; gap: 7px; align-items: center; background: var(--ed-bg); flex-wrap: wrap; }
  .pv-top .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--ed-line); border-radius: var(--r-s); overflow: hidden; background: var(--ed-soft); padding: 2px; gap: 2px; }
  .seg button { border: 0; border-radius: 6px; background: none; color: var(--ed-sub); padding: 5px 10px; }
  .seg button:hover:not(.on) { background: rgba(20,45,80,.05); }
  .seg button.on { background: #fff; color: var(--ed-text); font-weight: 600; box-shadow: var(--sh-1); }
  .pv-stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 24px; background:
    radial-gradient(1200px 600px at 50% -10%, #f3f7fc, transparent), #e8edf4; }
  .pv-frame { border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 18px 46px rgba(20,40,60,.18); transition: width .2s; height: 100%; min-height: 600px; max-width: 100%; background: #fff; }
  .pv-frame iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* 화면 배치: 둘 다 / 편집창만 / 미리보기만 */
  .layout-seg button { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; }
  .layout-seg svg { width: 16px; height: 16px; }
  .ed-top .layout-seg { display: none; }
  body.only-editor, body.only-preview { grid-template-columns: 1fr; }
  body.only-editor #preview, body.only-preview #editor { display: none; }
  body.only-editor #editor { border-right: 0; }
  body.only-editor .ed-top .layout-seg { display: inline-flex; }
  body.only-editor .ed-tabs, body.only-editor .panel { width: 100%; max-width: 780px; margin: 0 auto; }
  body.only-editor .ed-tabs { border-bottom: 0; background: none; }
  body.only-editor .ed-scroll { border-top: 1px solid var(--ed-line-s); }
  body.only-editor .panel-head { margin-left: 0; margin-right: 0; }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
    body.only-editor, body.only-preview { grid-template-rows: 1fr; }
    #editor { border-right: 0; border-bottom: 1px solid var(--ed-line); }
    .layout-seg .lbl { display: none; }
    .ed-top h1 { font-size: 13px; }
    .pv-stage { padding: 14px; }
  }
</style>
</head>
<body>

<aside id="editor">
  <div class="ed-top">
    <h1><i>✨</i>자기소개 생성기</h1>
    <div class="seg layout-seg">
      <button type="button" data-layout-mode="both" title="편집창 + 미리보기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M6 2.5v11"/></svg><span class="lbl">둘 다</span></button>
      <button type="button" data-layout-mode="editor" title="편집창만 보기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6h7M4.5 8.5h7M4.5 11h4"/></svg><span class="lbl">편집만</span></button>
      <button type="button" data-layout-mode="preview" title="미리보기만 보기"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><circle cx="8" cy="8" r="2.2"/></svg><span class="lbl">미리보기만</span></button>
    </div>
    <div class="btn-grp">
      <button id="btnUndo" class="ico-btn" title="되돌리기 (⌘/Ctrl+Z)" disabled>↶</button>
      <button id="btnRedo" class="ico-btn" title="다시 실행 (⇧+⌘/Ctrl+Z)" disabled>↷</button>
    </div>
    <div class="btn-grp">
      <button id="btnLoad" title="저장한 프로젝트(.json) 불러오기">불러오기</button>
      <button id="btnSave" title="프로젝트를 .json으로 저장">저장</button>
    </div>
    <input type="file" id="loadFile" accept="application/json" hidden>
  </div>
  <nav class="ed-tabs" id="edTabs"></nav>
  <div class="ed-scroll" id="edScroll"></div>
</aside>

<main id="preview">
  <div class="pv-top">
    <div class="seg layout-seg">

function migrate(s) {
  const d = Object.assign(clone(DEFAULT), s);
  d.theme = Object.assign(clone(DEFAULT.theme), d.theme); delete d.theme.bg;
  if (d.theme.accent === '#e87a90') d.theme.accent = DEFAULT.theme.accent;

  const oc = s.cover || {}, nc = clone(DEFAULT.cover);
  if (!('type' in oc)) {
    if ('frost' in oc) Object.assign(nc, pick(oc, ['title', 'hint', 'cakeImg', 'sliceImg', 'fxImg', 'sx', 'sy', 'sw', 'sr', 'lift', 'candle']), { type: 'cake', cakeSize: oc.size || 400 });
    else Object.assign(nc, pick(oc, ['image', 'blend', 'size', 'kicker', 'title', 'hint']), { type: 'heart' });
  } else Object.assign(nc, oc);
  d.cover = nc;

  d.labels = Object.assign(clone(DEFAULT.labels), d.labels);
  // 탭: 예전 고정 4개 → 종류가 있는 목록으로
  const OLD_TYPES = ['profile', 'mains', 'others', 'friends'];

    .map((t, i) => t.type ? t : Object.assign({ id: OLD_TYPES[i] || `p${i}`, type: OLD_TYPES[i] || 'text' }, t));
  d.pages = Object.assign({}, s.pages);
  d.tabs.forEach(t => {
    if (t.id === t.type || d.pages[t.id]) return;
    d.pages[t.id] = BUILTIN_TABS[t.type] ? clone(DEFAULT[t.type]) : (PAGE_TEMPLATES[t.type] || PAGE_TEMPLATES.text).make();
  });

  if (!LAYOUTS[d.profile.layout]) d.profile.layout = 'stack';
  d.profile.info = (d.profile.info || []).map(r => Object.assign({ k: '', v: '', fold: false }, r));

  let o = d.others;
  if (o.items?.some(it => 'layout' in it)) o = { intro: o.intro, items: o.items.map(it => ({ bot: it.name, platform: it.sub, desc: it.desc, image: (it.images || [])[0] || '', link: it.link })) };
  if (o.items?.some(it => 'bot' in it)) o = { cols: 1, intro: o.intro || '', items: o.items.map(it => pairItem({
    a: charObj({ name: it.bot, platform: it.platform, creator: it.creator, link: it.link, image: it.image, desc: it.desc }),
    b: charObj({ name: it.user, prompt: it.prompt }),
  })) };

  return d;

// 고정 시드 난수 — 미리보기를 다시 그려도 배치가 그대로
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255]
    .map(v => Math.max(0, Math.min(255, Math.round(p < 0 ? v * (1 + p) : v + (255 - v) * p))).toString(16).padStart(2, '0'))
    .join('');
}

function fontLink(d) {

}

// 이미지를 적당한 크기로 줄여 dataURL로 (투명 PNG는 PNG 유지)
function readImage(file, max = 1400) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      if (file.type === 'image/gif') return res(r.result);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const keepAlpha = file.type === 'image/png' || file.type === 'image/webp';
        res(c.toDataURL(keepAlpha ? 'image/png' : 'image/jpeg', 0.9));
      };
      img.onerror = rej;
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function cakeSVG(c) {
  const cx = 200, cy = 150, rx = 140, ry = 46, h = 96;
  const t1 = 62, t2 = 114;
  const R = Math.PI / 180;
  const P = (t, dy = 0, r = 1) => [cx + rx * r * Math.cos(t * R), cy + ry * r * Math.sin(t * R) + dy];
  const fmt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  const arc = (a, b, dy = 0, wave = 0) => {
    const n = Math.max(2, Math.ceil(Math.abs(b - a) / 2)), out = [];
    for (let i = 0; i <= n; i++) {
      const t = a + (b - a) * i / n;
      out.push(P(t, dy + (wave ? wave * (0.55 + 0.45 * Math.sin(t * R * 16)) : 0)));
    }
    return out;
  };
  const poly = pts => 'M' + pts.map(fmt).join('L') + 'Z';
  const band = (a, b, y0, y1, wave = 0) => poly([...arc(a, b, y0), ...arc(b, a, y1, wave)]);
  const face = (t, y0, y1) => poly([[cx, cy + y0], P(t, y0), P(t, y1), [cx, cy + y1]]);
  const skin = shade(c.frost, -0.06), jam = shade(c.frost, -0.12);
  const dots = (a, b) => {
    let s = '';
    for (let t = a + 5; t < b; t += 10) { const p = P(t, h - 1); s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6.5" fill="${c.cream}"/>`; }
    return s;
  };
  const berry = (t, r = 0.74) => {
    const [x, y] = P(t, 0, r), k = 0.85 + 0.25 * Math.sin(t * R);
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${k.toFixed(2)})">
      <path d="M0,4 C-11,-2 -9,-17 0,-15 C9,-17 11,-2 0,4Z" fill="${c.deco}"/>
      <path d="M-6,-14 L-2,-11 L0,-17 L2,-11 L6,-14 L3,-9 L-3,-9Z" fill="#5ea45b"/>
    </g>`;
  };
  const cutFace = (t, k) => [
    [0, 9, c.cream], [9, 42, c.sponge], [42, 52, jam], [52, 86, c.sponge], [86, h, shade(c.sponge, -0.08)],
  ].map(([y0, y1, col]) => `<path d="${face(t, y0, y1)}" fill="${shade(col, k)}"/>`).join('');
  const candle = c.candle ? (() => {
    const [x, y] = P(250, 0, 0.45);
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
      <rect x="-6" y="-52" width="12" height="52" rx="3" fill="#fff" stroke="${shade(c.frost, -0.2)}" stroke-width="1"/>
      <path d="M-6,-40 L6,-46 M-6,-26 L6,-32 M-6,-12 L6,-18" stroke="${c.frost}" stroke-width="3"/>
      <path d="M0,-52 L0,-58" stroke="#555" stroke-width="1.5"/>
      <path class="flame" d="M0,-80 C8,-70 7,-60 0,-58 C-7,-60 -8,-70 0,-80Z" fill="#ffb938"/>
      <path class="flame" d="M0,-72 C4,-66 3,-61 0,-60 C-3,-61 -4,-66 0,-72Z" fill="#fff3c4"/>
    </g>`;
  })() : '';

  return `<svg class="cake cake-svg enter" viewBox="0 0 400 330" role="button" tabindex="0" aria-label="들어가기">
    <ellipse cx="${cx}" cy="${cy + h + 30}" rx="175" ry="34" fill="rgba(0,0,0,.08)"/>
    <ellipse cx="${cx}" cy="${cy + h + 8}" rx="176" ry="62" fill="#fff" stroke="rgba(0,0,0,.06)"/>
    <g>
      <path d="${band(0, t1, 0, h)}" fill="${skin}"/>
      <path d="${band(t2, 180, 0, h)}" fill="${skin}"/>
      <path d="${band(0, t1, 0, 16, 10)}" fill="${c.cream}"/>
      <path d="${band(t2, 180, 0, 16, 10)}" fill="${c.cream}"/>
      ${dots(0, t1)}${dots(t2, 180)}
      ${cutFace(t1, 0.05)}${cutFace(t2, -0.08)}
      <path d="${poly([[cx, cy], ...arc(t2, 360 + t1)])}" fill="${c.cream}"/>
      ${[200, 235, 305, 340].map(t => berry(t)).join('')}
      ${candle}
      ${[20, 160].map(t => berry(t)).join('')}
    </g>
    <g class="slice">
      <path d="${band(t1, t2, 0, h)}" fill="${skin}"/>
      <path d="${band(t1, t2, 0, 16, 10)}" fill="${c.cream}"/>
      ${dots(t1, t2)}
      <path d="${poly([[cx, cy], ...arc(t1, t2)])}" fill="${c.cream}"/>
      ${berry((t1 + t2) / 2, 0.7)}
    </g>
  </svg>`;
}

/* =========================================================

function dreamCover(c) {
  const r = rng(11);
  const syms = String(c.dSymbols || '').split(/\s+/).filter(Boolean);
  const words = String(c.dWords || '').split('\n').map(s => s.trim()).filter(Boolean);
  const kinds = ['chrome', 'glow', 'pastel', 'glow'];
  let objs = '';

  const density = Number(c.dCount) || 60;
  const count = syms.length ? density : 0;
  for (let i = 0; i < count; i++) {
    let x = Math.round((r() * 2 - 1) * 640);
    const y = Math.round(-340 + r() * 440), z = Math.round(-1600 + r() * 1450);
    if (Math.abs(x) < 120 && z < -500) x += x < 0 ? -200 : 200;   // 가운데 문 앞은 비워둠
    const size = Math.round(26 + r() * 50);
    objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><span class="sym ${kinds[i % 4]}" style="font-size:${size}px;animation-duration:${(5 + r() * 6).toFixed(1)}s;animation-delay:${(-r() * 8).toFixed(1)}s">${esc(syms[i % syms.length])}</span></div>`;
  }
  words.forEach(w => {
    const x = Math.round((r() * 2 - 1) * 460), y = Math.round(-280 + r() * 260), z = Math.round(-1200 + r() * 800);
    objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><span class="word" style="animation-delay:${(-r() * 6).toFixed(1)}s">${esc(w)}</span></div>`;
  });
  // 도형 위치: 가운데 문 앞은 비워둠
  const spot = () => {
    let x = Math.round((r() * 2 - 1) * 620);
    const y = Math.round(-340 + r() * 420), z = Math.round(-1600 + r() * 1450);
    if (Math.abs(x) < 150 && z < -450) x += x < 0 ? -230 : 230;
    return [x, y, z];
  };
  const shapeN = Math.max(2, Math.round(density / 7));
  if (c.dCubes) {
    Array.from({ length: shapeN }, () => [...spot(), Math.round(36 + r() * 100)]).forEach(([x, y, z, s], i) => {
      objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><div class="cube" style="--s:${s}px;animation-delay:${-i * 3}s">${['f', 'k', 'l', 'r', 't', 'd'].map(f => `<i class="${f}"></i>`).join('')}</div></div>`;
    });
  }
  if (c.dOrbs) for (let i = 0; i < shapeN; i++) {
    const [x, y, z] = spot(), s = Math.round(22 + r() * 72);
    objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><span class="orb ${i % 2 ? 'chrome' : 'pearl'}" style="--s:${s}px;animation-delay:${(-r() * 6).toFixed(1)}s"></span></div>`;
  }
  if (c.dRings) for (let i = 0; i < Math.round(shapeN * .7); i++) {
    const [x, y, z] = spot(), s = Math.round(50 + r() * 110);
    objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><span class="ring3d" style="--s:${s}px;animation-delay:${(-r() * 9).toFixed(1)}s;animation-duration:${(9 + r() * 8).toFixed(1)}s"></span></div>`;
  }
  const center = c.dCenter === 'image' && c.dImage
    ? `<div class="obj" style="transform:translate3d(0,60px,-620px)"><button type="button" class="d-img enter" aria-label="들어가기"><span class="d-float"><img src="${c.dImage}" alt="" draggable="false"></span></button></div>`
    : `<div class="obj" style="transform:translate3d(0,240px,-700px)"><span class="spill"></span><button type="button" class="door enter" aria-label="들어가기"><span class="door-in"></span></button></div>`;

  const clouds = c.dClouds ? [[4, 12, 240, .9, 46], [58, 6, 300, .85, 60], [30, 24, 190, .7, 38], [78, 27, 220, .75, 52]]
    .map(([x, y, w, o, d], i) => `<span class="cloud" style="left:${x}%;top:${y}%;--w:${w}px;--o:${o};animation-duration:${d}s;animation-delay:${-i * 9}s"></span>`).join('') : '';

  return `<div class="cover cv-dream ${c.dGrain ? 'grain' : ''}">
    <div class="sky"><span class="sun"></span>${clouds}</div>
    <div class="world"><div class="cam" id="cam">
      <div class="floor ${c.dFloorType === 'grid' ? 'grid' : 'checker'}"></div>
      ${objs}
      ${center}
    </div></div>
    <div class="flash"></div>
    <div class="d-text">${coverText(c)}</div>
    <div class="d-hint">${coverHint(c)}</div>
  </div>`;
}

function coverHTML(c) {
  return c.type === 'cake' ? cakeCover(c) : c.type === 'dream' ? dreamCover(c) : heartCover(c);
}

/* =========================================================
   페이지 조각들
   ========================================================= */
const tagsHTML = s => tagList(s).length ? `<div class="tags">${tagList(s).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>` : '';

// 프롬프트: 사진(없으면 이름)을 누르면 복사 — 마우스를 올리면 안내 문구
const copyAttr = p => p ? `data-prompt="${esc(p)}" data-tip="눌러서 프롬프트 복사" tabindex="0" role="button"` : '';

// 캐릭터 한 명 블록 — imgHTML은 미리 만든 이미지 태그(없으면 생략)
function charHTML(c, label, imgHTML = '', hideCopyName = false) {
  const meta = [c.platform, c.creator].filter(Boolean).map(esc).join(' · ');
  return `<div class="cb">
    ${imgHTML ? `<div class="cb-pic ${c.prompt ? 'copyable' : ''}" ${copyAttr(c.prompt)}>${imgHTML}</div>` : ''}
    <div class="cb-t">
      ${label ? `<p class="lbl">${esc(label)}</p>` : ''}
      <h3 ${!imgHTML && !hideCopyName ? `class="copyable copy-name" ${copyAttr(c.prompt)}` : ''}>${esc(c.name || '이름')}</h3>
      ${meta ? `<p class="meta">${meta}</p>` : ''}
      ${c.link ? `<a class="meta-lnk" href="${esc(c.link)}" target="_blank" rel="noopener">보러 가기 ↗</a>` : ''}
      ${c.desc ? `<p class="cd">${nl(c.desc)}</p>` : ''}
    </div>
  </div>`;
}

function profileHTML(e) {
  const im = e.images?.[0] ? `<img src="${e.images[0]}" alt="">` : `<div class="ph">IMAGE</div>`;
  const info = (e.info || []).filter(r => r.k || r.v);
  const infoHTML = info.length ? `<div class="info">${info.map(r => r.fold
      ? `<details class="fold"><summary><span>${esc(r.k)}</span></summary><div class="fold-body">${nl(r.v)}</div></details>`
      : `<div class="ir"><span class="ik">${esc(r.k)}</span><span class="iv">${nl(r.v)}</span></div>`).join('')}</div>` : '';
  const text = (withName = true) => `<div class="tx">
      ${e.sub ? `<p class="sub">${esc(e.sub)}</p>` : ''}
      ${withName && e.name ? `<h3 class="nm">${esc(e.name)}</h3>` : ''}
      ${tagsHTML(e.tags)}
      ${infoHTML}
      ${e.desc ? `<div class="desc">${nl(e.desc)}</div>` : ''}
    </div>`;
  const body = e.layout === 'polaroid'
    ? `<div class="frame"><div class="media">${im}</div>${e.name ? `<p class="cap">${esc(e.name)}</p>` : ''}</div>${text(false)}`
    : `<div class="media">${im}</div>${text()}`;
  return `<div class="enw" ${accentStyle(e.accent)}><article class="en l-${esc(e.layout)}">${body}</article></div>`;
}

// 뒷면 배경 이미지: 위는 이미지가 비치고 아래로 갈수록 페이지 배경색으로 흐려짐
function backBg(m) {
  if (!m.backImg) return '';
  const f = Math.max(0, Math.min(100, Number(m.backFade) || 0));
  const img = `url('${m.backImg}') center/cover no-repeat`;
  if (!f) return `background:${img}`;
  const mix = k => `color-mix(in srgb,var(--card) ${Math.min(100, Math.round(f * k))}%,transparent)`;
  return `background:linear-gradient(180deg,${mix(.5)} 0%,${mix(1)} 50%,${mix(1.6)} 100%),${img}`;
}

function mainCard(m, i, labels) {
  const pic = c => c.image ? `<img src="${c.image}" alt="">` : '';
  // 사진 가장자리를 그라데이션으로 투명하게 — 뒷배경 이미지와 자연스럽게 섞이도록
  const fade = Math.max(0, Math.min(100, Number(m.picFade) || 0));
  const hero = m.backLayout === 'hero' && (m.a.image || m.b.image)
    ? `<div class="hero">${[m.a, m.b].map(c => `<span class="${c.image && c.prompt ? 'copyable' : ''}" ${c.image ? copyAttr(c.prompt) : ''}>${c.image ? `<img src="${c.image}" alt="">` : ''}</span>`).join('')}</div>` : '';
  const withPics = m.backLayout !== 'hero';
  return `<div class="mcard" ${accentStyle(m.accent)}>
    <div class="flip ${m.style === 'postcard' ? 'postcard' : 'poster'}" data-fi="${i}" role="button" tabindex="0" aria-label="카드 뒤집기">
      <div class="flip-inner">
        <div class="face front">
          ${m.frontMode === 'duo'
            ? `<div class="duo-front">${[['frontA', 'l'], ['frontB', 'r']].map(([k, cls]) => `<span class="side ${cls}">${m[k] ? `<img src="${m[k]}" alt="">` : ''}</span>`).join('')}</div>`
            : m.image ? `<img src="${m.image}" alt="">` : `<div class="ph">MAIN IMAGE</div>`}
          ${m.showTitle && (m.title || m.sub) ? `<div class="front-tx">${m.sub ? `<p>${esc(m.sub)}</p>` : ''}${m.title ? `<h2>${esc(m.title)}</h2>` : ''}</div>` : ''}
        </div>
        <div class="face back lay-${esc(m.backLayout)} shape-${esc(m.picShape)} ${m.cardBg === false ? 'no-cb' : ''} ${m.backImg ? 'has-img' : ''} ${fade ? `pf pf-${esc(PIC_FADES[m.picFadeDir] ? m.picFadeDir : 'bottom')}` : ''} tx-${esc(m.textStyle || 'plain')}" style="--pic:${Number(m.picSize) || 100};--tc:${isHex(m.textColor) ? m.textColor : '#ffffff'};--pc:${isHex(m.pillColor) ? m.pillColor : '#ffffff'};--rad:${Number(m.picRadius) || 0};--pf:${fade};${backBg(m)}">
          ${hero}
          <div class="bk-head">
            ${m.sub ? `<p class="sub">${esc(m.sub)}</p>` : ''}
            ${m.title ? `<h2>${esc(m.title)}</h2>` : ''}
            ${tagsHTML(m.tags)}
          </div>
          <div class="cols">
            ${charHTML(m.a, labels.a, withPics ? pic(m.a) : '', !withPics && !!m.a.image)}
            ${charHTML(m.b, labels.b, withPics ? pic(m.b) : '', !withPics && !!m.b.image)}
          </div>
          ${m.desc ? `<p class="bk-desc">${nl(m.desc)}</p>` : ''}
        </div>
      </div>
    </div>
    <p class="flip-hint">↻ 카드를 눌러 뒤집어 보세요</p>
  </div>`;
}

function mainsHTML(ms, labels) {
  if (!ms.items.length) return `<p class="empty">아직 등록된 메인 페어가 없어요</p>`;
  return `${ms.intro ? `<p class="tab-intro">${nl(ms.intro)}</p>` : ''}
    <div class="mains c${ms.cols}">${ms.items.map((m, i) => mainCard(m, i, labels)).join('')}</div>`;
}

function othersHTML(o, labels, uid = 'o') {
  if (!o.items.length) return `<p class="empty">아직 등록된 페어가 없어요</p>`;
  const nf = `nf-${esc(o.nameFont || 'body')}`;
  const side = (c, cls) => `<span class="side ${cls}">${c.image ? `<img src="${c.image}" alt="">` : ''}</span>`;
  const cap = p => `<span class="dp-nm">${esc(p.a.name || '캐릭터')}<i>×</i>${esc(p.b.name || '유저')}</span>`;
  const soloName = p => p.a.name || (p.role === 'b' ? '유저' : '캐릭터');
  const show = o.showName !== false, below = show && o.namePos === 'below';
  const acc = p => `${accentStyle(p.accent)} ${isHex(p.accent) ? `data-accent="${p.accent}"` : ''}`;
  const pairBtn = (p, i) => `
        <button type="button" class="dpw ${below ? 'below' : ''}" data-pd="${uid}-${i}" ${acc(p)}>
          <span class="dp">${side(p.a, 'l')}${side(p.b, 'r')}${show && !below ? `<span class="shade"></span>${cap(p)}` : ''}</span>
          ${below ? cap(p) : ''}
        </button>`;
  const soloBtn = (p, i) => `
          <button type="button" class="dpw solo" data-pd="${uid}-${i}" ${acc(p)}>
            <span class="sp s">${p.a.image ? `<img src="${p.a.image}" alt="">` : `<span class="ini">${esc(Array.from(soloName(p))[0])}</span>`}</span>
            ${show ? `<span class="dp-nm">${esc(soloName(p))}</span>` : ''}
          </button>`;

  // 연속된 단독은 한 줄에 동그라미로 모아서 배치
  const listOf = entries => {
    let list = '', run = '';
    entries.forEach(([p, i]) => {
      if (p.kind === 'solo') { run += soloBtn(p, i); return; }
      if (run) { list += `<div class="solos">${run}</div>`; run = ''; }
      list += pairBtn(p, i);
    });
    return run ? list + `<div class="solos">${run}</div>` : list;
  };

  // 목록 나누기: 목록이 없는 항목은 맨 위, 나머지는 목록 순서대로
  const groups = o.groups || [];
  const buckets = [{ id: '', title: '', intro: '', entries: [] }, ...groups.map(g => ({ id: g.id, title: g.title, intro: g.intro, entries: [] }))];
  o.items.forEach((p, i) => (buckets.find(b => b.id && b.id === p.group) || buckets[0]).entries.push([p, i]));
  const shown = buckets.filter(b => b.entries.length);
  const titled = shown.filter(b => b.id);
  const chips = o.groupStyle === 'chips' && titled.length > 1;
  // '전체' 탭을 뺐다면 첫 번째 목록을 골라 둔 상태로 시작 (목록이 없는 항목은 항상 보임)
  const allChip = o.showAll !== false, startId = chips && !allChip ? titled[0].id : null;

  return `${o.intro ? `<p class="tab-intro">${nl(o.intro)}</p>` : ''}
    ${chips ? `<div class="gchips">${allChip ? '<button type="button" class="gchip on" data-g="*">전체</button>' : ''}${titled.map(b => `<button type="button" class="gchip ${b.id === startId ? 'on' : ''}" data-g="${esc(b.id)}">${esc(b.title || '세부 탭')}</button>`).join('')}</div>` : ''}
    <div class="sgrps ${startId ? 'filtered' : ''}">${shown.map(b => `
      <div class="sgrp" data-g="${esc(b.id)}" ${startId && b.id && b.id !== startId ? 'hidden' : ''}>
        ${b.id && b.title ? `<h3 class="sgrp-t">${esc(b.title)}</h3>` : ''}
        ${b.id && b.intro ? `<p class="sgrp-intro">${nl(b.intro)}</p>` : ''}
        <div class="dpills c${o.cols} ${nf}">${listOf(b.entries)}</div>
      </div>`).join('')}
    </div>
    ${o.items.map((p, i) => p.kind === 'solo' ? `
      <template id="pd-${uid}-${i}">
        <h2 class="d-title ${nf}">${esc(soloName(p))}</h2>
        <div class="cols solo">${charHTML(p.a, p.role === 'b' ? labels.b : labels.a, p.a.image ? `<img data-from="${i}-s" alt="">` : '')}</div>
      </template>` : `
      <template id="pd-${uid}-${i}">
        <h2 class="d-title ${nf}">${esc(p.a.name)}<span class="px">×</span>${esc(p.b.name)}</h2>
        <div class="cols">
          ${charHTML(p.a, labels.a, p.a.image ? `<img data-from="${i}-l" alt="">` : '')}
          ${charHTML(p.b, labels.b, p.b.image ? `<img data-from="${i}-r" alt="">` : '')}
        </div>
      </template>`).join('')}`;
}

function pageHTML(tb, pg) {
  const items = pg.items || [];
  let body = '';
  switch (tb.type) {
    case 'text':
      body = items.map(b => `<div class="tblock">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}${b.body ? `<div class="tb-body">${nl(b.body)}</div>` : ''}</div>`).join('');
      break;
    case 'qna':
      body = items.map(x => pg.fold
        ? `<details class="qa"><summary><span class="qm">Q</span><span class="qq">${esc(x.q)}</span></summary><div class="qa-a"><span class="am">A</span><div>${nl(x.a)}</div></div></details>`
        : `<div class="qa"><div class="qa-q"><span class="qm">Q</span><span class="qq">${esc(x.q)}</span></div><div class="qa-a"><span class="am">A</span><div>${nl(x.a)}</div></div></div>`).join('');
      break;
    case 'rules': {
      const L = Object.assign({ ok: '괜찮아요', no: '안 돼요', ask: '물어봐 주세요' }, pg.labels);
      const sym = { ok: '○', no: '✕', ask: '△' };
      body = `<div class="rules">${['ok', 'no', 'ask'].map(m => {
        const list = items.filter(x => x.mark === m && x.text);
        return list.length ? `<div class="rule-col r-${m}"><h3><span class="rm">${sym[m]}</span>${esc(L[m])}</h3><ul>${list.map(x => `<li>${nl(x.text)}</li>`).join('')}</ul></div>` : '';
      }).join('')}</div>`;
      break;
    }
    case 'gallery':
      body = `<div class="pgal c${Number(pg.cols) || 2}">${items.map(g => `
        <button type="button" class="pgal-it" data-cap="${esc(g.caption)}">
          ${g.image ? `<img src="${g.image}" alt="">` : '<div class="ph">IMAGE</div>'}
          ${g.caption ? `<span class="pgal-cap">${esc(g.caption)}</span>` : ''}
        </button>`).join('')}</div>`;
      break;
    case 'links':
      body = `<div class="plinks">${items.map(l => {
        const inner = `${l.emoji ? `<span class="lk-em">${esc(l.emoji)}</span>` : ''}<span class="lk-t">${esc(l.label)}</span>`;
        return l.url ? `<a class="lk-btn" href="${esc(l.url)}" target="_blank" rel="noopener">${inner}<span class="lk-ar">↗</span></a>` : `<span class="lk-btn">${inner}</span>`;
      }).join('')}</div>`;
      break;
  }
  if (!body.replace(/<[^>]+>/g, '').trim() && tb.type !== 'gallery') body = '<p class="empty">아직 내용이 없어요</p>';
  return `<div class="pg pg-${esc(tb.type)}" ${accentStyle(pg.accent)}>${pg.intro ? `<p class="tab-intro">${nl(pg.intro)}</p>` : ''}${body}</div>`;
}

function tabHTML(tb, d) {
  switch (tb.type) {
    case 'profile': return profileHTML(getPath(d, dataPath(tb)));
    case 'mains':   return mainsHTML(getPath(d, dataPath(tb)), d.labels);
    case 'others':  return othersHTML(getPath(d, dataPath(tb)), d.labels, tb.id);
    case 'friends': return friendsHTML(getPath(d, dataPath(tb)));
    default:        return pageHTML(tb, d.pages[tb.id] || {});
  }
}

function friendsHTML(f) {
  return `${f.intro ? `<p class="tab-intro">${nl(f.intro)}</p>` : ''}
    ${f.items.length ? `<div class="friends c${f.cols}">${f.items.map(x => `
      <div class="fr" ${accentStyle(x.accent)}>
        ${x.emoji ? `<div class="em">${esc(x.emoji)}</div>` : ''}
        <div class="fr-b">
          <h3>${esc(x.name)}</h3>
          ${x.desc ? `<p class="ds">${nl(x.desc)}</p>` : ''}
          ${x.link ? `<a class="lnk" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.linkText || '보러 가기')} ↗</a>` : ''}
        </div>
      </div>`).join('')}</div>` : `<p class="empty">아직 등록된 트친이 없어요</p>`}`;
}

/* =========================================================
   페이지 템플릿 (미리보기 = 내보내기 결과물)

function buildPage(d, init) {
  const t = d.theme, c = d.cover;
  const svg = (w, body) => `<svg viewBox="0 0 20 20" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
  const ico = {
    side:  svg(18, '<rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M7.5 4v12"/>'),
    back:  svg(18, '<path d="M12 4.5L6.5 10l5.5 5.5"/>'),
    fwd:   svg(18, '<path d="M8 4.5l5.5 5.5L8 15.5"/>'),
    lock:  '<svg viewBox="0 0 12 12" width="10" height="10"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M4 5V3.8a2 2 0 014 0V5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
    reload:svg(15, '<path d="M15.5 10a5.5 5.5 0 11-1.6-3.9M15.5 3.5v3h-3"/>'),
    share: svg(18, '<path d="M10 3v9M6.5 6.5L10 3l3.5 3.5M6 9.5H5v7h10v-7h-1"/>'),
    plus:  svg(18, '<path d="M10 4.5v11M4.5 10h11"/>'),
    tabs:  svg(18, '<rect x="3" y="6" width="10" height="10" rx="2"/><path d="M7 3.5h7.5A2 2 0 0116.5 5.5V13"/>'),
  };
  const bodyCls = init.opened ? 'opened no-anim' : (c.type === 'cake' && init.peek) ? 'popping no-anim' : '';
  const enterDelay = { cake: 1150, heart: 1250, dream: 1550 }[c.type] || 1200;

  return `<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(d.profile.name)}</title>
<link rel="stylesheet" href="${fontLink(d)}">
<style>
:root{--accent:${t.accent};--text:${t.text};--card:${t.card};
  --size:${Number(c.size) || 300}px;--hz:${Number(c.hz) || 84};--csize:${Number(c.cakeSize) || 400}px;
  --sx:${c.sx}%;--sy:${c.sy}%;--sw:${c.sw}%;--sr:${c.sr}deg;--lift:${c.lift}%;--pic:100;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --script:'Dancing Script','Nanum Pen Script',cursive}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--card)}
body{color:var(--text);font-family:'${t.font}',"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.7;overflow:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
.ph{width:100%;height:100%;background:repeating-linear-gradient(45deg,rgba(0,40,80,.035) 0 10px,rgba(0,40,80,.07) 10px 20px);display:flex;align-items:center;justify-content:center;color:rgba(0,30,60,.35);font-size:12px;letter-spacing:.1em}

/* ---------- 표지 ---------- */
${coverCSS(c)}

/* ---------- 사파리 창 (화면 전체) ---------- */

  background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 2px 10px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.9)}

.tab{position:relative;z-index:1;flex:1 1 0;min-width:${d.tabs.length > 4 ? '84px' : '0'};height:100%;border:0;background:none;padding:0 8px;border-radius:999px;cursor:pointer;

<script>
(function(){
  var tab = ${Number(init.tab) || 0};
  var address = ${safeJSON(d.address || '')};
  var names = ${safeJSON(d.tabs.map(x => x.name))};
  var body = document.body, root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var notify = function(m){ try{ parent !== window && parent.postMessage(Object.assign({__intro:1}, m), '*'); }catch(e){} };

  /* 탭 — 선택 표시(흰 알약)를 실제 탭 위치·너비에 맞춤 */
  function placeInd(i){
    var t = document.querySelector('.tab[data-tab="' + i + '"]'), bar = t && t.parentNode; if (!t) return;
    $('ind').style.width = t.offsetWidth + 'px';
    $('ind').style.transform = 'translateX(' + t.offsetLeft + 'px)';
    if (t.offsetLeft < bar.scrollLeft) bar.scrollLeft = t.offsetLeft - 6;
    else if (t.offsetLeft + t.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = t.offsetLeft + t.offsetWidth - bar.clientWidth + 6;
  }
  window.addEventListener('resize', function(){ placeInd(tab); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ placeInd(tab); });
  function show(i){
    tab = i;
    document.querySelectorAll('.tab').forEach(function(a){ a.classList.toggle('on', +a.dataset.tab === i); });
    document.querySelectorAll('section').forEach(function(s){ s.classList.toggle('on', +s.dataset.tab === i); });
    placeInd(i);
    $('addr').textContent = address + (address ? '/' : '') + (names[i] || '');
    $('content').scrollTop = 0;
    closeSheet();
    notify({ tab: i });
  }
  document.querySelectorAll('.tab').forEach(function(a){ a.addEventListener('click', function(){ body.classList.remove('no-anim'); show(+a.dataset.tab); }); });

  /* 표지 — 누르면 애니메이션 후 열림 */
  var busy = false;
  function enter(){
    if (busy) return; busy = true;
    body.classList.remove('no-anim');
    body.classList.add('popping');
    setTimeout(function(){ body.classList.add('opened'); busy = false; notify({ opened: true }); }, ${enterDelay});
  }
  document.querySelectorAll('.enter').forEach(function(el){
    el.addEventListener('click', enter);
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });
  });

  /* 드림코어 — 마우스/시간에 따라 공간이 살짝 기울어짐 */
  var cam = $('cam');
  if (cam) {
    var tx = 0, ty = 0, cx = 0, cy = 0, moved = false;
    window.addEventListener('pointermove', function(e){ moved = true; tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; });
    (function loop(t){
      if (!body.classList.contains('opened')) {
        var sx = moved ? tx : Math.sin(t / 3200) * .35, sy = moved ? ty : Math.cos(t / 4100) * .2;
        cx += (sx - cx) * .05; cy += (sy - cy) * .05;
        cam.style.transform = 'rotateY(' + (cx * 12).toFixed(2) + 'deg) rotateX(' + (-cy * 5).toFixed(2) + 'deg)';
      }
      requestAnimationFrame(loop);
    })(0);
  }

  /* 메인 페어 카드 뒤집기 */
  var flips = [].slice.call(document.querySelectorAll('.flip'));
  function flipState(){ return flips.map(function(f, i){ return f.classList.contains('on') ? i : -1; }).filter(function(i){ return i >= 0; }); }
  function setFlip(el, on){ body.classList.remove('no-anim'); el.classList.toggle('on', on); notify({ flips: flipState() }); }
  ${safeJSON(init.flips || [])}.forEach(function(i){ if (flips[i]) flips[i].classList.add('on'); });
  flips.forEach(function(el){
    el.addEventListener('click', function(e){ if (e.target.closest('.copyable, a')) return; setFlip(el, !el.classList.contains('on')); });
    el.addEventListener('keydown', function(e){ if (e.target === el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setFlip(el, !el.classList.contains('on')); } });
  });

  /* 서브 페어 세부 내용 */
  function openSheet(btn){
    var tpl = $('pd-' + btn.dataset.pd); if (!tpl) return;
    var box = $('sheetBody'), card = $('sheetCard');
    box.innerHTML = '';
    box.appendChild(tpl.content.cloneNode(true));
    box.querySelectorAll('img[data-from]').forEach(function(img){
      var p = img.dataset.from.split('-');
      var src = btn.querySelector('.' + p[1] + ' img');
      if (src) img.src = src.src;
    });
    if (btn.dataset.accent) card.style.setProperty('--accent', btn.dataset.accent); else card.style.removeProperty('--accent');
    $('sheet').classList.add('on');
  }
  function closeSheet(){ $('sheet').classList.remove('on'); }
  document.querySelectorAll('.dpw').forEach(function(b){ b.addEventListener('click', function(){ openSheet(b); }); });

  /* 서브 페어 목록 칩 */
  document.querySelectorAll('.gchips').forEach(function(bar){
    var wrap = bar.nextElementSibling;
    bar.addEventListener('click', function(e){
      var c = e.target.closest('.gchip'); if (!c) return;
      bar.querySelectorAll('.gchip').forEach(function(x){ x.classList.toggle('on', x === c); });
      var g = c.dataset.g;
      wrap.classList.toggle('filtered', g !== '*');
      var hasAll = !!bar.querySelector('[data-g="*"]');
      wrap.querySelectorAll('.sgrp').forEach(function(s){ s.hidden = g !== '*' && s.dataset.g !== g && (hasAll || s.dataset.g !== ''); });
    });
  });

  /* 갤러리 크게 보기 */
  document.querySelectorAll('.pgal-it').forEach(function(b){
    b.addEventListener('click', function(){
      var img = b.querySelector('img'); if (!img) return;
      var box = $('sheetBody'), card = $('sheetCard');
      box.innerHTML = '<div class="lb"><img alt=""></div>';
      box.querySelector('img').src = img.src;
      if (b.dataset.cap) { var cap = document.createElement('p'); cap.textContent = b.dataset.cap; box.firstChild.appendChild(cap); }
      var pg = b.closest('.pg'), acc = pg && pg.style.getPropertyValue('--accent');
      if (acc) card.style.setProperty('--accent', acc); else card.style.removeProperty('--accent');
      $('sheet').classList.add('on');
    });
  });
  $('xBtn').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

  /* 프롬프트 복사 */
  var toastT;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 1600); }
  function copy(text, btn){
    var done = function(){
      toast('프롬프트를 복사했어요'); btn.classList.add('copied'); btn.dataset.tip = '복사됨 ✓';
      setTimeout(function(){ btn.classList.remove('copied'); btn.dataset.tip = '눌러서 프롬프트 복사'; }, 1800);
    };
    var fallback = function(){
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? done() : toast('복사하지 못했어요'); } catch (e) { toast('복사하지 못했어요'); }
      ta.remove();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  document.addEventListener('click', function(e){
    var p = e.target.closest('.copyable[data-prompt]');
    if (p) copy(p.dataset.prompt, p);
  });
  document.addEventListener('keydown', function(e){
    var p = e.target.closest && e.target.closest('.copyable[data-prompt]');
    if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); copy(p.dataset.prompt, p); }
  }, true);

  /* 편집기 → 미리보기 */
  window.addEventListener('message', function(e){
    var m = e.data || {};
    if (m.__cmd === 'cover') { body.classList.add('no-anim'); body.classList.remove('opened', 'popping'); busy = false; }
    if (m.__cmd === 'peek') { body.classList.add('no-anim'); body.classList.remove('opened'); body.classList.toggle('popping', !!m.on); busy = false; }
    if (m.__cmd === 'tab') { body.classList.remove('no-anim'); body.classList.add('opened'); show(m.tab); }
    if (m.__cmd === 'flip' && flips[m.i]) setFlip(flips[m.i], !!m.on);
    if (m.__cmd === 'pic' && flips[m.i]) flips[m.i].querySelector('.back').style.setProperty('--pic', m.v);
    if (m.__cmd === 'vars') for (var k in m.vars) root.style.setProperty(k, m.vars[k]);
  });
  show(tab);
})();
<\/script>
</body></html>`;
}

// 편집기 탭: [키, 아이콘, 이름, 미리보기 화면(-1 표지 / 0~ 페이지 탭 순서)]
// 기본 탭은 종류 이름(profile 등)을, 템플릿 탭은 탭 id 를 키로 사용
const edKey = t => t.id;
const edTabList = () => [
  ['theme', '🎨', '테마'], ['cover', '✨', '표지', -1], ['window', '🧭', '탭 관리'],
  ...state.tabs.map((t, i) => [edKey(t), t.icon || (BUILTIN_TABS[t.type] || PAGE_TEMPLATES[t.type] || {}).icon || '📄', t.name || '탭', i]),
  ['deploy', '🚀', '배포'],
];
// 메인 페어 탭이 여러 개일 때, 미리보기의 카드 번호는 탭 순서대로 이어서 매겨짐
function mainsOffset(B) {
  let off = 0;
  for (const t of state.tabs) {
    if (t.type !== 'mains') continue;
    if (dataPath(t) === B) return off;
    off += (getPath(state, dataPath(t))?.items || []).length;
  }
  return off;
}

function imgField(path, label) {
  const v = getPath(state, path);
  return `<div class="f">${label}
    <div class="img-field">
      <div class="img-thumb" style="${v ? `background-image:url(${v})` : ''}"></div>
      <div class="btns">
        <button type="button" data-pick="${path}">${v ? '변경' : '선택'}</button>
        ${v ? `<button type="button" class="ghost danger" data-clear="${path}">비우기</button>` : ''}
      </div>
      <input type="file" accept="image/*" data-file="${path}">
    </div></div>`;
}
const text = (path, label, ph = '') => `<label class="f">${label}<input type="text" data-path="${path}" value="${esc(getPath(state, path))}" placeholder="${esc(ph)}"></label>`;
const url = (path, label, ph = 'https://') => `<label class="f">${label}<input type="url" data-path="${path}" value="${esc(getPath(state, path))}" placeholder="${esc(ph)}"></label>`;
const area = (path, label, rows = 4, ph = '') => `<label class="f">${label}<textarea rows="${rows}" data-path="${path}" placeholder="${esc(ph)}">${esc(getPath(state, path))}</textarea></label>`;
const color = (path, label) => `<label class="f">${label}<input type="color" data-path="${path}" value="${getPath(state, path)}"></label>`;
const check = (path, label) => `<label class="check"><input type="checkbox" data-path="${path}" ${getPath(state, path) ? 'checked' : ''}> ${label}</label>`;
const range = (path, label, min, max, unit = '') =>
  `<label class="f"><span>${label} <b class="val">${getPath(state, path)}${unit}</b></span><input type="range" min="${min}" max="${max}" data-path="${path}" data-num data-unit="${unit}" value="${getPath(state, path)}"></label>`;
const select = (path, label, options, num = false) => `<label class="f">${label}<select data-path="${path}" ${num ? 'data-num' : ''}>${Object.entries(options).map(([v, l]) => `<option value="${esc(v)}" ${String(getPath(state, path)) === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
const picker = (path, options, cls = '') => `<div class="layouts ${cls}">${Object.entries(options).map(([k, o]) => `
    <button type="button" class="lay ${getPath(state, path) === k ? 'on' : ''}" data-set="${path}" data-v="${k}">
      <svg viewBox="0 0 44 30">${o.icon}</svg>${o.label}
    </button>`).join('')}</div>`;
// 블록마다 따로 쓰는 포인트 색 (비워두면 테마 색)
const accentField = path => {
  const v = getPath(state, path);
  return `<div class="f">포인트 색 (이 블록만)
    <div class="acc"><input type="color" data-path="${path}" value="${isHex(v) ? v : state.theme.accent}">

};

// 목록 항목 제목 — 항목 모양으로 종류를 판단 (같은 종류 탭이 여러 개여도 동작)
function itemTitle(listPath, it) {
  if (it.a && it.b) {
    if (it.kind === 'solo') return `● ${it.a.name || '이름'} · 단독`;
    return it.title || `${it.a.name || '캐릭터'} × ${it.b.name || '유저'}`;
  }
  if ('linkText' in it) return `${it.emoji || ''} ${it.name || '이름 없음'}`.trim();
  return (it.title || it.q || (it.label ? `${it.emoji || ''} ${it.label}` : '') || it.caption || it.text || '항목').trim();
}
function refreshTitles() {
  document.querySelectorAll('details.item[data-sec]').forEach(d => {
    const key = d.dataset.sec, it = getPath(state, key), t = d.querySelector(':scope > summary .ttl');
    if (it && t) t.textContent = itemTitle(key.slice(0, key.lastIndexOf('.')), it);
  });
}

const forceOpen = new Set();
// nav 를 주면 목록 안에서 실제로 위/아래에 보이는 항목과 자리를 바꿈 (세부 탭으로 걸러본 목록용)
function itemCard(listPath, i, len, title, bodyHTML, isOpen, accent, nav) {
  const key = `${listPath}.${i}`;
  const up = nav ? nav.prev : (i === 0 ? -1 : i - 1);
  const dn = nav ? nav.next : (i === len - 1 ? -1 : i + 1);
  return `<details class="item" data-sec="${key}" ${isOpen(key) || forceOpen.has(key) ? 'open' : ''}>
    <summary><span class="dot" style="background:${isHex(accent) ? accent : state.theme.accent}"></span><span class="ttl">${title}</span>
      <button type="button" class="ghost" data-move="${listPath}" data-i="${i}" data-j="${up}" ${up < 0 ? 'disabled' : ''}>↑</button>
      <button type="button" class="ghost" data-move="${listPath}" data-i="${i}" data-j="${dn}" ${dn < 0 ? 'disabled' : ''}>↓</button>
      <button type="button" class="ghost danger" data-del="${listPath}" data-i="${i}">삭제</button>
    </summary>
    <div class="item-body">${bodyHTML}</div>
  </details>`;
}

      <p class="hint">'접기'를 켠 항목은 제목만 보이고, 누르면 내용이 펼쳐져요. 지뢰·주의사항처럼 긴 내용에 좋아요.</p>

}

// 서브 페어 탭 안의 '세부 탭' — 현재 고른 세부 탭 ('*' 전체 / '' 공통 / 세부 탭 id)
function curSub(B, O) {
  const groups = O.groups || [];
  const sub = view.sub || (view.sub = {});
  let cur = sub[B] ?? '*';
  if (!groups.length) cur = '*';
  else if (cur !== '*' && cur !== '' && !groups.some(g => g.id === cur)) cur = '*';
  sub[B] = cur;
  return cur;
}

function othersPanel(B, isOpen) {
  const L = state.labels, O = getPath(state, B), groups = O.groups || (O.groups = []);
  const gid = g => groups.some(x => x.id === g) ? g : '';
  const cur = curSub(B, O);
  const countOf = k => O.items.filter(p => gid(p.group) === k).length;
  const free = countOf('');

  // ── 세부 탭 고르는 줄
  const chip = (k, label, n) => `<button type="button" class="subtab ${cur === k ? 'on' : ''}" data-subtab="${esc(k)}" data-base="${B}">${esc(label)}${n === null ? '' : `<span class="n">${n}</span>`}</button>`;
  const chips = `<div class="subtabs">
    ${groups.length ? chip('*', '전체', O.items.length) : ''}
    ${groups.length ? chip('', '공통', free) : ''}
    ${groups.map(g => chip(g.id, g.title || '이름 없음', countOf(g.id))).join('')}
    <button type="button" class="subtab new" data-addgroup data-base="${B}">+ 세부 탭</button>
  </div>`;

  // ── 고른 세부 탭 설정 / 전체일 때의 표시 방식
  const gi = groups.findIndex(g => g.id === cur);
  let head = '';
  if (gi >= 0) {
    const g = groups[gi];
    head = `<div class="card">
      <p class="card-title">🗂 세부 탭 설정</p>
      <div class="grp-row">
        <input type="text" data-path="${B}.groups.${gi}.title" value="${esc(g.title || '')}" placeholder="세부 탭 이름">
        <button type="button" class="ghost" data-move="${B}.groups" data-i="${gi}" data-dir="-1" ${gi === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="ghost" data-move="${B}.groups" data-i="${gi}" data-dir="1" ${gi === groups.length - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="ghost danger" data-delgroup="${gi}" data-base="${B}">삭제</button>
      </div>
      <textarea rows="2" data-path="${B}.groups.${gi}.intro" placeholder="이 세부 탭 상단 문구 (선택)">${esc(g.intro || '')}</textarea>
      <p class="hint">아래에서 추가하는 항목은 이 세부 탭에 들어가요. 세부 탭을 지워도 안에 있던 항목은 '공통'으로 남아요.</p>
    </div>`;
  } else if (cur === '') {
    head = `<p class="hint">'공통' 항목은 어느 세부 탭을 골라도 항상 맨 위에 보여요.</p>`;
  } else if (groups.length) {
    head = `<div class="card">
      <p class="card-title">🐳 완성된 페이지에서 보여주는 방식</p>
      ${select(B + '.groupStyle', '세부 탭 표시', { title: '제목으로 구분해서 이어 보기', chips: '위쪽 작은 탭으로 골라 보기' })}
      ${O.groupStyle === 'chips' ? check(B + '.showAll', "맨 앞에 '전체' 탭 넣기") : ''}
      ${O.groupStyle === 'chips' && O.showAll === false ? '<p class="hint">전체 탭이 없으면 첫 번째 세부 탭이 먼저 보여요.</p>' : ''}
      <button type="button" class="add" data-autogroup data-base="${B}">✨ 페어 · 애호캐 · 유저캐로 자동 나누기</button>
    </div>`;
  } else {
    head = `<p class="hint">'+ 세부 탭'으로 항목을 나눠 담을 수 있어요. 완성된 페이지에서도 제목이나 작은 탭으로 나눠서 보여줘요.</p>`;
  }

  // ── 항목 하나 편집칸
  const itemBody = (p, i) => {
    const P = `${B}.items.${i}`, solo = p.kind === 'solo';
    return `
      ${groups.length ? select(`${P}.group`, '세부 탭', Object.fromEntries([['', '공통 (항상 맨 위)'], ...groups.map(g => [g.id, g.title || '이름 없는 세부 탭'])])) : ''}
      <div class="f">형태${picker(`${P}.kind`, PAIR_KINDS, 'two')}</div>
      ${solo ? select(`${P}.role`, '누구인가요', { a: `🤖 캐릭터 (${L.a})`, b: `🙋 유저 (${L.b})` }) : ''}
      ${accentField(`${P}.accent`)}
      ${solo
        ? charEditor(`${P}.a`, p.role === 'b' ? `🙋 ${esc(L.b)}` : `🤖 ${esc(L.a)}`, { meta: p.role !== 'b', imgLabel: '사진' })
        : `${charEditor(`${P}.a`, `🤖 왼쪽 · ${esc(L.a)}`, { imgLabel: '사진' })}
           ${charEditor(`${P}.b`, `🙋 오른쪽 · ${esc(L.b)}`, { meta: false, imgLabel: '사진' })}`}`;
  };
  // 걸러낸 목록 안에서 위/아래 항목끼리만 자리를 바꾸도록 실제 번호를 넘겨줌
  const listOf = entries => entries.map(([p, i], n) => itemCard(B + '.items', i, O.items.length, esc(itemTitle(B + '.items', p)),
    itemBody(p, i), isOpen, p.accent, { prev: n > 0 ? entries[n - 1][1] : -1, next: n < entries.length - 1 ? entries[n + 1][1] : -1 })).join('');
  const entriesOf = k => O.items.map((p, i) => [p, i]).filter(([p]) => gid(p.group) === k);

  let list;
  if (cur === '*' && groups.length) {
    // 전체 보기 — 세부 탭별로 모아서
    const sec = (title, k) => {
      const e = entriesOf(k);
      return e.length ? `<p class="sec-head">${esc(title)}<span class="n">${e.length}</span></p>${listOf(e)}` : '';
    };
    list = sec('공통 · 항상 맨 위', '') + groups.map(g => sec(g.title || '이름 없는 세부 탭', g.id)).join('');
  } else {
    list = listOf(cur === '*' ? O.items.map((p, i) => [p, i]) : entriesOf(cur));
  }
  if (!list) list = '<p class="hint">이 세부 탭에는 아직 항목이 없어요. 아래에서 추가해 주세요.</p>';

  const grp = cur === '*' ? '' : cur;
  return `
    <details class="item" data-sec="${B}.__opts" ${isOpen(`${B}.__opts`) ? 'open' : ''}>
      <summary><span class="ttl">⚙️ 탭 전체 설정 · 모양</span></summary>
      <div class="item-body">
        <div class="row">${colsSelect(B + '.cols', '개')}${select(B + '.namePos', '이름 위치', { in: '알약 안 아래쪽', below: '알약 바로 밑' })}</div>
        <div class="row">${select(B + '.nameFont', '이름 글꼴', { body: '본문 글꼴', serif: '명조', script: '필기체' })}${check(B + '.showName', '알약에 이름 표시')}</div>
        ${text(B + '.intro', '탭 상단 문구 (선택)')}
        <p class="hint">필기체는 영문이 가장 예쁘게 나와요. 한글은 손글씨체로 보여요.</p>
      </div>
    </details>
    ${chips}
    ${head}
    ${list}
    <div class="row">
      <button type="button" class="add" data-additem="${B}" data-type="others" data-grp="${esc(grp)}">+ 페어 추가 (알약)</button>
      <button type="button" class="add" data-additem="${B}" data-type="others" data-kind="solo" data-grp="${esc(grp)}">+ 단독 추가 (동그라미)</button>
    </div>
    <p class="hint">단독 항목이 연달아 있으면 한 줄에 동그라미로 모여요. 순서는 ↑↓로 바꿀 수 있어요.</p>`;
}

function renderEdTabs() {
  $('#edTabs').innerHTML = edTabList().map(([k, ic, label]) =>
    `<button type="button" class="ed-tab ${view.edTab === k ? 'on' : ''}" data-edtab="${esc(k)}" title="${esc(label)}"><span class="ic">${esc(ic)}</span><span class="lb">${esc(label)}</span></button>`).join('');
  const on = $('#edTabs .ed-tab.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function tabsPanel() {
  const full = state.tabs.length >= MAX_TABS;
  const typeName = t => (BUILTIN_TABS[t.type] || PAGE_TEMPLATES[t.type] || {}).name || t.type;
  return `
    ${text('address', '주소창 문구')}
    <p class="grp">탭 목록 (${state.tabs.length}/${MAX_TABS})</p>
    ${state.tabs.map((tb, i, arr) => `
      <div class="tab-row">
        <input type="text" data-path="tabs.${i}.icon" value="${esc(tb.icon)}" title="아이콘 (이모지)">
        <input type="text" data-path="tabs.${i}.name" value="${esc(tb.name)}" placeholder="탭 이름">
        <span class="badge">${esc(typeName(tb))}</span>
        <button type="button" class="ghost" data-move="tabs" data-i="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="ghost" data-move="tabs" data-i="${i}" data-dir="1" ${i === arr.length - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="ghost danger" data-deltab="${i}" ${arr.length <= 1 ? 'disabled' : ''}>삭제</button>
      </div>`).join('')}
    <p class="grp">탭 추가 · 템플릿</p>
    <div class="tpls">
      ${[...Object.entries(BUILTIN_TABS), ...Object.entries(PAGE_TEMPLATES)].map(([k, t]) => {
        return `<button type="button" class="tpl" data-addtab="${k}" ${full ? 'disabled' : ''}>
          <span class="ic">${t.icon}</span><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></button>`;
      }).join('')}
    </div>
    <p class="hint">같은 종류 탭도 여러 개 만들 수 있고, 탭마다 내용이 따로 저장돼요. 처음부터 있던 기본 탭은 삭제해도 내용이 남아서 다시 추가하면 돌아오고, 새로 추가한 탭은 삭제하면 내용도 지워져요 (↶ 되돌리기 가능).</p>`;
}

function pagePanel(tb, isOpen) {
  const P = `pages.${tb.id}`;
  const pg = state.pages[tb.id] || (state.pages[tb.id] = (PAGE_TEMPLATES[tb.type] || PAGE_TEMPLATES.text).make());
  const items = pg.items || (pg.items = []);
  const list = `${P}.items`;
  const add = label => `<button type="button" class="add" data-addto="${list}" data-tpl="${tb.type}">+ ${label}</button>`;
  let body = '';
  switch (tb.type) {
    case 'text':
      body = items.map((b, i, arr) => itemCard(list, i, arr.length, esc(b.title || '블록'), `
        ${text(`${list}.${i}.title`, '소제목 (선택)')}
        ${area(`${list}.${i}.body`, '내용', 5)}`, isOpen)).join('') + add('블록 추가');
      break;
    case 'qna':
      body = check(`${P}.fold`, '답변 접어두기 (질문을 누르면 펼쳐져요)')
        + items.map((x, i, arr) => itemCard(list, i, arr.length, esc(x.q || '질문'), `
        ${text(`${list}.${i}.q`, '질문')}
        ${area(`${list}.${i}.a`, '답변', 3)}`, isOpen)).join('') + add('질문 추가');
      break;
    case 'rules':
      body = `<div class="row3">${text(`${P}.labels.ok`, '○ 제목')}${text(`${P}.labels.no`, '✕ 제목')}${text(`${P}.labels.ask`, '△ 제목')}</div>
        <div class="f">항목
          ${items.map((x, i) => `
            <div class="rule-row">
              <select data-path="${list}.${i}.mark">${[['ok', '○ ' + (pg.labels?.ok || '가능')], ['no', '✕ ' + (pg.labels?.no || '불가')], ['ask', '△ ' + (pg.labels?.ask || '물어보기')]].map(([v, l]) => `<option value="${v}" ${x.mark === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
              <input type="text" data-path="${list}.${i}.text" value="${esc(x.text)}" placeholder="내용">
              <button type="button" class="ghost danger" data-del="${list}" data-i="${i}">✕</button>
            </div>`).join('')}
        </div>` + add('항목 추가');
      break;
    case 'gallery':
      body = `<div class="row">${select(`${P}.cols`, '한 줄에', { 1: '1장씩 (원본 비율)', 2: '2장씩', 3: '3장씩' }, true)}</div>`
        + items.map((g, i, arr) => itemCard(list, i, arr.length, esc(g.caption || `사진 ${i + 1}`), `
        ${imgField(`${list}.${i}.image`, '사진')}
        ${text(`${list}.${i}.caption`, '설명 (선택)')}`, isOpen)).join('') + add('사진 추가');
      break;
    case 'links':
      body = items.map((l, i, arr) => itemCard(list, i, arr.length, esc(`${l.emoji || ''} ${l.label || '링크'}`), `
        <div class="row-icon">
          <label class="f">이모지<input type="text" data-path="${list}.${i}.emoji" value="${esc(l.emoji)}"></label>
          ${text(`${list}.${i}.label`, '버튼 이름')}
        </div>
        ${url(`${list}.${i}.url`, '주소')}`, isOpen)).join('') + add('링크 추가');
      break;
  }
  return `
    ${text(`${P}.intro`, '탭 상단 문구 (선택)')}
    ${accentField(`${P}.accent`)}
    ${body}`;
}

function renderEditor(resetScroll = false) {
  const openSecs = [...document.querySelectorAll('details[open]')].map(d => d.dataset.sec);
  const scrollTop = resetScroll ? 0 : $('#edScroll').scrollTop;
  const isOpen = k => openSecs.includes(k);

  if (!edTabList().some(t => t[0] === view.edTab)) view.edTab = 'window';
  renderEdTabs();

  const L = state.labels;
  const panels = {
    theme: () => ['🎨 테마', '', `
      <div class="row">${color('theme.accent', '포인트 색 (전체)')}${color('theme.text', '글자 색')}</div>
      <div class="row">${color('theme.card', '페이지 배경')}
        <label class="f">본문 글꼴<select data-path="theme.font">${FONTS.map(f => `<option ${f === state.theme.font ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
      </div>
      <div class="row">${text('labels.a', '캐릭터 이름표')}${text('labels.b', '유저 이름표')}</div>
      <p class="hint">블록마다 포인트 색을 따로 정하고 싶다면 각 탭의 항목 안에서 '포인트 색 (이 블록만)'을 바꿔주세요.</p>`],
    cover: () => ['✨ 표지', COVER_TYPES[state.cover.type]?.label, coverPanel()],
    window: () => ['🧭 탭 관리', `${state.tabs.length}개`, tabsPanel()],
    deploy: () => ['🚀 사이트에 올리기', 'GitHub Pages', deployPanel()],
  };
  const tb = state.tabs.find(t => t.id === view.edTab);
  let title, badge, html;
  if (tb) {
    const B = dataPath(tb), data = getPath(state, B) || {};
    title = `${esc(tb.icon || '📄')} ${esc(tb.name || '탭')}`;
    const count = (data.items || []).length;
    [badge, html] = {
      profile: () => ['내 정보', profilePanel(B)],
      mains:   () => [`메인 페어 · ${count}개`, mainsPanel(B, isOpen)],
      others:  () => [`서브 페어 · ${count}개`, othersPanel(B, isOpen)],
      friends: () => [`트친 소개 · ${count}명`, friendsPanel(B, isOpen)],
    }[tb.type]?.() || [(PAGE_TEMPLATES[tb.type] || {}).name, pagePanel(tb, isOpen)];
  } else {
    [title, badge, html] = (panels[view.edTab] || panels.cover)();
  }
  $('#edScroll').innerHTML = `<div class="panel">
    <div class="panel-head"><h2>${title}</h2>${badge ? `<span class="badge">${esc(badge)}</span>` : ''}</div>
    ${html}
  </div>`;
  forceOpen.clear();
  $('#edScroll').scrollTop = scrollTop;
}

/* =========================================================
   GitHub Pages 배포 — 설정·토큰은 이 브라우저에만 저장 (프로젝트 .json 에는 넣지 않음)
   ========================================================= */
const DEPLOY_KEY = 'twt-intro-deploy';
const DEPLOY_BLANK = { owner: '', repo: '', branch: 'main', path: 'index.html', token: '' };
let deployCfg = (() => { try { return Object.assign({}, DEPLOY_BLANK, JSON.parse(localStorage.getItem(DEPLOY_KEY) || '{}')); } catch (_) { return { ...DEPLOY_BLANK }; } })();
let deployStatus = { kind: '', msg: '', url: '' };
function saveDeployCfg() { try { localStorage.setItem(DEPLOY_KEY, JSON.stringify(deployCfg)); } catch (_) {} }

const cfgTrim = () => ({ owner: deployCfg.owner.trim(), repo: deployCfg.repo.trim(), branch: deployCfg.branch.trim() || 'main', path: deployCfg.path.trim().replace(/^\/+/, '') || 'index.html', token: deployCfg.token.trim() });
function siteUrl(c) {
  const base = c.repo.toLowerCase() === `${c.owner.toLowerCase()}.github.io` ? `https://${c.owner}.github.io/` : `https://${c.owner}.github.io/${c.repo}/`;
  return c.path === 'index.html' ? base : base + c.path;
}
const deployReady = () => { const c = cfgTrim(); return !!(c.owner && c.repo && c.token); };

async function gh(method, url, body) {
  const res = await fetch('https://api.github.com' + url, {
    method,
    headers: { Authorization: `Bearer ${cfgTrim().token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  return { ok: res.ok, status: res.status, data };
}
function ghError(r) {
  if (r.status === 401) return '토큰이 올바르지 않거나 만료됐어요. 토큰을 다시 붙여넣어 주세요.';
  if (r.status === 403) return '토큰에 이 저장소 권한이 없어요. 토큰 설정에서 이 저장소를 고르고 Contents 권한을 Read and write로 해주세요.';
  if (r.status === 404) return '저장소를 찾을 수 없어요. 아이디·저장소 이름이 맞는지, 토큰을 만들 때 이 저장소를 골랐는지 확인해주세요.';
  if (r.status === 409) return '저장소가 비어 있어요. 저장소를 만들 때 README 추가를 체크하거나, 아무 파일이나 하나 올린 뒤 다시 시도해주세요.';
  return `GitHub 오류 (${r.status}) ${r.data?.message || ''}`;
}
// UTF-8 문자열 → base64 (한글·이모지 포함)
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

const deployStatusHTML = () => deployStatus.kind
  ? `<p class="dp-status ${deployStatus.kind}" id="dpStatus">${esc(deployStatus.msg)}${deployStatus.url ? `<br>👉 <a href="${esc(deployStatus.url)}" target="_blank" rel="noopener">${esc(deployStatus.url)}</a>` : ''}</p>`
  : '<p id="dpStatus" hidden></p>';
function setDeploy(kind, msg, url = '') {
  deployStatus = { kind, msg, url };
  const box = $('#dpStatus');
  if (box) box.outerHTML = deployStatusHTML();
  document.querySelectorAll('#dpGo, #dpCheck, #dpLoad, #btnDeploy').forEach(b => { b.disabled = kind === 'busy'; });
}

async function checkDeploy() {
  const c = cfgTrim();
  if (!deployReady()) return setDeploy('err', '아이디, 저장소 이름, 토큰을 모두 입력해주세요.');
  setDeploy('busy', '연결 확인 중…');
  try {
    const r = await gh('GET', `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`);
    if (!r.ok) return setDeploy('err', ghError(r));
    const warn = r.data.private ? ' 단, 비공개 저장소는 무료 계정에서 GitHub Pages가 열리지 않으니 Public으로 바꿔주세요.' : '';
    setDeploy('ok', `연결됐어요: ${r.data.full_name}.${warn}`);
  } catch (e) {
    setDeploy('err', '인터넷 연결을 확인해주세요. (' + e.message + ')');
  }
}

// 편집용 프로젝트 파일: 페이지 파일과 같은 폴더의 intro-project.json
const projectPath = c => c.path.replace(/[^/]*$/, '') + 'intro-project.json';
const encPath = path => path.split('/').map(encodeURIComponent).join('/');

// 파일 하나를 올리기 (이미 있으면 덮어쓰기)
async function ghPutFile(repoPath, branch, path, text, message) {
  const cur = await gh('GET', `${repoPath}/contents/${encPath(path)}?ref=${encodeURIComponent(branch)}`);
  if (!cur.ok && cur.status !== 404) return cur;
  return gh('PUT', `${repoPath}/contents/${encPath(path)}`, {
    message, content: b64utf8(text), branch,
    ...(cur.ok && cur.data?.sha ? { sha: cur.data.sha } : {}),
  });
}

async function loadFromGitHub() {
  const c = cfgTrim();
  if (!deployReady()) return setDeploy('err', '아이디, 저장소 이름, 토큰을 모두 입력해주세요.');
  if (!confirm('GitHub에 올려둔 내용으로 지금 편집 중인 내용을 바꿀까요?\n(바꾼 뒤에도 ↶ 되돌리기로 돌아올 수 있어요)')) return;
  const repoPath = `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
  try {
    setDeploy('busy', 'GitHub에서 불러오는 중…');
    // raw 형식으로 받으면 1MB가 넘는 파일도 그대로 받아짐
    const res = await fetch(`https://api.github.com${repoPath}/contents/${encPath(projectPath(c))}?ref=${encodeURIComponent(c.branch)}`, {
      headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28' },
    });
    if (res.status === 404) return setDeploy('err', `저장소에 편집용 파일(${projectPath(c)})이 없어요. 이 기능을 넣기 전에 올린 페이지라면, 지금 내용으로 한 번 다시 올린 뒤부터 불러올 수 있어요.`);
    if (!res.ok) return setDeploy('err', ghError({ status: res.status, data: await res.json().catch(() => null) }));
    const data = JSON.parse(await res.text());
    state = migrate(data);
    view.flips = []; view.tab = 0;
    update({ editor: true });
    setDeploy('ok', 'GitHub에 올려둔 내용을 불러왔어요. 이어서 편집하고 다시 올리면 돼요.');
  } catch (e) {
    setDeploy('err', '불러오지 못했어요. (' + e.message + ')');
  }
}

async function runDeploy() {
  const c = cfgTrim();
  if (!deployReady()) return setDeploy('err', '아이디, 저장소 이름, 토큰을 모두 입력해주세요.');
  const repoPath = `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
  try {
    setDeploy('busy', '페이지를 만드는 중…');
    const html = buildPage(state, { opened: false, tab: 0 });

    const stamp = new Date().toLocaleString('ko-KR');
    setDeploy('busy', `페이지 올리는 중… (${(html.length / 1048576).toFixed(1)}MB)`);
    const put = await ghPutFile(repoPath, c.branch, c.path, html, `자기소개 페이지 업데이트 (${stamp})`);
    if (!put.ok) return setDeploy('err', ghError(put));

    // 다른 곳에서도 이어서 편집할 수 있도록 편집용 파일도 함께 올림 (배포 설정·토큰은 들어가지 않음)
    setDeploy('busy', '편집용 파일 올리는 중…');
    const proj = await ghPutFile(repoPath, c.branch, projectPath(c), JSON.stringify(state), `편집용 파일 업데이트 (${stamp})`);
    if (!proj.ok) return setDeploy('err', '페이지는 올렸지만 편집용 파일은 올리지 못했어요. ' + ghError(proj));

    // GitHub Pages 가 꺼져 있으면 켜보기 (토큰에 Pages 권한이 없으면 안내만)
    let note = '반영까지 보통 1분쯤 걸려요.';
    const pages = await gh('GET', `${repoPath}/pages`);
    if (pages.status === 404) {
      const on = await gh('PUT', `${repoPath}/pages`, { source: { branch: c.branch, path: '/' } });
      note = on.ok
        ? 'GitHub Pages도 켰어요. 처음에는 주소가 열리기까지 1~3분 걸려요.'
        : 'GitHub Pages가 아직 꺼져 있어요. 저장소 Settings → Pages에서 Branch를 main / (root)로 저장해주세요.';
    }
    setDeploy('ok', `올렸어요! ${note}`, siteUrl(c));
  } catch (e) {
    setDeploy('err', '올리지 못했어요. 인터넷 연결을 확인해주세요. (' + e.message + ')');
  }
}

    ${!ready ? '<p class="hint">처음이라면 아래 설정 방법을 먼저 따라 해주세요.</p>' : ''}
    <details class="guide" ${ready ? '' : 'open'}>

        <li><b>Public</b> 선택 (무료 계정은 공개 저장소만 Pages 가능)</li>
