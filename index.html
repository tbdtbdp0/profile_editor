/* =========================================================
   미리보기 갱신 / 저장
   ========================================================= */
let renderTimer;
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 용량 초과 시 무시 */ } }
/* 되돌리기 · 다시 실행 — 입력이 멈춘 뒤 한 번씩 스냅샷 저장 */
const undoStack = [], redoStack = [];
let lastSnap = JSON.stringify(state), snapTimer = null;
function snapshot() {
  snapTimer = null;
  const now = JSON.stringify(state);
  if (now === lastSnap) return;
  undoStack.push(lastSnap);
  if (undoStack.length > 40) undoStack.shift();
  redoStack.length = 0;
  lastSnap = now;
  syncUndoButtons();
}
function commit() { clearTimeout(snapTimer); snapTimer = setTimeout(snapshot, 500); }
function syncUndoButtons() { $('#btnUndo').disabled = !undoStack.length; $('#btnRedo').disabled = !redoStack.length; }
function restore(from, to) {
  if (snapTimer) { clearTimeout(snapTimer); snapshot(); }
  if (!from.length) return;
  to.push(lastSnap);
  lastSnap = from.pop();
  state = JSON.parse(lastSnap);
  view.flips = [];
  syncUndoButtons();
  renderEditor();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { $('#pv').srcdoc = buildPage(state, view); save(); }, 50);
}
const undo = () => restore(undoStack, redoStack);
const redo = () => restore(redoStack, undoStack);

function update({ editor = false } = {}) {
  commit();
  if (editor) renderEditor();
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { $('#pv').srcdoc = buildPage(state, view); save(); }, 150);
}
const send = msg => $('#pv').contentWindow?.postMessage(msg, '*');

function syncFlipButtons() {
  document.querySelectorAll('[data-flipi]').forEach(b => {
    const on = view.flips.includes(+b.dataset.flipi);
    b.classList.toggle('on', on); b.textContent = on ? '↺ 앞면 보기' : '↻ 뒷면 보기';
  });
}

window.addEventListener('message', e => {
  const m = e.data;
  if (!m || !m.__intro) return;
  if ('tab' in m) view.tab = m.tab;
  if ('opened' in m) { view.opened = m.opened; view.peek = false; }
  if ('flips' in m) { view.flips = m.flips; syncFlipButtons(); }
});

function goEdTab(key) {
  view.edTab = key;
  const target = edTabList().find(t => t[0] === key)?.[3];
  if (target === -1) { view.opened = false; send(view.peek ? { __cmd: 'peek', on: true } : { __cmd: 'cover' }); }
  else if (target !== undefined) { view.opened = true; view.peek = false; view.tab = target; send({ __cmd: 'tab', tab: target }); }
  renderEditor(true);
}
$('#edTabs').addEventListener('click', e => { const b = e.target.closest('[data-edtab]'); if (b) goEdTab(b.dataset.edtab); });

/* ---------- 이벤트 ---------- */
const ed = $('#edScroll');
// 슬라이더 값은 미리보기를 다시 그리지 않고 바로 반영 (깜빡임 방지)
const LIVE = /^cover\.(size|hz|cakeSize|sx|sy|sw|sr|lift)$/;
const PIC = /^(.+)\.items\.(\d+)\.picSize$/;

function onField(e) {
  const el = e.target, path = el.dataset.path;
  if (!path) return;
  const v = el.type === 'checkbox' ? el.checked : el.dataset.num !== undefined ? Number(el.value) : el.value;
  if (getPath(state, path) === v) return;
  setPath(state, path, v);

  if (el.type === 'range') {
    const val = el.parentElement.querySelector('.val');
    if (val) val.textContent = v + (el.dataset.unit || '');
  }
  if (LIVE.test(path)) {
    const c = state.cover;
    send({ __cmd: 'vars', vars: { '--size': c.size + 'px', '--hz': c.hz, '--csize': c.cakeSize + 'px', '--sx': c.sx + '%', '--sy': c.sy + '%', '--sw': c.sw + '%', '--sr': c.sr + 'deg', '--lift': c.lift + '%' } });
    clearTimeout(renderTimer); renderTimer = setTimeout(save, 300);
    return commit();
  }
  const pm = path.match(PIC);
  if (pm && state.tabs.some(t => t.type === 'mains' && dataPath(t) === pm[1])) {
    send({ __cmd: 'pic', i: mainsOffset(pm[1]) + +pm[2], v });
    clearTimeout(renderTimer); renderTimer = setTimeout(save, 300);
    return commit();
  }
  // 입력 중에 편집기를 다시 그리면 한글 조합이 깨지므로, 목록 제목 글자만 따로 갱신
  if ((el.type === 'checkbox' && /\.fold$/.test(path)) || /\.(picShape|role|groupStyle|showAll|group)$/.test(path)) renderEditor();
  else refreshTitles();
  if (/^tabs\.\d+\.(name|icon)$/.test(path)) renderEdTabs();
  update();
}
ed.addEventListener('input', onField);
// 배포 설정 칸 (프로젝트 데이터와 별도)
ed.addEventListener('input', e => {
  const k = e.target.dataset.dp;
  if (!k) return;
  deployCfg[k] = e.target.value;
  saveDeployCfg();
});

ed.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'dpCheck') return checkDeploy();
  if (b.id === 'dpGo') return runDeploy();
  if (b.id === 'dpLoad') return loadFromGitHub();
  if (b.id === 'dpForget') { deployCfg.token = ''; saveDeployCfg(); setDeploy('', ''); return renderEditor(); }
  if (b.closest('summary')) e.preventDefault();
  const d = b.dataset;
  if (d.flipi !== undefined) {
    const i = +d.flipi, on = !view.flips.includes(i);
    view.flips = on ? [...view.flips, i] : view.flips.filter(x => x !== i);
    const ti = +d.tabi;
    if (ti >= 0) { view.opened = true; view.tab = ti; send({ __cmd: 'tab', tab: ti }); }
    send({ __cmd: 'flip', i, on });
    return syncFlipButtons();
  }
  // 탭 추가 / 삭제
  if (d.addtab) {
    if (state.tabs.length >= MAX_TABS) return;
    const k = d.addtab, t = BUILTIN_TABS[k] || PAGE_TEMPLATES[k];
    // 기본 탭 원본이 비어 있으면 원본 자리로(예전 내용 복귀), 이미 있으면 새 내용으로 복제
    const id = BUILTIN_TABS[k] && !state.tabs.some(x => x.id === k) ? k : 'p' + Date.now().toString(36);
    const tb = { id, type: k, name: t.name, icon: t.icon };
    if (id !== k) state.pages[id] = BUILTIN_TABS[k] ? clone(DEFAULT[k]) : PAGE_TEMPLATES[k].make();
    state.tabs.push(tb);
    update();
    return goEdTab(edKey(tb));
  }
  if (d.deltab !== undefined) {
    const [tb] = state.tabs.splice(+d.deltab, 1);
    if (tb && tb.id !== tb.type) delete state.pages[tb.id];
    view.tab = Math.min(view.tab, state.tabs.length - 1); view.flips = [];
    return update({ editor: true });
  }
  // 템플릿 탭 항목 추가
  if (d.addto) {
    const arr = getPath(state, d.addto);
    arr.push((PAGE_ITEM[d.tpl] || PAGE_ITEM.text)());
    forceOpen.add(`${d.addto}.${arr.length - 1}`);
    return update({ editor: true });
  }
  // 서브 페어 세부 탭
  if (d.subtab !== undefined) {
    (view.sub || (view.sub = {}))[d.base] = d.subtab;
    return renderEditor();
  }
  if (d.addgroup !== undefined) {
    const g = getPath(state, d.base).groups, id = 'g' + Date.now().toString(36);
    g.push({ id, title: `세부 탭 ${g.length + 1}`, intro: '' });
    (view.sub || (view.sub = {}))[d.base] = id;
    return update({ editor: true });
  }
  if (d.delgroup !== undefined) {
    const O = getPath(state, d.base), [g] = O.groups.splice(+d.delgroup, 1);
    O.items.forEach(it => { if (g && it.group === g.id) it.group = ''; });
    (view.sub || (view.sub = {}))[d.base] = '*';
    return update({ editor: true });
  }
  if (d.autogroup !== undefined) {
    const O = getPath(state, d.base), g = O.groups, want = [['pair', '페어'], ['a', '애호캐'], ['b', '유저캐']];
    const ids = Object.fromEntries(want.map(([k, title], n) => {
      let found = g.find(x => x.title === title);
      if (!found) { found = { id: 'g' + (Date.now() + n).toString(36), title }; g.push(found); }
      return [k, found.id];
    }));
    O.items.forEach(it => { it.group = it.kind === 'solo' ? ids[it.role === 'b' ? 'b' : 'a'] : ids.pair; });
    (view.sub || (view.sub = {}))[d.base] = '*';
    return update({ editor: true });
  }
  if (b.id === 'btnPeek') {
    view.peek = !view.peek; view.opened = false;
    send({ __cmd: 'peek', on: view.peek });
    return renderEditor();
  }
  if (d.pick) return ed.querySelector(`input[data-file="${CSS.escape(d.pick)}"]`).click();
  if (d.clear) { setPath(state, d.clear, ''); return update({ editor: true }); }
  if (d.del) {
    getPath(state, d.del).splice(+d.i, 1);
    if (/\.items$/.test(d.del)) view.flips = [];
    return update({ editor: true });
  }
  if (d.set) {
    // 표지 종류를 바꿀 때, 안내 문구·글자 색이 이전 종류의 기본값이면 새 종류의 기본값으로
    if (d.set === 'cover.type') {
      const c = state.cover, prev = COVER_DEFAULTS[c.type], next = COVER_DEFAULTS[d.v];
      if (prev && next) {
        if (c.hint === prev.hint) c.hint = next.hint;
        if (c.color === prev.color) c.color = next.color;
      }
      view.peek = false; view.opened = false;
    }
    setPath(state, d.set, d.v);
    return update({ editor: true });
  }
  if (d.addinfo) { getPath(state, d.addinfo).info.push({ k: '', v: '', fold: false }); return update({ editor: true }); }
  if (d.additem) {
    const list = getPath(state, d.additem).items;
    const make = {
      mains: () => mainItem({ title: '새 페어', a: charObj({ name: '캐릭터' }), b: charObj({ name: '유저' }) }),
      others: () => d.kind === 'solo'
        ? pairItem({ kind: 'solo', role: 'a', a: charObj({ name: '새 캐릭터' }) })
        : pairItem({ a: charObj({ name: '새 캐릭터' }), b: charObj({ name: '유저' }) }),
      friends: () => friendItem({ name: '새 트친' }),
    };
    const made = make[d.type || d.additem]();
    if (d.grp) made.group = d.grp;
    list.push(made);
    forceOpen.add(`${d.additem}.items.${list.length - 1}`);
    return update({ editor: true });
  }
  if (d.move) {
    const arr = getPath(state, d.move), i = +d.i, j = d.j !== undefined ? +d.j : i + +d.dir;
    if (j < 0 || j >= arr.length || j === i) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    if (/\.items$/.test(d.move)) view.flips = [];
    if (d.move === 'tabs' && view.tab === i) view.tab = j;
    return update({ editor: true });
  }
});

ed.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.file) {
    if (!el.files[0]) return;
    setPath(state, el.dataset.file, await readImage(el.files[0]));
    return update({ editor: true });
  }
  if (el.tagName === 'SELECT' || el.type === 'checkbox') onField(e);
  // 색 고르기 창을 닫은 뒤에 '테마 색으로' 버튼 · 목록 점 색 갱신
  if (el.type === 'color' && /\.accent$/.test(el.dataset.path || '')) renderEditor();
});

$('#btnUndo').onclick = undo;
$('#btnRedo').onclick = redo;
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
  const a = document.activeElement;
  // 글자 입력 중에는 입력칸 자체의 되돌리기를 그대로 둠
  if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && /^(text|url)$/.test(a.type)))) return;
  e.preventDefault();
  e.shiftKey ? redo() : undo();
});

/* 화면 배치 전환 (마지막 선택을 기억) */
function setLayoutMode(mode) {
  document.body.classList.toggle('only-editor', mode === 'editor');
  document.body.classList.toggle('only-preview', mode === 'preview');
  document.querySelectorAll('[data-layout-mode]').forEach(b => b.classList.toggle('on', b.dataset.layoutMode === mode));
  try { localStorage.setItem('twt-intro-layout', mode); } catch (_) {}
}
document.addEventListener('click', e => { const b = e.target.closest('[data-layout-mode]'); if (b) setLayoutMode(b.dataset.layoutMode); });
setLayoutMode((() => { try { return localStorage.getItem('twt-intro-layout') || 'both'; } catch (_) { return 'both'; } })());

$('#deviceSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#deviceSeg button').forEach(x => x.classList.toggle('on', x === b));
  $('#pvFrame').style.width = b.dataset.w === '100%' ? '100%' : b.dataset.w + 'px';
});

$('#btnCover').onclick = () => { view.opened = false; view.peek = false; send({ __cmd: 'cover' }); if (view.edTab === 'cover') renderEditor(); };

$('#btnReset').onclick = () => {
  if (!confirm('모든 내용을 기본값으로 되돌릴까요?')) return;
  state = clone(DEFAULT); view = { edTab: view.edTab, opened: false, tab: 0, flips: [], peek: false, sub: {} };
  update({ editor: true });
};

function download(name, content, type) {
  const href = URL.createObjectURL(new Blob([content], { type }));
  const a = Object.assign(document.createElement('a'), { href, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(href), 1000);
}
$('#btnExport').onclick = () => download('intro.html', buildPage(state, { opened: false, tab: 0 }), 'text/html');
$('#btnDeploy').onclick = () => {
  if (document.body.classList.contains('only-preview')) setLayoutMode('both');
  if (view.edTab !== 'deploy') goEdTab('deploy');
  if (deployReady()) runDeploy();
};
$('#btnSave').onclick = () => download('intro-project.json', JSON.stringify(state), 'application/json');
$('#btnLoad').onclick = () => $('#loadFile').click();
$('#loadFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { state = migrate(JSON.parse(await f.text())); view.flips = []; update({ editor: true }); }
  catch (_) { alert('불러올 수 없는 파일이에요.'); }
  e.target.value = '';
};

update({ editor: true });
</script>
</body>
