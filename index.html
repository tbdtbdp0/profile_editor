<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자기소개 페이지 생성기</title>
<style>
  :root {
    --ed-bg: #ffffff; --ed-soft: #f7f9fc; --ed-panel: #eef2f7; --ed-line: #e4e9f1; --ed-line-s: #edf1f6;
    --ed-text: #16202c; --ed-sub: #6c7889; --ed-accent: #3a8fd6; --ed-accent-2: #eaf4fc; --ed-danger: #d9534a;
    --r-s: 8px; --r-m: 11px; --r-l: 15px;
    --sh-1: 0 1px 2px rgba(20,45,80,.05);
    --sh-2: 0 6px 18px -10px rgba(20,45,80,.35);
    --fx: .18s cubic-bezier(.3,.8,.4,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; grid-template-columns: 424px 1fr; height: 100vh;
    font: 14px/1.55 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #e8edf4; color: var(--ed-text);
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: color-mix(in srgb, var(--ed-accent) 25%, transparent); }

  /* ---------- 좌측 편집기 ---------- */
  #editor { background: var(--ed-bg); border-right: 1px solid var(--ed-line); display: flex; flex-direction: column; min-height: 0; position: relative; z-index: 2; }
  .ed-top { padding: 9px 12px; border-bottom: 1px solid var(--ed-line-s); display: flex; align-items: center; gap: 6px; background: var(--ed-bg); }
  .ed-top h1 { font-size: 14.5px; font-weight: 700; margin: 0; flex: 1; letter-spacing: -.01em; white-space: nowrap; }
  .ed-top h1 i { font-style: normal; margin-right: 5px; }
  .btn-grp { display: inline-flex; background: var(--ed-soft); border: 1px solid var(--ed-line); border-radius: var(--r-s); overflow: hidden; }
  .btn-grp button { border: 0; border-radius: 0; background: none; padding: 5px 9px; }
  .btn-grp button + button { border-left: 1px solid var(--ed-line); }
  .btn-grp button:hover:not(:disabled) { background: #fff; }
  .ico-btn { min-width: 30px; text-align: center; }
  .badge.warn { background: #fdf1f0; border-color: #f3d0d0; color: #b3372e; }
  .note.warn { background: #fdf4f2; border-color: #f3d6cf; color: #8a3a2c; }
  .rt { border: 1px solid var(--ed-line); border-radius: var(--r-s); background: #fff; transition: border-color var(--fx), box-shadow var(--fx); }
  .rt:focus-within { border-color: var(--ed-accent); box-shadow: 0 0 0 3px rgba(58,143,214,.16); }
  .rt-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 4px; border-bottom: 1px solid var(--ed-line-s); background: var(--ed-soft); border-radius: var(--r-s) var(--r-s) 0 0; }
  .rt-bar .rt-sel { width: 92px; padding: 4px 20px 4px 7px; font-size: 12px; background-position: right 5px center; border-radius: 6px; text-overflow: ellipsis; }
  .rt-bar .rt-sel[data-rtcmd="size"] { width: 66px; }
  .rt-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 6px; font-size: 12.5px; color: var(--ed-text); background: none; border: 0; border-radius: 6px; cursor: pointer; }
  .rt-btn:hover:not(:disabled) { background: rgba(20,45,80,.07); border: 0; }
  .rt-color { position: relative; }
  .rt-color span { font-weight: 700; border-bottom: 3px solid #e2445c; line-height: 1.1; }
  .rt-color input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; padding: 0; border: 0; cursor: pointer; }
  .rt-sep { width: 1px; height: 16px; margin: 0 3px; background: var(--ed-line); }
  .rt-box { min-height: 72px; max-height: 320px; overflow: auto; padding: 9px 11px; font-size: 13.5px; line-height: 1.65; color: var(--ed-text); outline: none; word-break: keep-all; overflow-wrap: anywhere; }
  .rt-box:empty::before { content: attr(data-ph); color: #a3adba; }
  #edToast { position: fixed; left: 212px; bottom: 22px; transform: translate(-50%, 10px); z-index: 50; padding: 8px 14px; border-radius: 99px; background: rgba(22,32,44,.9); color: #fff; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; white-space: nowrap; }
  #edToast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 860px) { #edToast { left: 50%; } }
  .movebar { display: flex; flex-wrap: wrap; gap: 5px; }
  .movebar button { font-size: 12.5px; padding: 7px 10px; }
  .movebar button:hover:not(:disabled) { border-color: var(--ed-accent); color: var(--ed-accent); background: var(--ed-accent-2); }
  .mus-prev { display: flex; align-items: center; justify-content: center; height: 34px; border: 1px solid var(--ed-line); border-radius: var(--r-s); background: #fff; }
  .mus-chip { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; line-height: 1; }
  .mus-chip.bg { box-shadow: inset 0 0 0 .5px rgba(0,0,0,.08); }
  #btnSave.dirty { color: var(--ed-accent); font-weight: 700; }
  #btnSave.dirty::after { content: "•"; margin-left: 4px; color: #e0674f; }
  .pre-prompt { margin: 0; padding: 0 12px 12px; font: 11.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; color: var(--ed-sub); max-height: 300px; overflow: auto; }
  textarea[data-path="cover.cHtml"] { font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }

  .ed-tabs { display: flex; gap: 3px; padding: 7px 8px; border-bottom: 1px solid var(--ed-line-s); overflow-x: auto; scrollbar-width: none; background: linear-gradient(var(--ed-bg), var(--ed-soft)); }
  .ed-tabs::-webkit-scrollbar { display: none; }
  .ed-tab { flex: 1 0 48px; min-width: 48px; display: grid; justify-items: center; gap: 2px; padding: 7px 3px 6px; border: 0; border-radius: var(--r-m); background: none; font-size: 11px; font-weight: 500; color: var(--ed-sub); transition: background var(--fx), color var(--fx); }
  .ed-tab .lb { max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-tab .ic { font-size: 17px; line-height: 1.15; filter: saturate(.85); transition: filter var(--fx), transform var(--fx); }
  .ed-tab:hover { background: rgba(58,143,214,.08); border: 0; color: var(--ed-text); }
  .ed-tab.on { background: #fff; color: var(--ed-accent); font-weight: 700; box-shadow: var(--sh-1), inset 0 0 0 1px color-mix(in srgb, var(--ed-accent) 22%, transparent); }
  .ed-tab.on .ic { filter: none; transform: translateY(-1px); }

  .ed-scroll { overflow-y: auto; flex: 1; background: var(--ed-soft); scrollbar-width: thin; scrollbar-color: #cbd4e0 transparent; }
  .ed-scroll::-webkit-scrollbar { width: 10px; }
  .ed-scroll::-webkit-scrollbar-thumb { background: #cfd8e4; border: 3px solid var(--ed-soft); border-radius: 99px; }
  .ed-scroll::-webkit-scrollbar-thumb:hover { background: #b6c2d2; }
  .panel { padding: 0 14px 80px; display: grid; gap: 12px; align-content: start; }
  .panel-head { display: flex; align-items: center; gap: 8px; margin: 0 -14px 2px; padding: 13px 14px 11px; position: sticky; top: 0; z-index: 3;
    background: color-mix(in srgb, var(--ed-soft) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--ed-line-s); }
  .panel-head h2 { font-size: 15.5px; margin: 0; letter-spacing: -.01em; }

  details > summary { list-style: none; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: ""; margin-left: auto; width: 6px; height: 6px; flex-shrink: 0; border-right: 1.8px solid var(--ed-sub); border-bottom: 1.8px solid var(--ed-sub); transform: rotate(-45deg) translate(-2px, 0); transition: transform var(--fx); }
  details[open] > summary::after { transform: rotate(45deg) translate(-1px, -1px); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--ed-accent-2); border: 1px solid color-mix(in srgb, var(--ed-accent) 18%, transparent); color: color-mix(in srgb, var(--ed-accent) 78%, var(--ed-text)); font-weight: 600; white-space: nowrap; }
  label.f, .f { display: grid; gap: 5px; color: var(--ed-sub); font-size: 12.5px; font-weight: 500; }
  .f b.val { color: var(--ed-accent); font-weight: 700; }
  input[type=text], input[type=url], input[type=password], textarea, select {
    width: 100%; background: #fff; color: var(--ed-text); border: 1px solid var(--ed-line);
    border-radius: var(--r-s); padding: 8px 10px; font: inherit; font-size: 13.5px;
    transition: border-color var(--fx), box-shadow var(--fx), background var(--fx);
  }
  input[type=text]:hover, input[type=url]:hover, textarea:hover, select:hover { border-color: #c8d2df; }
  select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' fill='none' stroke='%236c7889' stroke-width='1.6' stroke-linecap='round'><path d='M3 4.5L6 7.5L9 4.5'/></svg>");
    background-repeat: no-repeat; background-position: right 9px center; background-size: 12px; }
  textarea { resize: vertical; min-height: 44px; line-height: 1.6; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--ed-accent); box-shadow: 0 0 0 3px rgba(58,143,214,.16); }
  button:focus-visible, .ed-tab:focus-visible, summary:focus-visible { outline: 2px solid var(--ed-accent); outline-offset: 1px; }
  input[type=range] { width: 100%; accent-color: var(--ed-accent); height: 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row-icon { display: grid; grid-template-columns: 58px 1fr; gap: 8px; }
  input[type=color] { width: 100%; height: 34px; border: 1px solid var(--ed-line); border-radius: var(--r-s); background: #fff; padding: 3px; cursor: pointer; }
  .check { display: flex; align-items: center; gap: 7px; color: var(--ed-text); font-size: 13px; font-weight: 500; cursor: pointer; padding: 7px 10px; border: 1px solid var(--ed-line); border-radius: var(--r-s); background: #fff; transition: border-color var(--fx), background var(--fx); }
  .check:hover { border-color: #c8d2df; }
  .check:has(input:checked) { border-color: color-mix(in srgb, var(--ed-accent) 45%, transparent); background: var(--ed-accent-2); color: color-mix(in srgb, var(--ed-accent) 80%, var(--ed-text)); }
  .check input { accent-color: var(--ed-accent); width: 15px; height: 15px; margin: 0; flex-shrink: 0; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    font: inherit; font-size: 13px; font-weight: 500; color: var(--ed-text); background: #fff; border: 1px solid var(--ed-line);
    border-radius: var(--r-s); padding: 7px 12px; cursor: pointer; transition: background var(--fx), border-color var(--fx), color var(--fx), box-shadow var(--fx), transform .1s;
  }
  button:hover:not(:disabled) { border-color: #c2ccda; background: var(--ed-soft); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .38; cursor: default; }
  button.primary { background: var(--ed-accent); color: #fff; border-color: transparent; font-weight: 600; box-shadow: 0 2px 8px -2px rgba(58,143,214,.55); }
  button.primary:hover:not(:disabled) { background: #2f81c8; border-color: transparent; }
  button.ghost { background: none; border-color: transparent; }
  button.ghost:hover:not(:disabled) { background: rgba(20,45,80,.06); border-color: transparent; }
  button.danger:hover:not(:disabled) { color: var(--ed-danger); background: #fdf1f0; }
  button.add { border-style: dashed; color: var(--ed-sub); background: none; padding: 9px 12px; font-weight: 600; }
  button.add:hover:not(:disabled) { color: var(--ed-accent); border-color: var(--ed-accent); background: var(--ed-accent-2); }
  button.on { border-color: var(--ed-accent); color: var(--ed-accent); background: var(--ed-accent-2); font-weight: 600; }

  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .img-field { display: flex; gap: 10px; align-items: center; padding: 7px; border: 1px solid var(--ed-line); border-radius: var(--r-m); background: #fff; }
  .img-thumb {
    width: 52px; height: 52px; border-radius: var(--r-s); background: var(--ed-panel) center/contain no-repeat;
    border: 1px dashed #c6cfdb; flex-shrink: 0;
  }
  .img-field .btns { display: flex; gap: 5px; flex-wrap: wrap; }
  .img-field input[type=file] { display: none; }
  .acc { display: grid; grid-template-columns: 74px 1fr; gap: 8px; align-items: center; }

  .card { background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-l); padding: 12px; display: grid; gap: 10px; box-shadow: var(--sh-1); }
  .card-title { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--ed-text); display: flex; align-items: center; gap: 6px; }
  details.item { background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-l); box-shadow: var(--sh-1); transition: box-shadow var(--fx), border-color var(--fx); }
  details.item:hover { border-color: #d2dbe6; }
  details.item[open] { box-shadow: var(--sh-2); border-color: color-mix(in srgb, var(--ed-accent) 24%, var(--ed-line)); }
  details.item > summary { padding: 10px 10px 10px 13px; font-weight: 600; font-size: 13px; border-radius: var(--r-l); }
  details.item[open] > summary { border-radius: var(--r-l) var(--r-l) 0 0; border-bottom: 1px solid var(--ed-line-s); }
  details.item > summary .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 0 0 3px color-mix(in srgb, currentColor 0%, transparent); }
  details.item > summary .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  details.item > summary button { padding: 3px 7px; font-size: 12px; opacity: .55; }
  details.item > summary:hover button, details.item[open] > summary button { opacity: 1; }
  details.item > .item-body { padding: 12px 12px 14px; display: grid; gap: 10px; }
  .grp { margin: 8px 0 -2px; font-size: 11px; font-weight: 700; color: var(--ed-sub); letter-spacing: .08em; text-transform: uppercase; display: flex; align-items: center; gap: 9px; }
  .grp::after { content: ""; flex: 1; height: 1px; background: var(--ed-line); }
  .info-row { background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-m); padding: 8px; display: grid; gap: 6px; }
  .info-row .top { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
  .info-row .check { padding: 5px 8px; font-size: 12px; }
  .hint { color: var(--ed-sub); font-size: 12px; line-height: 1.6; margin: 0; }
  .dp-status { border-radius: var(--r-m); padding: 10px 12px; font-size: 13px; line-height: 1.5; margin: 0; word-break: break-all; }
  .dp-status.busy { background: #f0f4f9; color: #4a5566; }
  .dp-status.ok { background: #ecf8f1; color: #206b40; border: 1px solid #c9ecd6; }
  .dp-status.err { background: #fdf1f0; color: #a33232; border: 1px solid #f3d0d0; }
  .dp-status a { color: inherit; font-weight: 700; }
  .guide { background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-m); }
  .guide > summary { padding: 10px 12px; font-weight: 600; font-size: 13px; }
  .guide ol { margin: 0; padding: 0 14px 12px 32px; font-size: 13px; line-height: 1.65; color: var(--ed-text); }
  .guide li + li { margin-top: 4px; }
  .guide b { font-weight: 700; }
  .note { background: var(--ed-accent-2); border: 1px solid #d3e7f7; color: #3a5a78; border-radius: var(--r-m); padding: 10px 12px; font-size: 12.5px; line-height: 1.6; margin: 0; }

  /* 탭 관리 · 템플릿 */
  .tab-row { display: grid; grid-template-columns: 46px 1fr auto; gap: 6px 5px; align-items: center; background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-m); padding: 6px; box-shadow: var(--sh-1); }
  .tr-btns { grid-column: 1 / -1; display: flex; gap: 4px; justify-content: flex-end; }
  .tab-row .badge { white-space: nowrap; }
  .tab-row input[type=text]:first-child { text-align: center; padding: 8px 2px; }
  .tab-row button { padding: 5px 7px; }
  .tpls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tpl { display: grid; justify-items: center; gap: 2px; padding: 10px 4px 9px; text-align: center; line-height: 1.25; border-radius: var(--r-m); }
  .tpl:hover:not(:disabled) { border-color: var(--ed-accent); background: var(--ed-accent-2); }
  .tpl .ic { font-size: 20px; }
  .tpl b { font-size: 12.5px; }
  .tpl small { font-size: 10.5px; color: var(--ed-sub); }

  /* 세부 탭 (서브 페어) */
  .subtabs { display: flex; flex-wrap: wrap; gap: 5px; padding: 7px; background: #fff; border: 1px solid var(--ed-line); border-radius: var(--r-m); box-shadow: var(--sh-1); }
  .subtab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; color: var(--ed-sub); background: var(--ed-soft); border-color: transparent; }
  .subtab:hover:not(:disabled) { background: var(--ed-panel); border-color: transparent; color: var(--ed-text); }
  .subtab .n { font-size: 10.5px; font-weight: 700; padding: 0 6px; border-radius: 99px; background: rgba(20,45,80,.08); }
  .subtab.on { background: var(--ed-accent); color: #fff; border-color: transparent; box-shadow: 0 2px 8px -3px rgba(58,143,214,.8); }
  .subtab.on:hover { background: #2f81c8; color: #fff; }
  .subtab.on .n { background: rgba(255,255,255,.26); }
  .subtab.new { background: none; border: 1px dashed var(--ed-line); }
  .subtab.new:hover { border-color: var(--ed-accent); color: var(--ed-accent); background: var(--ed-accent-2); }
  .sec-head { display: flex; align-items: center; gap: 8px; margin: 10px 0 -2px; font-size: 12px; font-weight: 700; color: var(--ed-accent); }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--ed-accent) 22%, transparent); }
  .sec-head .n { color: var(--ed-sub); font-weight: 600; }

  .grp-box { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--ed-line); border-radius: var(--r-m); background: var(--ed-soft); }
  .grp-box textarea { min-height: 36px; font-size: 13px; }
  .grp-row, .rule-row { display: grid; gap: 5px; align-items: center; }
  .grp-row { grid-template-columns: 1fr auto auto auto; }
  .rule-row { grid-template-columns: 116px 1fr auto; }
  .grp-row button, .rule-row button { padding: 5px 8px; }

  .layouts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .layouts.two { grid-template-columns: 1fr 1fr; }
  .layouts.three { grid-template-columns: repeat(3, 1fr); }
  .layouts.five { grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .layouts.five .lay { padding: 7px 0 5px; font-size: 10.5px; }
  .layouts.five .lay svg { width: 36px; height: 26px; }
  .pal-ed { display: flex; gap: 5px; }
  .pal-ed input[type=color] { flex: 1; height: 34px; padding: 2px; }
  .lay { display: grid; justify-items: center; gap: 4px; padding: 8px 2px 6px; font-size: 11px; color: var(--ed-sub); line-height: 1.2; border-radius: var(--r-m); }
  .lay svg { width: 44px; height: 30px; color: #9aa6b4; transition: color var(--fx); }
  .lay:hover:not(:disabled) { border-color: #c2ccda; }
  .lay:hover svg { color: #7d8b9c; }
  .lay.on { border-color: var(--ed-accent); color: var(--ed-accent); background: var(--ed-accent-2); font-weight: 700; }
  .lay.on svg { color: var(--ed-accent); }

  /* ---------- 우측 미리보기 ---------- */
  #preview { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pv-top { padding: 9px 14px; border-bottom: 1px solid var(--ed-line); display: flex; gap: 7px; align-items: center; background: var(--ed-bg); flex-wrap: wrap; }
  .pv-top .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--ed-line); border-radius: var(--r-s); overflow: hidden; background: var(--ed-soft); padding: 2px; gap: 2px; }
  .seg button { border: 0; border-radius: 6px; background: none; color: var(--ed-sub); padding: 5px 10px; }
  .seg button:hover:not(.on) { background: rgba(20,45,80,.05); }
  .seg button.on { background: #fff; color: var(--ed-text); font-weight: 600; box-shadow: var(--sh-1); }
  .pv-stage { flex: 1; overflow: auto; display: flex; justify-content: center; padding: 24px; background:
    radial-gradient(1200px 600px at 50% -10%, #f3f7fc, transparent), #e8edf4; }
  .pv-frame { border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 18px 46px rgba(20,40,60,.18); transition: width .2s; height: 100%; min-height: 600px; max-width: 100%; background: #fff; }
  .pv-frame iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* 화면 배치: 둘 다 / 편집창만 / 미리보기만 */
  .layout-seg button { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; }
  .layout-seg svg { width: 16px; height: 16px; }
  .ed-top .layout-seg { display: none; }
  body.only-editor, body.only-preview { grid-template-columns: 1fr; }

// 비밀번호를 그대로 넣지 않으려고 쓰는 가벼운 해시 (FNV-1a) — 완전한 보안은 아님
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < String(str).length; i++) { h ^= String(str).charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16);
}

// 유튜브 주소(또는 id) 에서 영상 id 만 뽑아내기
function ytId(u) {
  const t = String(u || '').trim();
  if (!t) return '';
  if (/^[\w-]{11}$/.test(t)) return t;
  const m = t.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
  return m ? m[1] : '';
}

function migrate(s) {
  const d = Object.assign(clone(DEFAULT), s);
  d.theme = Object.assign(clone(DEFAULT.theme), d.theme); delete d.theme.bg;
  if (d.theme.accent === '#e87a90') d.theme.accent = DEFAULT.theme.accent;

  const oc = s.cover || {}, nc = clone(DEFAULT.cover);
  if (!('type' in oc)) {
    if ('frost' in oc) Object.assign(nc, pick(oc, ['title', 'hint', 'cakeImg', 'sliceImg', 'fxImg', 'sx', 'sy', 'sw', 'sr', 'lift', 'candle']), { type: 'cake', cakeSize: oc.size || 400 });
    else Object.assign(nc, pick(oc, ['kicker', 'title', 'hint']), { type: 'cake' });
  } else Object.assign(nc, oc);

    nc.type = 'cake';
  }

  if ('camPw' in nc) { if (nc.type === 'camera' && !nc.hint) nc.hint = COVER_DEFAULTS.camera.hint; delete nc.camPw; }
  ['image', 'blend', 'size', 'hz', 'holo1', 'holo2', 'holo3', 'bokeh', 'bubble', 'reflect', 'glint'].forEach(k => delete nc[k]);
  d.cover = nc;

  d.music = Object.assign(clone(DEFAULT.music), d.music);
  d.music.tracks = (d.music.tracks || []).map((t, i) => Object.assign({ id: 't' + i, title: '', url: '' }, t));

  d.lock = Object.assign(clone(DEFAULT.lock), d.lock);
  d.lock.codes = (d.lock.codes || []).map((cd, i) => Object.assign({ id: 'c' + i, code: '', label: '', tabs: [] }, cd, { tabs: Array.isArray(cd.tabs) ? cd.tabs : [] }));

  d.labels = Object.assign(clone(DEFAULT.labels), d.labels);
  // 탭: 예전 고정 4개 → 종류가 있는 목록으로
  const OLD_TYPES = ['profile', 'mains', 'others', 'friends'];
  d.tabs = (Array.isArray(s.tabs) && s.tabs.length ? s.tabs : clone(DEFAULT.tabs))
    .map((t, i) => t.type ? t : Object.assign({ id: OLD_TYPES[i] || `p${i}`, type: OLD_TYPES[i] || 'text' }, t));
  d.pages = Object.assign({}, s.pages);
  d.tabs.forEach(t => {

  // 복제한 기본 탭도 원본과 같은 기본값·항목 모양을 갖추도록 (새로 생긴 설정이 빠지지 않게)
  const PAGE_FILL = {

  d.tabs.forEach(t => {

  delete d.main;
  d.mains = Object.assign({ cols: 1, intro: '', showRole: true, flipHint: '↻ 카드를 눌러 뒤집어 보세요' }, d.mains);
  d.mains.items = d.mains.items.map(it => { const m = fixMain(mainItem(Object.assign({}, it, { a: charObj(it.a), b: charObj(it.b) }))); delete m.textGlow; return m; });

}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');

const safeJSON = v => JSON.stringify(v).replace(/</g, '\\u003c');

// 고정 시드 난수 — 미리보기를 다시 그려도 배치가 그대로
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

function shade(hex, p) {
  const n = parseInt(hex.slice(1), 16);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255]
    .map(v => Math.max(0, Math.min(255, Math.round(p < 0 ? v * (1 + p) : v + (255 - v) * p))).toString(16).padStart(2, '0'))
    .join('');
}

/* =========================================================

   서식을 넣으면 '<!--rt-->' 로 시작하는 HTML 로, 아니면 그냥 글자로 저장

const RT = '<!--rt-->';
const RT_FONTS = {
  'Gowun Dodum': ['고운돋움', ''], 'Gowun Batang': ['고운바탕', 'wght@400;700'], 'Noto Sans KR': ['본고딕', 'wght@400;700'],
  'Nanum Myeongjo': ['나눔명조', 'wght@400;700'], 'Song Myung': ['송명', ''], 'Jua': ['주아', ''], 'Do Hyeon': ['도현', ''],
  'Nanum Pen Script': ['나눔펜 · 손글씨', ''], 'Gaegu': ['개구 · 손글씨', 'wght@400;700'], 'Hi Melody': ['하이멜로디 · 손글씨', ''],
  'Nanum Gothic Coding': ['나눔고딕코딩 · 타자기', 'wght@400;700'],
  'Cormorant Garamond': ['Cormorant · 영문 세리프', 'ital,wght@0,500;1,400;1,500'], 'Dancing Script': ['Dancing Script · 영문 필기', 'wght@500;600'],
};
const RT_SIZES = { '.8em': '아주 작게', '.9em': '작게', '1em': '보통', '1.15em': '조금 크게', '1.35em': '크게', '1.7em': '아주 크게' };
const RT_TAGS = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'STRIKE', 'BR', 'SPAN', 'DIV', 'P', 'FONT']);
const RT_CSS = ['color', 'background-color', 'font-family', 'font-size', 'font-weight', 'font-style', 'text-decoration', 'text-decoration-line', 'text-align'];
const isRt = v => typeof v === 'string' && v.startsWith(RT);
const rtCache = new Map();
// 허용한 태그 · 스타일만 남기고 나머지는 걷어냄 (붙여넣기 · 불러온 파일 대비)
function cleanRt(html) {
  if (rtCache.has(html)) return rtCache.get(html);
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, 'text/html'), root = doc.body.firstChild;
  (function walk(n) {
    [...n.childNodes].forEach(c => {
      if (c.nodeType === 3) return;
      if (c.nodeType !== 1) { c.remove(); return; }
      if (/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT|EMBED|NOSCRIPT|SVG|MATH)$/i.test(c.tagName)) { c.remove(); return; }
      walk(c);
      if (!RT_TAGS.has(c.tagName)) { c.replaceWith(...c.childNodes); return; }
      if (c.tagName === 'FONT') {
        const sp = doc.createElement('span');
        if (c.getAttribute('color')) sp.style.color = c.getAttribute('color');
        if (c.getAttribute('face')) sp.style.fontFamily = c.getAttribute('face');
        sp.append(...c.childNodes); c.replaceWith(sp); c = sp;
      }
      const keep = RT_CSS.map(k => [k, c.style.getPropertyValue(k)]).filter(([, v]) => v && v !== 'initial' && !/url\(|expression|javascript:/i.test(v));
      [...c.attributes].forEach(a => c.removeAttribute(a.name));
      keep.forEach(([k, v]) => c.style.setProperty(k, v));
      if (c.tagName === 'SPAN' && !c.getAttribute('style')) c.replaceWith(...c.childNodes);
    });
  })(root);
  const out = root.innerHTML;
  if (rtCache.size > 300) rtCache.clear();
  rtCache.set(html, out);
  return out;
}
// 결과물에 넣을 HTML — 서식 글이면 정리해서, 아니면 줄바꿈만
const rt = v => isRt(v) ? cleanRt(v.slice(RT.length)) : nl(v);
// 서식 글에 쓰인 글꼴 (결과물에서 불러올 것만)
function rtFontsUsed(d) {
  const used = new Set();
  (function walk(o) {
    if (typeof o === 'string') {
      if (isRt(o)) for (const m of o.matchAll(/font-family:\s*([^;"]+?)(?:;|"|$)/g)) {
        const f = m[1].replace(/&quot;|['"]/g, '').split(',')[0].trim();
        if (RT_FONTS[f]) used.add(f);
      }
      return;
    }
    if (o && typeof o === 'object') for (const k in o) walk(o[k]);
  })(d);
  return used;
}

function fontLink(d) {
  const fams = new Map();
  const add = (name, spec = '') => { if (name && !fams.has(name)) fams.set(name, spec); };
  add(d.cover.font, COVER_FONTS[d.cover.font]?.spec || '');
  add(d.theme.font);
  add('Gowun Batang', 'wght@400;700');
  add('Dancing Script', 'wght@500;600');
  add('Nanum Pen Script');
  rtFontsUsed(d).forEach(f => add(f, RT_FONTS[f][1]));
  const skins = new Set(d.tabs.filter(t => t.type === 'mains').flatMap(t => (getPath(d, dataPath(t))?.items || []).map(m => m.skin)));
  if (skins.has('postcard')) add('Special Elite');
  if (skins.has('ticket')) { add('Bebas Neue'); add('Do Hyeon'); }
  if (skins.has('ticket') || skins.has('receipt') || skins.has('postcard')) add('Nanum Gothic Coding', 'wght@400;700');
  return 'https://fonts.googleapis.com/css2?' + [...fams].map(([n, s]) => 'family=' + n.replace(/ /g, '+') + (s ? ':' + s : '')).join('&') + '&display=swap';
}

// 캔버스를 가장 가벼운 형식으로 저장 — 투명한 곳이 없으면 JPEG, 있으면 WebP (안 되면 PNG)
// PNG 사진은 같은 JPEG보다 5~7배 커서, 여러 장이면 아이폰 사파리가 페이지를 버티지 못함
function encodeCanvas(c) {
  const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  let alpha = false;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { alpha = true; break; }
  if (!alpha) return c.toDataURL('image/jpeg', 0.86);
  const webp = c.toDataURL('image/webp', 0.9);
  return webp.startsWith('data:image/webp') ? webp : c.toDataURL('image/png');
}
// 이미지 한 장을 max 픽셀 안으로 줄여서 다시 저장
function shrinkImage(src, max = 1400) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(encodeCanvas(c));
    };
    img.onerror = rej;
    img.src = src;
  });
}
// 올린 파일을 적당한 크기 · 형식의 dataURL로 (움직이는 GIF는 그대로)
function readImage(file, max = 1400) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => (file.type === 'image/gif' ? res(r.result) : shrinkImage(r.result, max).then(res, rej));
    r.readAsDataURL(file);
  });
}

/* =========================================================
   표지 ① 케이크
   ========================================================= */
function cakeSVG(c) {
  const cx = 200, cy = 150, rx = 140, ry = 46, h = 96;
  const t1 = 62, t2 = 114;
  const R = Math.PI / 180;
  const P = (t, dy = 0, r = 1) => [cx + rx * r * Math.cos(t * R), cy + ry * r * Math.sin(t * R) + dy];
  const fmt = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  const arc = (a, b, dy = 0, wave = 0) => {
    const n = Math.max(2, Math.ceil(Math.abs(b - a) / 2)), out = [];
    for (let i = 0; i <= n; i++) {
      const t = a + (b - a) * i / n;
      out.push(P(t, dy + (wave ? wave * (0.55 + 0.45 * Math.sin(t * R * 16)) : 0)));
    }
    return out;
  };
  const poly = pts => 'M' + pts.map(fmt).join('L') + 'Z';
  const band = (a, b, y0, y1, wave = 0) => poly([...arc(a, b, y0), ...arc(b, a, y1, wave)]);
  const face = (t, y0, y1) => poly([[cx, cy + y0], P(t, y0), P(t, y1), [cx, cy + y1]]);
  const skin = shade(c.frost, -0.06), jam = shade(c.frost, -0.12);
  const dots = (a, b) => {
    let s = '';
    for (let t = a + 5; t < b; t += 10) { const p = P(t, h - 1); s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6.5" fill="${c.cream}"/>`; }
    return s;
  };
  const berry = (t, r = 0.74) => {
    const [x, y] = P(t, 0, r), k = 0.85 + 0.25 * Math.sin(t * R);
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${k.toFixed(2)})">
      <path d="M0,4 C-11,-2 -9,-17 0,-15 C9,-17 11,-2 0,4Z" fill="${c.deco}"/>
      <path d="M-6,-14 L-2,-11 L0,-17 L2,-11 L6,-14 L3,-9 L-3,-9Z" fill="#5ea45b"/>
    </g>`;
  };
  const cutFace = (t, k) => [
    [0, 9, c.cream], [9, 42, c.sponge], [42, 52, jam], [52, 86, c.sponge], [86, h, shade(c.sponge, -0.08)],
  ].map(([y0, y1, col]) => `<path d="${face(t, y0, y1)}" fill="${shade(col, k)}"/>`).join('');
  const candle = c.candle ? (() => {
    const [x, y] = P(250, 0, 0.45);
    return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
      <rect x="-6" y="-52" width="12" height="52" rx="3" fill="#fff" stroke="${shade(c.frost, -0.2)}" stroke-width="1"/>
      <path d="M-6,-40 L6,-46 M-6,-26 L6,-32 M-6,-12 L6,-18" stroke="${c.frost}" stroke-width="3"/>
      <path d="M0,-52 L0,-58" stroke="#555" stroke-width="1.5"/>
      <path class="flame" d="M0,-80 C8,-70 7,-60 0,-58 C-7,-60 -8,-70 0,-80Z" fill="#ffb938"/>
      <path class="flame" d="M0,-72 C4,-66 3,-61 0,-60 C-3,-61 -4,-66 0,-72Z" fill="#fff3c4"/>
    </g>`;
  })() : '';

  return `<svg class="cake cake-svg enter" viewBox="0 0 400 330" role="button" tabindex="0" aria-label="들어가기">
    <ellipse cx="${cx}" cy="${cy + h + 30}" rx="175" ry="34" fill="rgba(0,0,0,.08)"/>
    <ellipse cx="${cx}" cy="${cy + h + 8}" rx="176" ry="62" fill="#fff" stroke="rgba(0,0,0,.06)"/>
    <g>
      <path d="${band(0, t1, 0, h)}" fill="${skin}"/>
      <path d="${band(t2, 180, 0, h)}" fill="${skin}"/>
      <path d="${band(0, t1, 0, 16, 10)}" fill="${c.cream}"/>
      <path d="${band(t2, 180, 0, 16, 10)}" fill="${c.cream}"/>
      ${dots(0, t1)}${dots(t2, 180)}
      ${cutFace(t1, 0.05)}${cutFace(t2, -0.08)}
      <path d="${poly([[cx, cy], ...arc(t2, 360 + t1)])}" fill="${c.cream}"/>
      ${[200, 235, 305, 340].map(t => berry(t)).join('')}
      ${candle}
      ${[20, 160].map(t => berry(t)).join('')}
    </g>
    <g class="slice">
      <path d="${band(t1, t2, 0, h)}" fill="${skin}"/>
      <path d="${band(t1, t2, 0, 16, 10)}" fill="${c.cream}"/>
      ${dots(t1, t2)}
      <path d="${poly([[cx, cy], ...arc(t1, t2)])}" fill="${c.cream}"/>
      ${berry((t1 + t2) / 2, 0.7)}
    </g>
  </svg>`;
}

function cakeCover(c) {
  const cake = (c.cakeImg && c.sliceImg)
    ? `<div class="cake cake-img enter" role="button" tabindex="0" aria-label="들어가기">
        <img class="base" src="${c.cakeImg}" alt="" draggable="false">
        ${c.fxImg ? `<img class="fx" src="${c.fxImg}" alt="" draggable="false">` : ''}
        <img class="slice" src="${c.sliceImg}" alt="" draggable="false">
      </div>`
    : cakeSVG(c);
  return `<div class="cover cv-cake"><div class="cv-body">${coverText(c)}${cake}${coverHint(c)}</div></div>`;
}

/* =========================================================
   표지 ② 직접 만든 표지 (HTML 붙여넣기)
   ========================================================= */
// class="enter" 를 넣은 요소가 있으면 그것만 입장 버튼, 없으면 표지 전체를 눌러 입장
const hasEnter = h => /class\s*=\s*["'][^"']*\benter\b/.test(String(h || ''));

function customCover(c) {
  const html = String(c.cHtml || '');
  const open = hasEnter(html) ? '' : 'enter" role="button" tabindex="0" aria-label="들어가기';
  return `<div class="cover cv-custom">
    <div class="cv-html ${open}">${html || '<p class="cv-empty">표지 HTML을 넣어주세요</p>'}</div>
    ${c.cHtmlText ? `<div class="cv-body cv-over">${coverText(c)}${coverHint(c)}</div>` : ''}
  </div>`;
}

no-lock');\n      setTimeout(shoot, 900);\n      return;\n    }\n    var h = document.querySelector('#gateForm h2');\n    label.textContent = h ? h.textContent : '';\n    pw.tabIndex = 0; ok.tabIndex = 0;\n    try { pw.focus({ preventScroll: true }); } catch (e) { pw.focus(); }\n  }\n\n  function submit() {\n    if (!on || done) return;\n    var form = byId('gateForm'), input = byId('gateIn');\n    if (form && input) {\n      input.value = pw.value;\n      form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));\n    }\n    if (!byId('gate')) return shoot();\n    var err = byId('gateErr');\n    msg.textContent = (err && err.textContent) || '';\n    pw.value = '';\n    stage.classList.remove('my-is-wrong');\n    void stage.offsetWidth;\n    stage.classList.add('my-is-wrong');\n    pw.focus();\n  }\n\n  lcd.addEventListener('click', powerOn);\n  shutter.addEventListener('click', function () { if (on) submit(); else powerOn(); });\n  ok.addEventListener('click', function (e) { e.stopPropagation(); submit(); });\n  pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });\n  pw.addEventListener('input', function () { msg.textContent = ''; });\n})();\n<\/script>";

function cameraCover(c) {
  const html = CAMERA_COVER.replace('__MY_TEXT__', () => coverText(c)).replace('__MY_HINT__', () => coverHint(c));
  return `<div class="cover cv-custom cv-camera"><div class="cv-html">${html}</div></div>`;
}

/* =========================================================
   표지 ③ 드림코어 — CSS 3D 공간
   ========================================================= */
function dreamCover(c) {
  const r = rng(11);
  const syms = String(c.dSymbols || '').split(/\s+/).filter(Boolean);
  const words = String(c.dWords || '').split('\n').map(s => s.trim()).filter(Boolean);
  const kinds = ['chrome', 'glow', 'pastel', 'glow'];
  let objs = '';

  const density = Number(c.dCount) || 60;
  const count = syms.length ? density : 0;
  for (let i = 0; i < count; i++) {
    let x = Math.round((r() * 2 - 1) * 640);
    const y = Math.round(-340 + r() * 440), z = Math.round(-1600 + r() * 1450);
    if (Math.abs(x) < 120 && z < -500) x += x < 0 ? -200 : 200;   // 가운데 문 앞은 비워둠
    const size = Math.round(26 + r() * 50);
    objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><span class="sym ${kinds[i % 4]}" style="font-size:${size}px;animation-duration:${(5 + r() * 6).toFixed(1)}s;animation-delay:${(-r() * 8).toFixed(1)}s">${esc(syms[i % syms.length])}</span></div>`;
  }
  words.forEach(w => {
    const x = Math.round((r() * 2 - 1) * 460), y = Math.round(-280 + r() * 260), z = Math.round(-1200 + r() * 800);
    objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><span class="word" style="animation-delay:${(-r() * 6).toFixed(1)}s">${esc(w)}</span></div>`;
  });
  // 도형 위치: 가운데 문 앞은 비워둠
  const spot = () => {
    let x = Math.round((r() * 2 - 1) * 620);
    const y = Math.round(-340 + r() * 420), z = Math.round(-1600 + r() * 1450);
    if (Math.abs(x) < 150 && z < -450) x += x < 0 ? -230 : 230;
    return [x, y, z];
  };
  const shapeN = Math.max(2, Math.round(density / 7));
  if (c.dCubes) {
    Array.from({ length: shapeN }, () => [...spot(), Math.round(36 + r() * 100)]).forEach(([x, y, z, s], i) => {
      objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><div class="cube" style="--s:${s}px;animation-delay:${-i * 3}s">${['f', 'k', 'l', 'r', 't', 'd'].map(f => `<i class="${f}"></i>`).join('')}</div></div>`;
    });
  }
  if (c.dOrbs) for (let i = 0; i < shapeN; i++) {
    const [x, y, z] = spot(), s = Math.round(22 + r() * 72);
    objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><span class="orb ${i % 2 ? 'chrome' : 'pearl'}" style="--s:${s}px;animation-delay:${(-r() * 6).toFixed(1)}s"></span></div>`;
  }
  if (c.dRings) for (let i = 0; i < Math.round(shapeN * .7); i++) {
    const [x, y, z] = spot(), s = Math.round(50 + r() * 110);
    objs += `<div class="obj" style="transform:translate3d(${x}px,${y}px,${z}px)"><span class="ring3d" style="--s:${s}px;animation-delay:${(-r() * 9).toFixed(1)}s;animation-duration:${(9 + r() * 8).toFixed(1)}s"></span></div>`;
  }
  const center = c.dCenter === 'image' && c.dImage
    ? `<div class="obj" style="transform:translate3d(0,60px,-620px)"><button type="button" class="d-img enter" aria-label="들어가기"><span class="d-float"><img src="${c.dImage}" alt="" draggable="false"></span></button></div>`
    : `<div class="obj" style="transform:translate3d(0,240px,-700px)"><span class="spill"></span><button type="button" class="door enter" aria-label="들어가기"><span class="door-in"></span></button></div>`;

  const clouds = c.dClouds ? [[4, 12, 240, .9, 46], [58, 6, 300, .85, 60], [30, 24, 190, .7, 38], [78, 27, 220, .75, 52]]
    .map(([x, y, w, o, d], i) => `<span class="cloud" style="left:${x}%;top:${y}%;--w:${w}px;--o:${o};animation-duration:${d}s;animation-delay:${-i * 9}s"></span>`).join('') : '';

  return `<div class="cover cv-dream ${c.dGrain ? 'grain' : ''}">
    <div class="sky"><span class="sun"></span>${clouds}</div>
    <div class="world"><div class="cam" id="cam">
      <div class="floor ${c.dFloorType === 'grid' ? 'grid' : 'checker'}"></div>
      ${objs}
      ${center}
    </div></div>
    <div class="flash"></div>
    <div class="d-text">${coverText(c)}</div>
    <div class="d-hint">${coverHint(c)}</div>
  </div>`;
}

const coverText = c => `${c.kicker ? `<p class="kicker">${esc(c.kicker)}</p>` : ''}${c.title ? `<h1>${esc(c.title)}</h1>` : ''}`;
const coverHint = c => c.hint ? `<p class="hint">${esc(c.hint)}</p>` : '';

function coverCSS(c) {
  const common = `
.cover{position:fixed;inset:0;z-index:50;overflow:hidden;color:${c.color};font-family:'${c.font}','Gowun Batang',serif;
  display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .8s ease,transform .8s ease,visibility .8s}
body.opened .cover{opacity:0;visibility:hidden;transform:scale(1.06);pointer-events:none}
body.gone .cover{display:none}
.cover button{font:inherit;color:inherit;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent;outline:none}
.cv-body{position:relative;display:flex;flex-direction:column;align-items:center;padding:20px}
.kicker{margin:0 0 2px;font-size:13px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;opacity:.75}
.cover h1{margin:0;font-size:clamp(42px,12vw,80px);line-height:1.02;font-weight:500;font-style:${c.italic ? 'italic' : 'normal'};letter-spacing:-.01em}

  background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 1px 0 #fff,0 10px 26px -12px rgba(40,80,140,.35);animation:hintBob 2.6s ease-in-out infinite}
body.popping .hint,body.popping .kicker,body.popping .cover h1{opacity:0;transition:opacity .4s}
@keyframes hintBob{50%{transform:translateY(-3px)}}
body.no-anim .cover,body.no-anim .cover *{transition:none!important}`;

  if (c.type === 'cake') return common + `
.cv-cake{background:${c.cBg}}
.cake{width:min(88vw,var(--csize));cursor:pointer;outline:none;animation:bob 3.2s ease-in-out infinite;-webkit-tap-highlight-color:transparent;user-select:none;margin-top:6px}
body.popping .cake{animation:none}
@keyframes bob{50%{transform:translateY(-8px)}}

.cake-svg:hover .slice{transform:translateY(-6px)}
body.popping .cake-svg .slice{transition:transform 1s cubic-bezier(.34,1.5,.5,1);transform:translate(26px,-120px) rotate(-9deg)}

.cake-img .slice{position:absolute;left:var(--sx);top:var(--sy);width:var(--sw);transform:rotate(var(--sr));transform-origin:50% 100%;transition:transform .25s}
.cake-img:hover .slice{transform:translateY(-4%) rotate(var(--sr))}

  if (c.type === 'camera') {
    const edge = isHex(c.camBg) ? c.camBg : '#dce9f3', mid = isHex(c.camBg2) ? c.camBg2 : '#ffffff';
    const k = Math.max(.5, Math.min(1.3, (Number(c.camSize) || 100) / 100));
    return common + `
:root{--cam-k:${k};--cam-e:${edge};--cam-c:${mid}}

.cv-html{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;text-align:initial}
body.opened .cover.cv-camera{transform:none;transition:opacity .28s ease,visibility .28s}
body.opened .win{transform:none;transition:opacity .28s ease}`;
  }

  if (c.type === 'custom') return common + `
.cv-custom{background:${c.cHtmlBg || '#eef4fb'};display:block}

body.popping .cv-html{transition:transform .8s ease,opacity .8s ease;transform:scale(1.05);opacity:.55}`;

  // dream
  const noise = `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")`;
  return common + `
.cv-dream{--eye:38%;background:${c.dSky2}}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,${c.dSky1} 0%,${c.dSky2} 38%,${c.dSky2} 100%);transition:transform 1.6s cubic-bezier(.7,0,.25,1)}

.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:#fff}
.cloud::before{width:48%;height:130%;left:14%;bottom:30%}
.cloud::after{width:36%;height:100%;right:16%;bottom:40%}
@keyframes cloud{to{transform:translateX(90px)}}

.world{position:absolute;inset:0;perspective:700px;perspective-origin:50% var(--eye);overflow:hidden;
  transform-origin:50% calc(var(--eye) + 46px);transition:transform 1.6s cubic-bezier(.7,0,.25,1),filter 1.6s}
.cam{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% var(--eye);pointer-events:none}
.cam .enter{pointer-events:auto}
.floor{position:absolute;left:50%;top:var(--eye);width:4200px;height:3000px;margin-left:-2100px;transform-origin:50% 0;
  transform:translate3d(0,240px,-2600px) rotateX(90deg);background-color:${c.dFloor};
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 55%);mask-image:linear-gradient(to bottom,transparent 0,#000 55%)}
.floor.checker{background-image:conic-gradient(${c.dGrid} 90deg,transparent 90deg 180deg,${c.dGrid} 180deg 270deg,transparent 270deg);background-size:140px 140px;animation:floorC 3s linear infinite}
.floor.grid{background-image:linear-gradient(${c.dGrid} 4px,transparent 4px),linear-gradient(90deg,${c.dGrid} 4px,transparent 4px);background-size:110px 110px;animation:floorG 2.4s linear infinite}
@keyframes floorC{to{background-position:0 140px}}
@keyframes floorG{to{background-position:0 110px,0 110px}}
.obj{position:absolute;left:50%;top:var(--eye);transform-style:preserve-3d}
.sym{display:block;transform:translate(-50%,-50%);line-height:1;white-space:nowrap;animation:symFloat 7s ease-in-out infinite;font-family:serif}
@keyframes symFloat{0%,100%{transform:translate(-50%,-50%) translateY(0) rotateY(0)}50%{transform:translate(-50%,-50%) translateY(-22px) rotateY(180deg)}}
.sym.glow{color:#fff;text-shadow:0 0 6px #fff,0 0 18px ${c.dGrid},0 0 36px ${c.dSky1}}
.sym.chrome{background:linear-gradient(180deg,#ffffff 0%,#cfdcee 34%,#6d7f9c 50%,#eef4ff 62%,#9db2cf 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 6px rgba(70,100,150,.35))}
.sym.pastel{background:linear-gradient(135deg,#ffc9ec,#bfe3ff 50%,#cffff0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(255,255,255,.95))}
.word{display:block;transform:translate(-50%,-50%);white-space:nowrap;font-size:26px;font-style:italic;color:rgba(255,255,255,.92);
  text-shadow:0 0 10px rgba(255,255,255,.9),-1px 0 rgba(255,120,200,.45),1px 0 rgba(90,200,255,.45);animation:wordFloat 8s ease-in-out infinite}
@keyframes wordFloat{50%{transform:translate(-50%,-50%) translateY(-14px);opacity:.6}}
.cube{position:relative;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);transform-style:preserve-3d;animation:cubeSpin 16s linear infinite}
.cube i{position:absolute;inset:0;border:1.5px solid rgba(255,255,255,.95);background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(170,210,255,.12));box-shadow:inset 0 0 18px rgba(255,255,255,.55),0 0 14px rgba(255,255,255,.5)}
.cube .f{transform:translateZ(calc(var(--s) / 2))}.cube .k{transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.cube .l{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}.cube .r{transform:rotateY(90deg) translateZ(calc(var(--s) / 2))}
.cube .t{transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}.cube .d{transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
@keyframes cubeSpin{to{transform:rotateX(360deg) rotateY(720deg)}}
.orb{display:block;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);border-radius:50%;animation:orbFloat 6s ease-in-out infinite}
.orb.chrome{background:radial-gradient(circle at 34% 28%,#fff 0 7%,#e6eef9 16%,#9fb3d1 42%,#5f7394 58%,#dfe9f7 74%,#aebfd8 100%);box-shadow:0 10px 24px -10px rgba(60,80,130,.45)}
.orb.pearl{background:radial-gradient(circle at 32% 28%,#fff 0 9%,rgba(255,255,255,.6) 18%,transparent 40%),conic-gradient(from 120deg,#ffd6f2,#cfe8ff,#d8fff0,#fff3c9,#ffd6f2);box-shadow:inset -6px -8px 16px rgba(120,140,220,.3),0 0 24px rgba(255,255,255,.85)}
@keyframes orbFloat{50%{transform:translateY(-22px)}}
.ring3d{display:block;width:var(--s);height:var(--s);margin:calc(var(--s) / -2);border-radius:50%;border:calc(var(--s) * .08) solid rgba(255,255,255,.92);
  box-shadow:0 0 14px rgba(255,255,255,.9),inset 0 0 12px ${c.dGrid};animation:ringSpin 12s linear infinite}
@keyframes ringSpin{from{transform:rotateX(65deg) rotateZ(0)}to{transform:rotateX(65deg) rotateY(360deg) rotateZ(360deg)}}

.door{position:absolute;left:0;top:0;width:180px;height:300px;transform:translate(-50%,-100%);cursor:pointer;border-radius:90px 90px 4px 4px;
  background:linear-gradient(180deg,#fff 0%,#fff 45%,${c.dSky2} 100%);animation:doorGlow 3.4s ease-in-out infinite;
  box-shadow:0 0 0 8px rgba(255,255,255,.55),0 0 50px 16px rgba(255,255,255,.95),0 0 140px 60px color-mix(in srgb,${c.dSky1} 60%,transparent)}
.door-in{position:absolute;inset:14px 14px 0;border-radius:76px 76px 0 0;background:radial-gradient(60% 45% at 50% 38%,#fff,rgba(255,255,255,.3) 70%),linear-gradient(180deg,${c.dSky1},#fff)}
@keyframes doorGlow{50%{box-shadow:0 0 0 10px rgba(255,255,255,.7),0 0 70px 24px #fff,0 0 180px 80px color-mix(in srgb,${c.dSky1} 70%,transparent)}}
.spill{position:absolute;left:0;top:0;width:520px;height:520px;transform:translate(-50%,0) rotateX(90deg);transform-origin:50% 0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));clip-path:polygon(33% 0,67% 0,100% 100%,0 100%)}
.d-img{position:absolute;left:0;top:0;width:260px;transform:translate(-50%,-100%);cursor:pointer}
.d-float{display:block;animation:dFloat 4s ease-in-out infinite;filter:drop-shadow(0 0 30px rgba(255,255,255,.95))}
.d-float img{width:100%;display:block;pointer-events:none}
@keyframes dFloat{50%{transform:translateY(-18px) rotate(3deg)}}

.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.d-text{position:absolute;left:0;right:0;top:8%;pointer-events:none;padding:0 16px}
.d-hint{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;pointer-events:none}
.cv-dream h1{text-shadow:0 0 2px #fff,0 0 22px rgba(255,255,255,.95),-2px 0 rgba(255,110,190,.35),2px 0 rgba(80,200,255,.35)}
.cv-dream .kicker{text-shadow:0 0 8px rgba(255,255,255,.9)}
.cv-dream.grain::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:${noise};opacity:.16;mix-blend-mode:overlay}
.cv-dream::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(60,70,140,.22));z-index:1}
body.popping .world{transform:scale(5.5);filter:blur(3px)}
body.popping .sky{transform:scale(1.5)}
body.popping .flash{opacity:1;transition:opacity .7s .8s}
/* 아이폰 · 아이패드(웹킷)는 탭 하나가 쓸 수 있는 메모리가 작아서, 가장 무거운 효과만 덜어냄 */
@supports (-webkit-touch-callout:none){
  .floor{width:2600px;margin-left:-1300px}
  body.popping .world{filter:none}
  .cv-dream.grain::after{mix-blend-mode:normal;opacity:.06}
}`;
}

function coverHTML(c) {
  return c.type === 'dream' ? dreamCover(c) : c.type === 'custom' ? customCover(c) : c.type === 'camera' ? cameraCover(c) : cakeCover(c);
}

/* =========================================================
   페이지 조각들
   ========================================================= */
const tagsHTML = s => tagList(s).length ? `<div class="tags">${tagList(s).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>` : '';

// 프롬프트: 사진(없으면 이름)을 누르면 복사 — 마우스를 올리면 안내 문구
const copyAttr = p => p ? `data-prompt="${esc(p)}" data-tip="눌러서 프롬프트 복사" tabindex="0" role="button"` : '';

// 캐릭터 한 명 블록 — imgHTML은 미리 만든 이미지 태그(없으면 생략)
function charHTML(c, label, imgHTML = '', hideCopyName = false) {
  const meta = [c.platform, c.creator].filter(Boolean).map(esc).join(' · ');
  return `<div class="cb">
    ${imgHTML ? `<div class="cb-pic ${c.prompt ? 'copyable' : ''}" ${copyAttr(c.prompt)}>${imgHTML}</div>` : ''}
    <div class="cb-t">
      ${label ? `<p class="lbl">${esc(label)}</p>` : ''}
      <h3 ${!imgHTML && !hideCopyName ? `class="copyable copy-name" ${copyAttr(c.prompt)}` : ''}>${esc(c.name || '이름')}</h3>
      ${meta ? `<p class="meta">${meta}</p>` : ''}
      ${c.with ? `<p class="meta mwith">${esc(c.with)}</p>` : ''}
      ${c.link ? `<a class="meta-lnk" href="${esc(c.link)}" target="_blank" rel="noopener">보러 가기 ↗</a>` : ''}
      ${c.desc ? `<div class="cd">${rt(c.desc)}</div>` : ''}
    </div>
  </div>`;
}

function profileHTML(e) {
  const im = e.images?.[0] ? `<img loading="lazy" decoding="async" src="${e.images[0]}" alt="">` : `<div class="ph">IMAGE</div>`;
  const info = (e.info || []).filter(r => r.k || r.v);
  const infoHTML = info.length ? `<div class="info">${info.map(r => r.fold
      ? `<details class="fold"><summary><span>${esc(r.k)}</span></summary><div class="fold-body">${nl(r.v)}</div></details>`
      : `<div class="ir"><span class="ik">${esc(r.k)}</span><span class="iv">${nl(r.v)}</span></div>`).join('')}</div>` : '';
  const text = (withName = true) => `<div class="tx">
      ${e.sub ? `<p class="sub">${esc(e.sub)}</p>` : ''}
      ${withName && e.name ? `<h3 class="nm">${esc(e.name)}</h3>` : ''}
      ${tagsHTML(e.tags)}
      ${infoHTML}
      ${e.desc ? `<div class="desc">${nl(e.desc)}</div>` : ''}
    </div>`;
  const body = e.layout === 'polaroid'
    ? `<div class="frame"><div class="media">${im}</div>${e.name ? `<p class="cap">${esc(e.name)}</p>` : ''}</div>${text(false)}`
    : `<div class="media">${im}</div>${text()}`;
  return `<div class="enw" ${accentStyle(e.accent)}><article class="en l-${esc(e.layout)}">${body}</article></div>`;
}

// 뒷면 배경 이미지: 위는 이미지가 비치고 아래로 갈수록 페이지 배경색으로 흐려짐
function backBg(m) {
  if (!m.backImg) return '';
  const f = Math.max(0, Math.min(100, Number(m.backFade) || 0));
  const img = `url('${m.backImg}') center/cover no-repeat`;
  if (!f) return `background:${img}`;
  const mix = k => `color-mix(in srgb,var(--card) ${Math.min(100, Math.round(f * k))}%,transparent)`;
  return `background:linear-gradient(180deg,${mix(.5)} 0%,${mix(1)} 50%,${mix(1.6)} 100%),${img}`;
}

/* ---------- 메인 페어 카드 템플릿 (엽서 · 영화표 · 영수증 · 컬러칩) ---------- */
const hexLum = h => { const n = parseInt(h.slice(1), 16); return (.299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255)) / 255; };
// 팔레트를 비워두면 포인트 색으로 어두운색 → 밝은색 5단계
const autoPalette = h => [shade(h, -.55), shade(h, -.28), h, shade(h, .38), shade(h, .72)];
function barcodeSVG(seed) {
  const r = rng(seed); let x = 0, bars = '';
  for (let n = 0; n < 44; n++) { const w = r() < .32 ? 2 : 1; bars += `<rect x="${x}" width="${w}" height="20"/>`; x += w + (r() < .42 ? 2 : 1); }
  return `<svg class="bc" viewBox="0 0 ${x} 20" preserveAspectRatio="none" aria-hidden="true" fill="currentColor">${bars}</svg>`;
}
function skinFaces(m, labels, accent) {
  const sk = m.skin, A = m.a, B = m.b;
  const seed = parseInt(fnv1a(`${m.title}|${A.name}|${B.name}`), 16);
  const title = m.title || [A.name, B.name].filter(Boolean).join(' × ') || 'MAIN PAIR';
  const sub = m.sub || 'MAIN PAIR';
  const no = String(seed % 10000).padStart(4, '0');
  const pal = (Array.isArray(m.palette) && m.palette.filter(isHex).length === 5) ? m.palette : autoPalette(accent);
  const tags = tagList(m.tags);
  const meta = c => [c.platform, c.creator].filter(Boolean).map(esc).join(' · ');
  const img = src => `<img loading="lazy" decoding="async" src="${src}" alt="">`;
  const photo = m.frontMode === 'duo'
    ? `<div class="duo-front">${[['frontA', 'l'], ['frontB', 'r']].map(([k, cls]) => `<span class="side ${cls}">${m[k] ? img(m[k]) : ''}</span>`).join('')}</div>`
    : m.image ? img(m.image) : '<div class="ph">MAIN IMAGE</div>';
  const av = (c, cls) => `<span class="${cls} ${c.image && c.prompt ? 'copyable' : ''}" ${c.image ? copyAttr(c.prompt) : ''}>${c.image ? img(c.image) : `<i>${esc(Array.from((c.name || '?').trim() || '?')[0])}</i>`}</span>`;
  const link = c => c.link ? `<a class="sk-lnk" href="${esc(c.link)}" target="_blank" rel="noopener">보러 가기 ↗</a>` : '';
  const who = [[A, labels.a], [B, labels.b]];
  const bc = barcodeSVG(seed);

  if (sk === 'postcard') {
    const stamp = (c, n) => `<span class="pc-st pc-st${n}"><span class="pc-paper">${av(c, 'pc-st-in')}</span></span>`;
    return [`
      <div class="pc-front"><div class="pc-photo">${photo}</div>
        ${m.showTitle && m.title ? `<p class="pc-cap">${esc(m.title)}</p>` : ''}</div>`, `
      <div class="pc-back">
        <div class="pc-side">
          <div class="pc-stamps">${stamp(A, 1)}${stamp(B, 2)}
            <span class="pc-mark"><b>${esc(sub)}</b>${m.date ? `<small>${esc(m.date)}</small>` : ''}</span></div>
          <div class="pc-addr">
            <p><i>TO.</i><span>${esc(B.name)}</span></p>
            <p><i>FROM.</i><span>${esc(A.name)}</span></p>
          </div>
        </div>
        <div class="pc-msg">
          <p class="pc-k">POST CARD</p>
          ${m.desc ? `<div class="pc-text">${rt(m.desc)}</div>` : ''}
          ${who.map(([c, l]) => `<div class="pc-p">${l ? `<small>${esc(l)}</small>` : ''}<b>${esc(c.name)}</b>${meta(c) ? `<span>${meta(c)}</span>` : ''}${link(c)}${c.desc ? `<div class="pc-d">${rt(c.desc)}</div>` : ''}</div>`).join('')}
          ${tags.length ? `<p class="pc-tags">${tags.map(t => `#${esc(t)}`).join(' ')}</p>` : ''}
        </div>
        <div class="pc-pal">${pal.map(c => `<span><i style="background:${c}"></i><em>${c.toUpperCase()}</em></span>`).join('')}</div>
      </div>`];
  }

  if (sk === 'ticket') {
    const screen = String(seed % 9 + 1).padStart(2, '0'), row = 'ABCDEFGHJK'[(seed >> 4) % 10], seat = (seed >> 8) % 24 + 1;
    return [`
      <div class="tk tk-f">
        <div class="tk-main"><div class="tk-photo">${photo}</div>
          <div class="tk-title"><p>${esc(sub)}</p><h2>${esc(title)}</h2>${m.date ? `<p class="tk-date">${esc(m.date)}</p>` : ''}</div></div>
        <div class="tk-stub"><p class="tk-admit">ADMIT<br>ONE</p><div class="tk-bc">${bc}</div><p class="tk-no">No. ${no}</p></div>
      </div>`, `
      <div class="tk tk-b">
        <div class="tk-stub"><p><small>SCREEN</small><b>${screen}</b></p><p><small>ROW</small><b>${row}</b></p><p><small>SEAT</small><b>${seat}</b></p><div class="tk-bc">${bc}</div></div>
        <div class="tk-main tk-info">
          <p class="tk-k">${esc(sub)}${m.date ? ` · ${esc(m.date)}` : ''}</p>
          <h3>${esc(title)}</h3>
          ${who.map(([c, l]) => `<div class="tk-cast">${av(c, 'tk-av')}<div><small>${esc(l || 'CAST')}</small><b>${esc(c.name)}</b>${meta(c) ? `<span>${meta(c)}</span>` : ''}${link(c)}${c.desc ? `<div class="tk-d">${rt(c.desc)}</div>` : ''}</div></div>`).join('')}
          ${m.desc ? `<div class="tk-desc">${rt(m.desc)}</div>` : ''}
          ${tags.length ? `<p class="tk-tags">${tags.map(t => `#${esc(t)}`).join(' ')}</p>` : ''}
        </div>
      </div>`];
  }

  if (sk === 'receipt') {
    const row = (l, v) => `<p class="rc-row"><span>${l}</span><i></i><span>${v}</span></p>`;
    return [`
      <div class="rc rc-f">
        <p class="rc-head">${esc(sub)}</p>
        <p class="rc-sm">${m.date ? `${esc(m.date)} · ` : ''}No.${no}</p>
        <div class="rc-photo">${photo}</div>
        <p class="rc-title">${esc(title)}</p>
        <div class="rc-bc">${bc}</div>
      </div>`, `
      <div class="rc rc-b">
        <p class="rc-head">${esc(sub)}</p>
        <p class="rc-sm">${m.date ? `${esc(m.date)} · ` : ''}No.${no}</p>
        <hr class="rc-hr">
        ${who.map(([c, l]) => `<div class="rc-item">${av(c, 'rc-av')}<div>${row(esc(l || 'ITEM'), esc(c.name))}${meta(c) ? `<p class="rc-sm l">${meta(c)}</p>` : ''}${link(c)}${c.desc ? `<div class="rc-d">${rt(c.desc)}</div>` : ''}</div></div>`).join('')}
        <hr class="rc-hr">
        ${tags.length ? row('TAGS', tags.map(esc).join(', ')) : ''}
        ${m.desc ? `<div class="rc-desc">${rt(m.desc)}</div>` : ''}
        <hr class="rc-hr dbl">
        <p class="rc-row rc-total"><span>TOTAL</span><i></i><span>♡ 100%</span></p>
        <div class="rc-bc">${bc}</div>
        <p class="rc-sm">THANK YOU · COME AGAIN</p>
      </div>`];
  }

  // chip — 컬러칩
  const code = (String(m.date || '').match(/\d+/g) || []).join('').slice(-6).replace(/^(\d{2})(\d{2})(\d{2})$/, '$1-$2$3') || `${String(seed % 89 + 10)}-${no}`;
  return [`
    <div class="ch ch-f"><div class="ch-photo">${photo}</div>
      <div class="ch-label"><p class="ch-brand">${esc(sub)}</p><p class="ch-code">${esc(code)}</p><p class="ch-name">${esc(title)}</p></div></div>`, `
    <div class="ch ch-b">
      <div class="ch-sw">${pal.map(c => `<span style="background:${c};color:${hexLum(c) > .6 ? '#1d2228' : '#fff'}"><em>${c.toUpperCase()}</em></span>`).join('')}</div>
      <div class="ch-body">
        <p class="ch-brand">${esc(title)}</p>
        ${who.map(([c, l]) => `<div class="ch-p">${av(c, 'ch-av')}<div><small>${esc(l || '')}</small><b>${esc(c.name)}</b>${meta(c) ? `<span>${meta(c)}</span>` : ''}${link(c)}${c.desc ? `<div class="ch-d">${rt(c.desc)}</div>` : ''}</div></div>`).join('')}
        ${m.desc ? `<div class="ch-desc">${rt(m.desc)}</div>` : ''}
        ${tags.length ? `<p class="ch-tags">${tags.map(t => `#${esc(t)}`).join(' ')}</p>` : ''}
      </div>
    </div>`];
}

function mainCard(m, i, labels, accent = '#4fa8e0') {
  if (CARD_SKINS[m.skin] && m.skin !== 'basic') {
    const orient = CARD_SKINS[m.skin].fixed || (m.style === 'postcard' ? 'postcard' : 'poster');
    const [front, back] = skinFaces(m, labels, isHex(m.accent) ? m.accent : accent);
    return `<div class="mcard" ${accentStyle(m.accent)}>
    <div class="flip ${orient} sk sk-${esc(m.skin)}" data-fi="${i}" ${ytId(m.track) ? `data-mus="${ytId(m.track)}"` : ''} role="button" tabindex="0" aria-label="카드 뒤집기">
      <div class="flip-inner"><div class="face front">${front}</div><div class="face back">${back}</div></div>
    </div>
  </div>`;
  }
  const pic = c => c.image ? `<img loading="lazy" decoding="async" src="${c.image}" alt="">` : '';
  // 메인 페어는 '대화한 캐릭터' 줄을 쓰지 않음 (서브 페어 전용)
  const nw = c => Object.assign({}, c, { with: '' });
  // 사진 가장자리를 그라데이션으로 투명하게 — 뒷배경 이미지와 자연스럽게 섞이도록
  const fade = Math.max(0, Math.min(100, Number(m.picFade) || 0));
  return `<div class="mcard" ${accentStyle(m.accent)}>
    <div class="flip ${m.style === 'postcard' ? 'postcard' : 'poster'}" data-fi="${i}" ${ytId(m.track) ? `data-mus="${ytId(m.track)}"` : ''} role="button" tabindex="0" aria-label="카드 뒤집기">
      <div class="flip-inner">
        <div class="face front">
          ${m.frontMode === 'duo'
            ? `<div class="duo-front">${[['frontA', 'l'], ['frontB', 'r']].map(([k, cls]) => `<span class="side ${cls}">${m[k] ? `<img loading="lazy" decoding="async" src="${m[k]}" alt="">` : ''}</span>`).join('')}</div>`
            : m.image ? `<img loading="lazy" decoding="async" src="${m.image}" alt="">` : `<div class="ph">MAIN IMAGE</div>`}
          ${m.showTitle && (m.title || m.sub) ? `<div class="front-tx">${m.sub ? `<p>${esc(m.sub)}</p>` : ''}${m.title ? `<h2>${esc(m.title)}</h2>` : ''}</div>` : ''}
        </div>
        <div class="face back lay-${esc(m.backLayout)} shape-${esc(m.picShape)} ${m.cardBg === false ? 'no-cb' : ''} ${m.backImg ? 'has-img' : ''} ${fade ? `pf pf-${esc(PIC_FADES[m.picFadeDir] ? m.picFadeDir : 'bottom')}` : ''} tx-${esc(m.textStyle || 'plain')}" style="--pic:${Number(m.picSize) || 100};--tc:${isHex(m.textColor) ? m.textColor : '#ffffff'};--pc:${isHex(m.pillColor) ? m.pillColor : '#ffffff'};--rad:${Number(m.picRadius) || 0};--pf:${fade};${backBg(m)}">
          <div class="bk-head">
            ${m.sub ? `<p class="sub">${esc(m.sub)}</p>` : ''}
            ${m.title ? `<h2>${esc(m.title)}</h2>` : ''}
            ${tagsHTML(m.tags)}
          </div>
          <div class="cols">
            ${charHTML(nw(m.a), labels.a, pic(m.a))}
            ${charHTML(nw(m.b), labels.b, pic(m.b))}
          </div>
          ${m.desc ? `<div class="bk-desc">${rt(m.desc)}</div>` : ''}
        </div>
      </div>
    </div>
  </div>`;
}

function mainsHTML(ms, labels, accent) {
  if (!ms.items.length) return `<p class="empty">아직 등록된 메인 페어가 없어요</p>`;
  // CHARACTER / USER 이름표 끄기
  const lb = ms.showRole === false ? { a: '', b: '' } : labels;
  return `${ms.intro ? `<p class="tab-intro">${nl(ms.intro)}</p>` : ''}
    ${ms.flipHint ? `<p class="flip-hint">${esc(ms.flipHint)}</p>` : ''}
    <div class="mains c${ms.cols}">${ms.items.map((m, i) => mainCard(m, i, lb, accent)).join('')}</div>`;
}

function othersHTML(o, labels, uid = 'o') {
  if (!o.items.length) return `<p class="empty">아직 등록된 페어가 없어요</p>`;
  const nf = `nf-${esc(o.nameFont || 'body')}`;
  // CHARACTER / USER 이름표 끄기
  const lb = k => o.showRole === false ? '' : labels[k];
  const ds = `ds-${esc(DETAIL_STYLES[o.detailStyle] ? o.detailStyle : 'card')}`;
  const side = (c, cls) => `<span class="side ${cls}">${c.image ? `<img loading="lazy" decoding="async" src="${c.image}" alt="">` : ''}</span>`;
  const cap = p => `<span class="dp-nm">${esc(p.a.name || '캐릭터')}<i>×</i>${esc(p.b.name || '유저')}</span>`;
  const soloName = p => p.a.name || (p.role === 'b' ? '유저' : '캐릭터');
  const show = o.showName !== false, below = show && o.namePos === 'below';
  const acc = p => `${accentStyle(p.accent)} ${isHex(p.accent) ? `data-accent="${p.accent}"` : ''}`;
  const pairBtn = (p, i) => `
        <button type="button" class="dpw ${below ? 'below' : ''}" data-pd="${uid}-${i}" ${ytId(p.track) ? `data-mus="${ytId(p.track)}"` : ''} ${acc(p)}>
          <span class="dp">${side(p.a, 'l')}${side(p.b, 'r')}${show && !below ? `<span class="shade"></span>${cap(p)}` : ''}</span>
          ${below ? cap(p) : ''}
        </button>`;
  const soloBtn = (p, i) => `
          <button type="button" class="dpw solo" data-pd="${uid}-${i}" ${ytId(p.track) ? `data-mus="${ytId(p.track)}"` : ''} ${acc(p)}>
            <span class="sp s">${p.a.image ? `<img loading="lazy" decoding="async" src="${p.a.image}" alt="">` : `<span class="ini">${esc(Array.from(soloName(p))[0])}</span>`}</span>
            ${show ? `<span class="dp-nm">${esc(soloName(p))}</span>` : ''}
          </button>`;

  // 연속된 단독은 한 줄에 동그라미로 모아서 배치
  const listOf = entries => {
    let list = '', run = '';
    entries.forEach(([p, i]) => {
      if (p.kind === 'solo') { run += soloBtn(p, i); return; }
      if (run) { list += `<div class="solos">${run}</div>`; run = ''; }
      list += pairBtn(p, i);
    });
    return run ? list + `<div class="solos">${run}</div>` : list;
  };

  // 목록 나누기: 목록이 없는 항목은 맨 위, 나머지는 목록 순서대로
  const groups = o.groups || [];
  const buckets = [{ id: '', title: '', intro: '', entries: [] }, ...groups.map(g => ({ id: g.id, title: g.title, intro: g.intro, entries: [] }))];
  o.items.forEach((p, i) => (buckets.find(b => b.id && b.id === p.group) || buckets[0]).entries.push([p, i]));
  const shown = buckets.filter(b => b.entries.length);
  const titled = shown.filter(b => b.id);
  const chips = o.groupStyle === 'chips' && titled.length > 1;
  // '전체' 탭을 뺐다면 첫 번째 목록을 골라 둔 상태로 시작 (목록이 없는 항목은 항상 보임)
  const allChip = o.showAll !== false, startId = chips && !allChip ? titled[0].id : null;

  return `${o.intro ? `<p class="tab-intro">${nl(o.intro)}</p>` : ''}
    ${chips ? `<div class="gchips">${allChip ? '<button type="button" class="gchip on" data-g="*">전체</button>' : ''}${titled.map(b => `<button type="button" class="gchip ${b.id === startId ? 'on' : ''}" data-g="${esc(b.id)}">${esc(b.title || '세부 탭')}</button>`).join('')}</div>` : ''}
    <div class="sgrps ${startId ? 'filtered' : ''}">${shown.map(b => `
      <div class="sgrp" data-g="${esc(b.id)}" ${startId && b.id && b.id !== startId ? 'hidden' : ''}>
        ${b.id && b.title ? `<h3 class="sgrp-t">${esc(b.title)}</h3>` : ''}
        ${b.id && b.intro ? `<p class="sgrp-intro">${nl(b.intro)}</p>` : ''}
        <div class="dpills c${o.cols} ${nf}">${listOf(b.entries)}</div>
      </div>`).join('')}
    </div>
    ${o.items.map((p, i) => p.kind === 'solo' ? `
      <template id="pd-${uid}-${i}">
        <div class="dsheet ${ds}">
          <h2 class="d-title ${nf}">${esc(soloName(p))}</h2>
          <div class="cols solo">${charHTML(p.a, p.role === 'b' ? lb('b') : lb('a'), p.a.image ? `<img data-from="${i}-s" alt="">` : '')}</div>
        </div>
      </template>` : `
      <template id="pd-${uid}-${i}">
        <div class="dsheet ${ds}">
          <h2 class="d-title ${nf}">${esc(p.a.name)}<span class="px">×</span>${esc(p.b.name)}</h2>
          <div class="cols">
            ${charHTML(p.a, lb('a'), p.a.image ? `<img data-from="${i}-l" alt="">` : '')}
            ${charHTML(p.b, lb('b'), p.b.image ? `<img data-from="${i}-r" alt="">` : '')}
          </div>
        </div>
      </template>`).join('')}`;
}

function pageHTML(tb, pg) {
  const items = pg.items || [];
  let body = '';
  switch (tb.type) {
    case 'text':
      body = items.map(b => `<div class="tblock">${b.title ? `<h3>${esc(b.title)}</h3>` : ''}${b.body ? `<div class="tb-body">${nl(b.body)}</div>` : ''}</div>`).join('');
      break;
    case 'qna':
      body = items.map(x => pg.fold
        ? `<details class="qa"><summary><span class="qm">Q</span><span class="qq">${esc(x.q)}</span></summary><div class="qa-a"><span class="am">A</span><div>${nl(x.a)}</div></div></details>`
        : `<div class="qa"><div class="qa-q"><span class="qm">Q</span><span class="qq">${esc(x.q)}</span></div><div class="qa-a"><span class="am">A</span><div>${nl(x.a)}</div></div></div>`).join('');
      break;
    case 'rules': {
      const L = Object.assign({ ok: '괜찮아요', no: '안 돼요', ask: '물어봐 주세요' }, pg.labels);
      const sym = { ok: '○', no: '✕', ask: '△' };
      body = `<div class="rules">${['ok', 'no', 'ask'].map(m => {
        const list = items.filter(x => x.mark === m && x.text);
        return list.length ? `<div class="rule-col r-${m}"><h3><span class="rm">${sym[m]}</span>${esc(L[m])}</h3><ul>${list.map(x => `<li>${nl(x.text)}</li>`).join('')}</ul></div>` : '';
      }).join('')}</div>`;
      break;
    }
    case 'gallery':
      body = `<div class="pgal c${Number(pg.cols) || 2}">${items.map(g => `
        <button type="button" class="pgal-it" data-cap="${esc(g.caption)}">
          ${g.image ? `<img loading="lazy" decoding="async" src="${g.image}" alt="">` : '<div class="ph">IMAGE</div>'}
          ${g.caption ? `<span class="pgal-cap">${esc(g.caption)}</span>` : ''}
        </button>`).join('')}</div>`;
      break;
    case 'links':
      body = `<div class="plinks">${items.map(l => {
        const inner = `${l.emoji ? `<span class="lk-em">${esc(l.emoji)}</span>` : ''}<span class="lk-t">${esc(l.label)}</span>`;
        return l.url ? `<a class="lk-btn" href="${esc(l.url)}" target="_blank" rel="noopener">${inner}<span class="lk-ar">↗</span></a>` : `<span class="lk-btn">${inner}</span>`;
      }).join('')}</div>`;
      break;
  }
  if (!body.replace(/<[^>]+>/g, '').trim() && tb.type !== 'gallery') body = '<p class="empty">아직 내용이 없어요</p>';
  return `<div class="pg pg-${esc(tb.type)}" ${accentStyle(pg.accent)}>${pg.intro ? `<p class="tab-intro">${nl(pg.intro)}</p>` : ''}${body}</div>`;
}

function tabHTML(tb, d) {
  switch (tb.type) {
    case 'profile': return profileHTML(getPath(d, dataPath(tb)));
    case 'mains':   return mainsHTML(getPath(d, dataPath(tb)), d.labels, d.theme.accent);
    case 'others':  return othersHTML(getPath(d, dataPath(tb)), d.labels, tb.id);
    case 'friends': return friendsHTML(getPath(d, dataPath(tb)));
    default:        return pageHTML(tb, d.pages[tb.id] || {});
  }
}

function friendsHTML(f) {
  // 사진 > 이모지 > 이름 첫 글자 순으로 동그라미 채우기
  const av = x => x.image
    ? `<span class="fr-av"><img loading="lazy" decoding="async" src="${x.image}" alt=""></span>`
    : x.emoji ? `<span class="fr-av em">${esc(x.emoji)}</span>`
    : `<span class="fr-av ini">${esc(Array.from(String(x.name || '?').trim() || '?')[0])}</span>`;
  const body = x => `${av(x)}
    <span class="fr-b">
      <span class="fr-n">${esc(x.name || '이름 없음')}</span>
      ${x.desc ? `<span class="ds">${nl(x.desc)}</span>` : ''}
    </span>
    ${x.link ? '<span class="fr-go" aria-hidden="true">↗</span>' : ''}`;
  return `${f.intro ? `<p class="tab-intro">${nl(f.intro)}</p>` : ''}
    ${f.items.length ? `<div class="friends c${f.cols}">${f.items.map(x => x.link
      ? `<a class="fr" href="${esc(x.link)}" target="_blank" rel="noopener" ${accentStyle(x.accent)}>${body(x)}</a>`
      : `<div class="fr" ${accentStyle(x.accent)}>${body(x)}</div>`).join('')}</div>`
      : `<p class="empty">아직 등록된 트친이 없어요</p>`}`;
}

/* =========================================================
   페이지 템플릿 (미리보기 = 내보내기 결과물)
   ========================================================= */
function buildPage(d, init) {
  const t = d.theme, c = d.cover;
  const svg = (w, body) => `<svg viewBox="0 0 20 20" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
  const ico = {
    side:  svg(18, '<rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M7.5 4v12"/>'),
    back:  svg(18, '<path d="M12 4.5L6.5 10l5.5 5.5"/>'),
    fwd:   svg(18, '<path d="M8 4.5l5.5 5.5L8 15.5"/>'),
    lock:  '<svg viewBox="0 0 12 12" width="10" height="10"><rect x="2" y="5" width="8" height="6" rx="1.5" fill="currentColor"/><path d="M4 5V3.8a2 2 0 014 0V5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>',
    reload:svg(15, '<path d="M15.5 10a5.5 5.5 0 11-1.6-3.9M15.5 3.5v3h-3"/>'),
    share: svg(18, '<path d="M10 3v9M6.5 6.5L10 3l3.5 3.5M6 9.5H5v7h10v-7h-1"/>'),
    plus:  svg(18, '<path d="M10 4.5v11M4.5 10h11"/>'),
    tabs:  svg(18, '<rect x="3" y="6" width="10" height="10" rx="2"/><path d="M7 3.5h7.5A2 2 0 0116.5 5.5V13"/>'),
  };
  // 배경 음악 — 재생목록(유튜브) + 항목마다 지정한 노래
  const mu = Object.assign({ on: false, volume: 60, tracks: [] }, d.music);
  const muList = (mu.tracks || []).map(t => ({ i: ytId(t.url), t: String(t.title || '') })).filter(x => x.i);
  const musicOn = !!mu.on;

  // 비밀번호 잠금 — 미리보기에서는 init.unlock 으로 건너뜀, 내보낸 파일에는 항상 들어감
  const lk = Object.assign({ codes: [] }, d.lock);
  const lkCodes = (lk.codes || []).filter(x => String(x.code || '').length).map(x => ({
    h: fnv1a(String(x.code)),
    t: (x.tabs || []).map(id => d.tabs.findIndex(t => t.id === id)).filter(i => i >= 0),
  })).filter(x => x.t.length);
  const locked = !!(lk.on && lkCodes.length && !init.unlock);
  const bodyCls = [init.opened ? 'opened gone no-anim' : (c.type === 'cake' && init.peek) ? 'popping no-anim' : '', locked ? 'locked' : ''].filter(Boolean).join(' ');
  const enterDelay = { cake: 1150, dream: 1550, custom: 700, camera: 30 }[c.type] || 1200;

  return `<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(d.profile.name)}</title>
<link rel="stylesheet" href="${fontLink(d)}">
<style>
:root{--accent:${t.accent};--text:${t.text};--card:${t.card};
  --csize:${Number(c.cakeSize) || 400}px;
  --sx:${c.sx}%;--sy:${c.sy}%;--sw:${c.sw}%;--sr:${c.sr}deg;--lift:${c.lift}%;--pic:100;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --script:'Dancing Script','Nanum Pen Script',cursive}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--card)}
body{color:var(--text);font-family:'${t.font}',"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.7;overflow:hidden}

/* ---------- 표지 ---------- */
${coverCSS(c)}

  box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 2px 10px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.9)}

  background:rgba(20,24,32,.55) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='white' stroke-width='1.6'><rect x='5.5' y='5.5' width='8' height='8' rx='2'/><path d='M10.5 5.5V4a1.5 1.5 0 00-1.5-1.5H4A1.5 1.5 0 002.5 4v5A1.5 1.5 0 004 10.5h1.5'/></svg>") center/12px no-repeat}}
/* ---------- 배경 음악 (유튜브) ---------- */
.mus-btn{position:relative;border:0;background:none;cursor:pointer;font-size:14px;line-height:1;padding:0;
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;transition:color .2s,transform .2s,filter .2s}
.mus-btn.has-bg{box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}

.mus-btn.on::after{content:"";position:absolute;right:-1px;top:0;width:5px;height:5px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}

  font-family:var(--sys);background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(20px) saturate(1.8);backdrop-filter:blur(20px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.09),0 12px 30px -10px rgba(20,40,70,.35);animation:fade .2s}

  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mus-row{display:flex;align-items:center;gap:4px}

  width:28px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;transition:background .15s,color .15s}
.mus-k:hover{background:rgba(0,0,0,.06);color:#1d1d1f}
.mus-k.big{font-size:12px;color:#1d1d1f}
.mus-k.wide{width:auto;padding:0 9px;font-size:11.5px;font-weight:600;color:#6b6b72}
.mus-k.wide.on{background:var(--accent);color:#fff}
.mus-sp{flex:1}
.yt-wrap{position:fixed;right:14px;bottom:14px;z-index:30;width:196px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;
  opacity:0;pointer-events:none;transform:translateY(10px) scale(.94);transition:opacity .25s,transform .25s}
.yt-wrap.on{opacity:1;pointer-events:auto;transform:none;box-shadow:0 16px 36px -10px rgba(0,0,0,.5)}
.yt-wrap iframe{width:100%;height:100%;border:0;display:block}
@media (max-width:600px){
  .mus-pop{top:52px;left:10px;width:min(258px,calc(100% - 20px))}

}

.toast{position:fixed;left:50%;bottom:26px;z-index:60;transform:translate(-50%,16px);background:rgba(28,28,30,.9);color:#fff;font:500 13px var(--sys);padding:9px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none}

/* ---------- 프로필 ---------- */
.enw{container-type:inline-size}
.media{border-radius:16px;overflow:hidden}
.media img{width:100%}
.media .ph{aspect-ratio:4/3}
.nm{font-size:23px;margin:0 0 8px;line-height:1.35}
.desc{margin-top:10px}
.info{margin:14px 0;border-top:1px dashed color-mix(in srgb,var(--text) 16%,transparent)}

.ir{display:grid;grid-template-columns:minmax(5.5em,max-content) 1fr;gap:14px;padding:9px 2px;font-size:15px}
.ik{color:var(--accent);font-weight:700}
.iv{min-width:0}
.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 2px;font-size:15px;font-weight:700;color:var(--accent)}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .25s}

.l-overlay{position:relative;border-radius:16px;overflow:hidden;color:#fff;background:#333}
.l-overlay .media{border-radius:0}

.l-overlay .tx{position:absolute;left:0;right:0;bottom:0;padding:70px 20px 20px;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.l-overlay .sub,.l-overlay .ik,.l-overlay .fold summary{color:#fff}
.l-overlay .tag{background:rgba(255,255,255,.22);color:#fff}
