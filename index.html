.l-polaroid .cap{margin:8px 0 6px;font-size:18px}
.l-polaroid .tx{margin-top:14px}
.l-polaroid .tags{justify-content:center}
.l-polaroid .info{text-align:left}

/* ---------- 메인 페어: 뒤집히는 카드 ---------- */
.mains{display:grid;gap:34px}
.mains.c2{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px}
@media (max-width:600px){.mains.c2{grid-template-columns:1fr}}
.flip{perspective:1800px;cursor:pointer;margin:6px auto 0;outline:none;-webkit-tap-highlight-color:transparent}
.flip.postcard{max-width:640px}
.flip.poster{max-width:420px}
.flip-inner{position:relative;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.9,.25,1)}
.postcard .flip-inner{aspect-ratio:3/2}
.flip:not(.on):hover .flip-inner{transform:rotateY(-7deg) rotateX(2deg)}
.flip.on .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.04),0 16px 36px -12px rgba(20,50,80,.3)}
.front img{width:100%;height:100%;object-fit:cover}
.front-tx{position:absolute;left:0;right:0;bottom:0;padding:70px 22px 20px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.front-tx p{margin:0;font-size:12px;letter-spacing:.2em;opacity:.85}
.front-tx h2{margin:2px 0 0;font-size:clamp(22px,6vw,32px);line-height:1.25}
.back{transform:rotateY(180deg);overflow:auto;padding:20px 16px 18px;scrollbar-width:thin;
  background:linear-gradient(165deg,color-mix(in srgb,var(--accent) 16%,var(--card)),var(--card) 65%)}
.bk-head{text-align:center;margin-bottom:12px}
.bk-head .tags{justify-content:center}
.bk-head h2{margin:0;font-size:22px;line-height:1.35}
.back .cb{background:var(--card);box-shadow:0 1px 4px rgba(20,50,80,.08)}
.back.has-img .cb{background:color-mix(in srgb,var(--card) 84%,transparent)}
.back.no-cb .cb{background:none;box-shadow:none;padding:2px 4px}
.back.no-cb .cols{gap:18px}
.back.tx-pill .bk-head h2,.back.tx-pill .cb h3{display:inline-block;border-radius:999px;background:color-mix(in srgb,var(--pc) 88%,transparent)}
.back.tx-pill .bk-head h2{padding:1px 16px;margin:2px 0}
.back.tx-pill .cb h3{padding:0 12px;margin:2px 0 2px -4px}
.back.tx-color .bk-head h2,.back.tx-color .cb h3,.back.tx-color .cd,.back.tx-color .bk-desc,.back.tx-color .meta{color:var(--tc)}
.back.tx-color .cb{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:none}
.back.tx-color.no-cb .cb{background:none}
.duo-front{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,var(--card)),color-mix(in srgb,var(--accent) 18%,var(--card)))}
.duo-front .side{position:absolute;top:0;bottom:0;width:66%}
.duo-front .l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 42%,transparent 98%);mask-image:linear-gradient(90deg,#000 42%,transparent 98%)}
.duo-front .r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 42%,transparent 98%);mask-image:linear-gradient(270deg,#000 42%,transparent 98%)}
.bk-desc{margin:14px 4px 0;font-size:14.5px}
.lay-rows .cols{grid-template-columns:1fr}
.lay-rows .cb{flex-direction:row;align-items:flex-start;gap:12px}
.lay-rows .cb-pic{width:calc(var(--pic) * 1.3px);margin:0;align-self:flex-start}
.lay-rows .cb-t{flex:1}
.shape-tall .cb-pic{aspect-ratio:3/4}
.shape-wide .cb-pic{aspect-ratio:4/3}
.shape-round .cb-pic{border-radius:50%}
.shape-arch .cb-pic{aspect-ratio:3/4;border-radius:999px 999px 0 0}
.shape-heart .cb-pic{border-radius:0;border:0;box-shadow:none;background:none;-webkit-mask:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 94C17 70 2 51 2 30 2 14 14 4 28 4c10 0 18 6 22 14 4-8 12-14 22-14 14 0 26 10 26 26 0 21-15 40-48 64Z'/></svg>\") center/100% 100% no-repeat;mask:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 94C17 70 2 51 2 30 2 14 14 4 28 4c10 0 18 6 22 14 4-8 12-14 22-14 14 0 26 10 26 26 0 21-15 40-48 64Z'/></svg>\") center/100% 100% no-repeat}
.shape-natural .cb-pic{aspect-ratio:auto}
.shape-natural .cb-pic img{height:auto}
/* 사진 가장자리를 그라데이션으로 투명하게 — 뒷배경 이미지와 자연스럽게 섞기 */
.pf{--fs:calc(100% - var(--pf) * 1%);--fh:calc(var(--pf) * .5%)}
.pf .cb-pic{background:none;border:0;box-shadow:none}
.pf .cb-pic img{-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.pf-bottom .cb-pic img{-webkit-mask-image:linear-gradient(180deg,#000 var(--fs),transparent 100%);mask-image:linear-gradient(180deg,#000 var(--fs),transparent 100%)}
.pf-top .cb-pic img{-webkit-mask-image:linear-gradient(0deg,#000 var(--fs),transparent 100%);mask-image:linear-gradient(0deg,#000 var(--fs),transparent 100%)}
.pf-sides .cb-pic img{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--fh),#000 calc(100% - var(--fh)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--fh),#000 calc(100% - var(--fh)),transparent 100%)}
.pf-edge .cb-pic img{-webkit-mask-image:radial-gradient(farthest-corner at 50% 50%,#000 var(--fs),transparent 100%);mask-image:radial-gradient(farthest-corner at 50% 50%,#000 var(--fs),transparent 100%)}
.flip-hint{text-align:center;font:12.5px var(--sys);opacity:.5;margin:-8px 0 18px;transition:opacity .4s}

/* ---------- 메인 페어 카드 템플릿 ---------- */
.sk{--sk-type:'Special Elite','Nanum Gothic Coding',ui-monospace,monospace;--sk-mono:'Nanum Gothic Coding',ui-monospace,Menlo,monospace;

/* 엽서 */

.pc-cap{position:absolute;left:9cqmin;bottom:8cqmin;margin:0;max-width:72%;color:#fff;font:400 max(24px,8cqmin)/1.05 var(--sk-hand);
  text-shadow:0 1px 8px rgba(0,0,0,.45);transform:rotate(-5deg);transform-origin:left bottom}
.pc-back{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;padding:5cqmin 5.5cqmin 4.5cqmin;display:grid;gap:3.4cqmin 5cqmin;color:#3b3a36;
  grid-template-columns:minmax(0,1fr) 36%;grid-template-rows:1fr auto;grid-template-areas:"msg side" "pal pal"}
.poster .pc-back{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"side" "msg" "pal"}
.pc-msg{grid-area:msg;min-width:0;display:flex;flex-direction:column;gap:2.6cqmin}

  mask:radial-gradient(var(--p),#0000 97%,#000) round calc(var(--p) * -1.5) calc(var(--p) * -1.5)/calc(var(--p) * 3) calc(var(--p) * 3),linear-gradient(#000 0 0) no-repeat 50%/calc(100% - var(--p) * 3) calc(100% - var(--p) * 3)}
.pc-st1{transform:rotate(-4deg);z-index:1}

.pc-mark{position:absolute;right:62%;bottom:-22%;z-index:2;width:max(58px,16cqmin);aspect-ratio:1;border:max(1.5px,.45cqmin) solid currentColor;border-radius:50%;
  display:grid;place-content:center;gap:.4cqmin;text-align:center;color:color-mix(in srgb,var(--accent) 50%,#33302a);opacity:.6;transform:rotate(-14deg);
  pointer-events:none;font-family:var(--sk-type);line-height:1.15}
.pc-mark::before{content:"";position:absolute;inset:max(2.5px,.75cqmin);border:1px solid currentColor;border-radius:50%}
.pc-mark::after{content:"";position:absolute;left:96%;top:28%;width:130%;height:44%;background:currentColor;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 22'><path d='M0 4q7.5-4 15 0t15 0 15 0 15 0M0 11q7.5-4 15 0t15 0 15 0 15 0M0 18q7.5-4 15 0t15 0 15 0 15 0' fill='none' stroke='black' stroke-width='1.4'/></svg>") center/100% 100% no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 22'><path d='M0 4q7.5-4 15 0t15 0 15 0 15 0M0 11q7.5-4 15 0t15 0 15 0 15 0M0 18q7.5-4 15 0t15 0 15 0 15 0' fill='none' stroke='black' stroke-width='1.4'/></svg>") center/100% 100% no-repeat}
.pc-mark b{font-weight:400;font-size:max(7px,1.8cqmin);letter-spacing:.06em;max-width:max(44px,12cqmin);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pc-p{display:grid;gap:.5cqmin;font-size:max(12px,2.4cqmin)}

  mask:radial-gradient(circle var(--r) at 0 var(--py),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle var(--r) at 100% var(--py),#0000 97%,#000) right/51% 100% no-repeat}

.poster .tk-stub{height:23%;flex-direction:row;justify-content:space-around;padding:0 5cqmin}
.postcard .tk-f .tk-stub{border-left:max(2px,.45cqmin) dashed rgba(255,255,255,.5)}
.postcard .tk-b .tk-stub{border-right:max(2px,.45cqmin) dashed rgba(255,255,255,.5)}
.poster .tk-f .tk-stub{border-top:max(2px,.45cqmin) dashed rgba(255,255,255,.5)}
.poster .tk-b .tk-stub{order:2;border-top:max(2px,.45cqmin) dashed rgba(46,42,36,.3)}
.tk-photo{position:absolute;inset:0;background:#262b36}
.tk-photo>img{width:100%;height:100%;object-fit:cover}
.tk-photo .ph{color:rgba(255,255,255,.45)}
.tk-title{position:absolute;left:0;right:0;bottom:0;padding:14cqmin 5cqmin 4.5cqmin;color:#fff;background:linear-gradient(transparent,rgba(10,12,20,.8))}
.tk-title p{margin:0;font:max(9px,2cqmin) var(--sk-mono);letter-spacing:.24em;text-transform:uppercase;opacity:.82}
.tk-title h2{margin:.6cqmin 0 0;font:400 max(28px,9cqmin)/.95 var(--sk-cond);letter-spacing:.02em;text-wrap:balance}
.tk-title .tk-date{margin-top:1.4cqmin;letter-spacing:.14em}
.tk-admit{margin:0;font:400 max(19px,5.6cqmin)/.88 var(--sk-cond);letter-spacing:.06em}
.tk-bc{width:78%;height:max(22px,8cqmin)}
.poster .tk-bc{width:36%;height:max(26px,9cqmin)}
.tk-bc .bc{display:block;width:100%;height:100%}
.tk-no{margin:0;font:max(8.5px,1.8cqmin) var(--sk-mono);letter-spacing:.14em;opacity:.82}
.tk-b .tk-main{background:#f6efe1;color:#2e2a24}
.tk-b .tk-stub{background:color-mix(in srgb,var(--accent) 22%,#f6efe1);color:#2e2a24}
.tk-b .tk-stub p{margin:0;display:grid;gap:.6cqmin;line-height:1}
.tk-b .tk-stub small{font:max(7.5px,1.5cqmin) var(--sk-mono);letter-spacing:.2em;opacity:.65}
.tk-b .tk-stub b{font:400 max(20px,6cqmin)/1 var(--sk-cond);color:color-mix(in srgb,var(--accent) 65%,#2e2a24)}
.tk-info{overflow:auto;scrollbar-width:thin;padding:4.5cqmin 5cqmin;display:flex;flex-direction:column;gap:2.6cqmin}
.tk-k{margin:0;font:max(9px,1.9cqmin) var(--sk-mono);letter-spacing:.2em;text-transform:uppercase;opacity:.6}
.tk-info h3{margin:-1cqmin 0 0;font:400 max(24px,6.8cqmin)/1 var(--sk-cond);letter-spacing:.02em;color:color-mix(in srgb,var(--accent) 60%,#2e2a24)}
.tk-cast{display:flex;gap:2.6cqmin;align-items:flex-start;padding-top:2.4cqmin;border-top:1px dashed rgba(46,42,36,.25)}
.tk-av,.rc-av,.ch-av{flex:none;aspect-ratio:1;overflow:hidden;background:color-mix(in srgb,var(--accent) 35%,#fff)}
.tk-av{width:max(40px,11cqmin);border-radius:max(4px,1cqmin)}
.tk-av img,.rc-av img,.ch-av img{width:100%;height:100%;object-fit:cover}
.tk-av i,.rc-av i,.ch-av i{display:grid;place-items:center;height:100%;font-style:normal;font-weight:700;color:#fff;font-size:max(15px,4cqmin)}
.tk-cast>div,.rc-item>div,.ch-p>div{min-width:0;display:grid;gap:.5cqmin;align-content:start}
.tk-cast small{font:max(8px,1.6cqmin) var(--sk-mono);letter-spacing:.18em;opacity:.55}
.tk-cast b{font-size:max(14px,3cqmin)}
.tk-cast span{font-size:max(11px,2cqmin);opacity:.6}
.tk-d,.tk-desc{font-size:max(12px,2.3cqmin);line-height:1.6}
.tk-desc{padding-top:2.4cqmin;border-top:1px dashed rgba(46,42,36,.25)}
.tk-tags{margin:0;font:max(10.5px,2cqmin) var(--sk-mono);color:color-mix(in srgb,var(--accent) 70%,#2e2a24)}

/* 영수증 */
.rc{--z:max(11px,3.4cqw);position:absolute;inset:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;align-items:center;gap:2.4cqw;
  padding:calc(var(--z) + 5cqw) 7cqw calc(var(--z) + 5cqw);background:#fdfcf7;color:#26241f;font-family:var(--sk-mono);text-align:center;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/var(--z) 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/var(--z) 51% repeat-x;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/var(--z) 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/var(--z) 51% repeat-x}
.rc::-webkit-scrollbar{display:none}
.rc-head{margin:0;font-weight:700;font-size:max(14px,4.6cqw);letter-spacing:.2em;text-transform:uppercase}
.rc-sm{margin:0;font-size:max(10px,2.8cqw);letter-spacing:.06em;opacity:.62}
.rc-sm.l{text-align:left}
.rc-photo{position:relative;flex:1 1 auto;min-height:30%;width:100%;overflow:hidden;background:#ece9df;margin:1.4cqw 0}
.rc-photo>img{width:100%;height:100%;object-fit:cover}
.rc-title{margin:0;font-weight:700;font-size:max(13px,4.2cqw);line-height:1.35;text-wrap:balance}
.rc-bc{flex:none;width:64%;height:max(28px,9cqw)}
.rc-bc .bc{display:block;width:100%;height:100%}
.rc-hr{flex:none;width:100%;margin:.6cqw 0;border:0;border-top:1px dashed rgba(38,36,31,.45)}
.rc-hr.dbl{border-top:3px double rgba(38,36,31,.5)}
.rc-item{width:100%;display:flex;gap:3cqw;text-align:left;align-items:flex-start}
.rc-av{width:max(36px,11cqw);background:#e6e2d6}
.rc-row{margin:0;width:100%;display:flex;align-items:baseline;gap:1.6cqw;font-size:max(12px,3.3cqw);text-align:left}
.rc-row span:first-child{flex:none;letter-spacing:.08em;opacity:.7;font-size:max(10px,2.8cqw)}
.rc-row i{flex:1;min-width:2cqw;border-bottom:1px dotted rgba(38,36,31,.5);transform:translateY(-.3em)}
.rc-row span:last-child{font-weight:700;text-align:right;max-width:64%;overflow-wrap:anywhere}
.rc-d,.rc-desc{width:100%;font-size:max(11.5px,3cqw);line-height:1.65;text-align:left}
.rc-total{font-size:max(15px,4.4cqw)}
.rc-total span:first-child{font-size:inherit;opacity:1;font-weight:700}

/* 컬러칩 */
.sk-chip .face{background:#fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 16px 30px -14px rgba(20,30,50,.4)}
.ch{position:absolute;inset:0;display:flex;flex-direction:column;font-family:var(--sk-helv);color:#16181c}
.ch-photo{position:relative;flex:1;min-height:0;background:#e9ecef}
.ch-photo>img{width:100%;height:100%;object-fit:cover}
.ch-label{flex:none;padding:4.6cqw 6cqw 5.4cqw;display:grid;gap:.9cqw}
.ch-brand{margin:0;font-weight:800;font-size:max(15px,5.6cqw);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.ch-code{margin:0;font-weight:700;font-size:max(12px,3.8cqw);letter-spacing:.02em}
.ch-name{margin:0;font-size:max(11px,3.2cqw);opacity:.66}
.ch-b{overflow:auto;scrollbar-width:thin}
.ch-sw{flex:none;display:flex;height:38%}
.ch-sw span{flex:1;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3cqw}
.ch-sw em{font:700 max(8px,2.3cqw)/1 var(--sk-helv);font-style:normal;letter-spacing:.04em;writing-mode:vertical-rl;transform:rotate(180deg)}
.ch-body{padding:5.4cqw 6cqw 6cqw;display:flex;flex-direction:column;gap:3.2cqw}
.ch-b .ch-brand{font-size:max(15px,5cqw);text-transform:none}
.ch-p{display:flex;gap:3cqw;align-items:flex-start;padding-top:3cqw;border-top:1px solid rgba(0,0,0,.1)}
.ch-av{width:max(38px,11.5cqw);background:#e9ecef}
.ch-p small{font-size:max(8.5px,2.3cqw);font-weight:700;letter-spacing:.14em;opacity:.5}
.ch-p b{font-size:max(14px,4.2cqw);font-weight:800}
.ch-p span{font-size:max(11px,2.9cqw);opacity:.6}
.ch-d,.ch-desc{font-size:max(12px,3.3cqw);line-height:1.6}
.ch-tags{margin:0;font-size:max(11px,3cqw);font-weight:700;opacity:.5}

/* ---------- 서브 페어: 이미지 알약 ---------- */
.dpills{display:grid;gap:16px}
.dpills.c2{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.dpw{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.dp{position:relative;display:block;height:112px;border-radius:999px;overflow:hidden;isolation:isolate;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 45%,var(--card)),color-mix(in srgb,var(--accent) 18%,var(--card)));
  box-shadow:0 0 0 1px rgba(0,0,0,.05),0 8px 22px -10px rgba(20,50,80,.3);transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.dpw:hover .dp{transform:translateY(-2px) scale(1.01);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 14px 30px -12px rgba(20,50,80,.35)}
.dpw:active .dp{transform:scale(.98)}
.dp .side{position:absolute;top:0;bottom:0;width:64%}
.dp .side img{width:100%;height:100%;object-fit:cover}
.dp .l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 95%);mask-image:linear-gradient(90deg,#000 40%,transparent 95%)}
.dp .r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 40%,transparent 95%);mask-image:linear-gradient(270deg,#000 40%,transparent 95%)}
.dp .shade{position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(transparent,rgba(10,30,55,.34))}
.dp-nm{display:block;font-family:var(--script);font-size:26px;font-weight:500;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-nm i{font:400 .5em var(--sys);margin:0 .55em;vertical-align:.3em;opacity:.8}
.dp .dp-nm{position:absolute;left:0;right:0;bottom:9px;padding:0 40px;color:#fff;text-shadow:0 1px 3px rgba(0,20,40,.35),0 0 14px rgba(0,20,40,.2)}
.dpw.below .dp-nm{margin-top:6px;padding:0 12px;color:var(--text)}
.dpw.below .dp-nm i{color:var(--accent)}
.dpills.c2 .dp{height:88px}
.solos{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 22px}
.dpw.solo{width:auto;max-width:132px}
.sp{display:block;width:112px;height:112px;margin:0 auto;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 45%,var(--card)),color-mix(in srgb,var(--accent) 18%,var(--card)));
  box-shadow:0 0 0 3px var(--card),0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent),0 8px 22px -10px rgba(20,50,80,.35);
  transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s}
.dpw.solo:hover .sp{transform:translateY(-3px) scale(1.03)}
.dpw.solo:active .sp{transform:scale(.96)}
.sp img{width:100%;height:100%;object-fit:cover}
.sp .ini{display:grid;place-items:center;height:100%;font-size:38px;color:#fff;text-shadow:0 1px 4px rgba(0,20,40,.2)}
.dpw.solo .dp-nm{margin-top:9px;padding:0 4px;color:var(--text);font-size:15px}
.dpills.nf-script .dpw.solo .dp-nm{font-size:22px}
.dpills.c2 .sp{width:88px;height:88px}
.dpills.c2 .sp .ini{font-size:30px}
.dpills.c2 .dpw.solo{max-width:108px}
.dpills.c2 .dpw.solo .dp-nm{font-size:13.5px}
.cols.solo{grid-template-columns:minmax(0,340px);justify-content:center}
.dpills.c2 .dp-nm{font-size:21px}
.dpills.c2 .dp .dp-nm{bottom:6px;padding:0 24px}
.nf-body .dp-nm{font-family:inherit;font-weight:600;font-size:17px}
.nf-serif .dp-nm{font-family:'Gowun Batang',serif;font-weight:700;font-size:17px}
.dpills.c2.nf-body .dp-nm,.dpills.c2.nf-serif .dp-nm{font-size:14.5px}
.nf-body .dp .dp-nm,.nf-serif .dp .dp-nm{bottom:12px}
.nf-body .dp-nm i,.nf-serif .dp-nm i{font-size:.85em;vertical-align:0;margin:0 .4em}
.d-title.nf-body{font-family:inherit;font-weight:600;font-size:21px}
.d-title.nf-serif{font-family:'Gowun Batang',serif;font-weight:700;font-size:21px}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(15,30,45,.3);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.sheet.on{opacity:1;visibility:visible;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-card{position:relative;width:min(100%,600px);max-height:100%;overflow:auto;background:var(--card);border-radius:26px;padding:20px 16px 16px;
  box-shadow:0 24px 60px rgba(0,0,0,.25);transform:translateY(18px) scale(.98);transition:transform .35s cubic-bezier(.2,.9,.3,1.15)}
.sheet.on .sheet-card{transform:none}
.x-btn{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:color-mix(in srgb,var(--text) 8%,transparent);font-size:15px;line-height:1}
.d-title{font:500 30px/1.2 var(--script);margin:0 40px 14px;text-align:center}
.d-title .px{font:400 14px var(--sys);color:var(--accent);margin:0 10px;vertical-align:.4em}
.meta.mwith{opacity:.75}

/* 서브 페어 상세 — 디자인 템플릿 */
.ds-row .cols{grid-template-columns:1fr;gap:10px}
.ds-row .cb{flex-direction:row;align-items:flex-start;gap:14px;padding:14px}
.ds-row .cb-pic{width:88px;flex-shrink:0;margin:0;align-self:flex-start;border-radius:50%;aspect-ratio:1}
.ds-row .cb-t{flex:1;min-width:0}

.ds-poster .cols{gap:12px}
.ds-poster .cb{position:relative;padding:0;border-radius:20px;overflow:hidden;min-height:250px;justify-content:flex-end;
  background:color-mix(in srgb,var(--accent) 45%,#2b3441);box-shadow:0 12px 30px -16px rgba(20,50,80,.6)}
.ds-poster .cb-pic{position:absolute;inset:0;width:100%;height:100%;margin:0;align-self:auto;border-radius:0;aspect-ratio:auto;background:none}
.ds-poster .cb-pic img{width:100%;height:100%;object-fit:cover}
.ds-poster .cb-t{position:relative;z-index:1;padding:64px 14px 14px;background:linear-gradient(transparent,rgba(8,18,32,.86) 46%)}
.ds-poster .cb h3,.ds-poster .cb .cd,.ds-poster .cb .meta{color:#fff}
.ds-poster .cb .lbl{color:#fff;opacity:.78}
.ds-poster .cb .meta-lnk{color:#fff;text-decoration:underline}
.ds-poster .copy-name{text-decoration-color:rgba(255,255,255,.6)}
.ds-poster .cols.solo{grid-template-columns:minmax(0,320px)}

.ds-frame .cols{gap:14px}
.ds-frame .cb{background:#fff;border-radius:3px;padding:10px 10px 16px;box-shadow:0 12px 28px -14px rgba(20,50,80,.55),0 0 0 1px rgba(0,0,0,.04);transform:rotate(-1.3deg)}
.ds-frame .cb:nth-child(2){transform:rotate(1.3deg)}
.ds-frame .cb-pic{width:100%;margin-bottom:10px;border-radius:2px;aspect-ratio:1}
.ds-frame .cb-t{align-items:center;text-align:center}
.ds-frame .cb h3{font:500 26px/1.2 var(--script);margin:2px 0}
.ds-frame .cb .cd{text-align:left}
@media (max-width:600px){.ds-frame .cb,.ds-frame .cb:nth-child(2){transform:none}}

/* 비밀번호 잠금 */
.gate{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:26px;
  background:var(--card);animation:fade .45s}
.gate-box{width:min(100%,286px);text-align:center;display:block}
.g-ico{width:40px;height:40px;margin:0 auto 15px;border-radius:50%;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 11%,transparent);color:var(--accent)}
.g-ico svg{width:19px;height:19px;display:block}
.gate-box h2{margin:0;font-size:15px;font-weight:600;line-height:1.55;letter-spacing:-.01em}
.g-hint{margin:6px 0 0;font-size:12.5px;line-height:1.65;opacity:.5;white-space:pre-line}
#gateIn{display:block;width:100%;margin:20px 0 0;font:inherit;font-size:16px;text-align:center;padding:12px 14px;
  border-radius:13px;border:1px solid color-mix(in srgb,var(--text) 13%,transparent);
  background:color-mix(in srgb,var(--text) 3%,var(--card));color:inherit;
  transition:border-color .2s,box-shadow .2s,background .2s}
#gateIn::placeholder{opacity:.3}
#gateIn:focus{outline:none;background:var(--card);border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.g-go{display:block;width:100%;margin:8px 0 0;border:0;border-radius:13px;padding:12px;cursor:pointer;
  background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:600;letter-spacing:.01em;
  transition:filter .2s,transform .08s}
.g-go:hover{filter:brightness(1.06)}
.g-go:active{transform:translateY(1px)}
.g-err{margin:11px 0 0;font-size:12.5px;line-height:1.4;color:#d9534a;min-height:1.1em}
.gate.shake .gate-box{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (max-width:600px){
  .sheet{align-items:flex-end;padding:0}
  .sheet-card{border-radius:24px 24px 0 0;max-height:90%;padding:18px 12px 14px;transform:translateY(100%)}
  .cols{gap:8px}.cb{padding:10px}.cb h3{font-size:16px}
}

/* ---------- 트친 소개 ---------- */
.friends{display:grid;gap:8px}
.friends.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fr{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:16px;text-decoration:none;color:inherit;
  background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 14%,transparent);
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}
a.fr:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--accent) 15%,var(--card));
  border-color:color-mix(in srgb,var(--accent) 32%,transparent);box-shadow:0 8px 20px -12px rgba(20,50,80,.5)}
a.fr:active{transform:none}
.fr-av{width:38px;height:38px;flex-shrink:0;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.fr-av img{width:100%;height:100%;object-fit:cover}
.fr-av.em{font-size:19px;line-height:1}
.fr-av.ini{font-size:16px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--card))}
.fr-b{flex:1;min-width:0}
.fr-n{display:block;font-size:14.5px;font-weight:600;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .ds{display:block;margin-top:1px;font-size:13px;line-height:1.55;opacity:.62}
.fr-go{flex-shrink:0;font-size:13px;color:var(--accent);opacity:.45;transition:opacity .18s,transform .18s}
a.fr:hover .fr-go{opacity:1;transform:translate(1px,-1px)}
@media (max-width:600px){.friends.c2{grid-template-columns:1fr}}

/* ---------- 서브 페어 목록 나누기 ---------- */
.sgrp+.sgrp{margin-top:32px}
.sgrp-t{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px;color:var(--accent);letter-spacing:.04em}
.sgrp-t::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--accent) 25%,transparent)}
.gchips{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;row-gap:4px;margin:0 0 22px}
.gchip{position:relative;border:0;background:none;padding:4px 16px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;
  color:color-mix(in srgb,var(--text) 34%,transparent);transition:color .2s}
.gchip+.gchip::before{content:"";position:absolute;left:0;top:50%;width:1px;height:12px;margin-top:-6px;background:color-mix(in srgb,var(--text) 18%,transparent)}
.gchip:hover{color:color-mix(in srgb,var(--text) 62%,transparent)}
.gchip.on,.gchip.on:hover{color:var(--accent)}
.sgrps.filtered .sgrp-t{display:none}
.sgrp-intro{margin:-6px 0 16px;font-size:14px;opacity:.65}
.sgrps.filtered .sgrp-intro{margin:0 0 20px;text-align:center}
.sgrps.filtered .sgrp{margin-top:0}

/* ---------- 템플릿 탭 ---------- */
.tblock{padding:18px 20px;border-radius:18px;background:color-mix(in srgb,var(--accent) 8%,var(--card));margin-bottom:12px}
.tblock h3{margin:0 0 6px;font-size:17px;color:var(--accent);line-height:1.4}
.tb-body{font-size:15px}
.qa{border-bottom:1px dashed color-mix(in srgb,var(--text) 16%,transparent)}
.qa summary,.qa-q{display:flex;gap:10px;align-items:flex-start;padding:13px 2px;font-size:15.5px;font-weight:600}
.qa summary{list-style:none;cursor:pointer}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"";margin:8px 4px 0 auto;flex-shrink:0;width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);transition:transform .25s}
.qa[open] summary::after{transform:rotate(225deg)}
.qq{flex:1;min-width:0}
.qm,.am{flex-shrink:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--sys);margin-top:1px}
.qm{background:var(--accent);color:#fff}
.am{background:color-mix(in srgb,var(--accent) 16%,var(--card));color:var(--accent)}
.qa-a{display:flex;gap:10px;padding:0 2px 15px;font-size:15px}
details.qa[open] .qa-a{animation:fade .3s}
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.rule-col{border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--rc) 9%,var(--card));border:1px solid color-mix(in srgb,var(--rc) 24%,transparent)}
.r-ok{--rc:#3aa876}.r-no{--rc:#e0566b}.r-ask{--rc:#e3a33a}
.rule-col h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;color:color-mix(in srgb,var(--rc) 80%,var(--text))}
.rm{width:22px;height:22px;border-radius:50%;background:var(--rc);color:#fff;display:grid;place-items:center;font:700 12px var(--sys)}
.rule-col ul{margin:0;padding-left:18px;font-size:14.5px}
.rule-col li+li{margin-top:4px}
.pgal{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.pgal.c1{grid-template-columns:1fr}
.pgal.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pgal-it{position:relative;display:block;padding:0;border:0;border-radius:14px;overflow:hidden;cursor:zoom-in;aspect-ratio:1;background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.pgal.c1 .pgal-it{aspect-ratio:auto}
.pgal-it img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.pgal.c1 .pgal-it img{height:auto}
.pgal-it:hover img{transform:scale(1.04)}
.pgal-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:12.5px;text-align:left}
.lb img{width:100%;border-radius:14px}
.lb p{text-align:center;margin:12px 0 2px}
.plinks{display:grid;gap:10px}
.lk-btn{display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:999px;text-decoration:none;color:var(--text);font-size:15.5px;
  background:color-mix(in srgb,var(--accent) 10%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);transition:transform .2s,background .2s}
a.lk-btn:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--accent) 18%,var(--card))}
.lk-em{font-size:20px;line-height:1}.lk-t{flex:1}.lk-ar{color:var(--accent);font:600 14px var(--sys)}
</style></head>
<body class="${bodyCls}">

${coverHTML(c)}

<div class="win">
  <div class="chrome">
    <div class="bar">
      <div class="lights"><i></i><i></i><i></i></div>
      ${musicOn
        ? `<div class="glass grp"><button type="button" class="ib mus-btn ${isHex(mu.btnBg) ? 'has-bg' : ''}" id="musBtn" aria-label="음악" title="음악"
            style="${isHex(mu.btnBg) ? `background:${mu.btnBg};` : ''}${isHex(mu.btnColor) ? `color:${mu.btnColor};` : ''}">${esc(String(mu.btnIcon ?? '🎵') || '🎵')}</button></div>`
        : `<div class="glass grp hide-m"><span class="ib">${ico.side}</span></div>`}
      <div class="glass grp hide-m"><span class="ib">${ico.back}</span><span class="ib dim">${ico.fwd}</span></div>
      <div class="glass addr"><span class="lk">${ico.lock}</span><span class="u" id="addr"></span><span class="rl">${ico.reload}</span></div>
      <div class="glass grp hide-m"><span class="ib">${ico.share}</span><span class="ib">${ico.plus}</span><span class="ib">${ico.tabs}</span></div>
    </div>
    <div class="glass tabs">
      <span class="ind" id="ind"></span>
      ${d.tabs.map((tb, i) => `<button type="button" class="tab" data-tab="${i}">${tb.icon ? `<span class="fav">${esc(tb.icon)}</span>` : ''}<span class="ttl">${esc(tb.name)}</span></button>`).join('')}
    </div>
    ${musicOn ? `<div class="mus-pop" id="musPop" hidden>
      <p class="mus-t" id="musT">음악</p>
      <div class="mus-row">
        <button type="button" class="mus-k" id="musPrev" aria-label="이전 곡">⏮</button>
        <button type="button" class="mus-k big" id="musPlay" aria-label="재생">▶</button>
        <button type="button" class="mus-k" id="musNext" aria-label="다음 곡">⏭</button>
        <span class="mus-sp"></span>
        <button type="button" class="mus-k wide" id="musShow">영상</button>
        <a class="mus-k" id="musLink" href="https://www.youtube.com" target="_blank" rel="noopener" title="유튜브에서 열기">↗</a>
      </div>
    </div>` : ''}
  </div>

  <div class="content" id="content"><div class="inner">
    ${d.tabs.map((tb, i) => `<section data-tab="${i}">${tabHTML(tb, d)}</section>`).join('')}
  </div></div>
  ${locked ? `<div class="gate" id="gate">
    <form class="gate-box" id="gateForm" autocomplete="off">
      <div class="g-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4.75" y="10.25" width="14.5" height="9.5" rx="3"/><path d="M8.5 10.25V7.75a3.5 3.5 0 017 0v2.5"/><path d="M12 14.25v1.75"/></svg></div>
      ${lk.title ? `<h2>${esc(lk.title)}</h2>` : ''}
      ${lk.hint ? `<p class="g-hint">${esc(lk.hint)}</p>` : ''}
      <input type="password" id="gateIn" inputmode="text" autocomplete="off" aria-label="비밀번호">
      <button type="submit" class="g-go">들어가기</button>
      <p class="g-err" id="gateErr"></p>
    </form>
  </div>` : ''}
</div>

${musicOn ? '<div class="yt-wrap" id="ytWrap"><div id="ytFrame"></div></div>' : ''}
<div class="sheet" id="sheet"><div class="sheet-card" id="sheetCard"><button type="button" class="x-btn" id="xBtn" aria-label="닫기">✕</button><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var tab = ${Number(init.tab) || 0};
  var address = ${safeJSON(d.address || '')};
  var names = ${safeJSON(d.tabs.map(x => x.name))};
  var body = document.body, root = document.documentElement;
  var $ = function(id){ return document.getElementById(id); };
  var notify = function(m){ try{ parent !== window && parent.postMessage(Object.assign({__intro:1}, m), '*'); }catch(e){} };

  /* 탭 — 선택 표시(흰 알약)를 실제 탭 위치·너비에 맞춤 */
  function placeInd(i){
    var t = document.querySelector('.tab[data-tab="' + i + '"]'), bar = t && t.parentNode; if (!t) return;
    $('ind').style.width = t.offsetWidth + 'px';
    $('ind').style.transform = 'translateX(' + t.offsetLeft + 'px)';
    if (t.offsetLeft < bar.scrollLeft) bar.scrollLeft = t.offsetLeft - 6;
    else if (t.offsetLeft + t.offsetWidth > bar.scrollLeft + bar.clientWidth) bar.scrollLeft = t.offsetLeft + t.offsetWidth - bar.clientWidth + 6;
  }
  window.addEventListener('resize', function(){ placeInd(tab); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ placeInd(tab); });
  function show(i){
    tab = i;
    document.querySelectorAll('.tab').forEach(function(a){ a.classList.toggle('on', +a.dataset.tab === i); });
    document.querySelectorAll('section').forEach(function(s){ s.classList.toggle('on', +s.dataset.tab === i); });
    placeInd(i);
    $('addr').textContent = address + (address ? '/' : '') + (names[i] || '');
    $('content').scrollTop = 0;
    closeSheet();
    notify({ tab: i });
  }
  document.querySelectorAll('.tab').forEach(function(a){ a.addEventListener('click', function(){ body.classList.remove('no-anim'); show(+a.dataset.tab); }); });

  /* 배경 음악 (유튜브) — 표지를 누르는 순간 재생 시작 */
  var MUS = ${musicOn ? safeJSON({ vol: Math.max(0, Math.min(100, Number(mu.volume) || 0)), list: muList, auto: !init.mute }) : 'null'};
  var musPlay1 = function(){}, musItem = function(){}, musBack = function(){};
  if (MUS) (function(){
    var yt = null, ready = false, idx = 0, itemId = '', curId = '', playing = false, want = false;
    var btn = $('musBtn'), pop = $('musPop'), wrap = $('ytWrap');
    var elT = $('musT'), elPlay = $('musPlay'), elLink = $('musLink'), elShow = $('musShow');
    var bgmId = function(){ return MUS.list.length ? MUS.list[idx % MUS.list.length].i : ''; };
    var bgmTitle = function(){ return MUS.list.length ? MUS.list[idx % MUS.list.length].t : ''; };
    var wantId = function(){ return itemId || bgmId(); };

    function sync(){
      var id = curId || wantId();
      var t = itemId ? '' : bgmTitle();
      if (!t) { try { t = yt && yt.getVideoData ? (yt.getVideoData().title || '') : ''; } catch (e) {} }
      elT.textContent = t || (id ? (ready ? '재생 중' : '불러오는 중…') : '노래가 없어요');
      elPlay.textContent = playing ? '❚❚' : '▶';
      elLink.href = id ? 'https://www.youtube.com/watch?v=' + id : 'https://www.youtube.com';
      btn.classList.toggle('on', playing);
      var many = MUS.list.length > 1;
      $('musPrev').disabled = $('musNext').disabled = !many;
      $('musPrev').style.opacity = $('musNext').style.opacity = many ? '' : '.3';
    }
    function apply(){
      var id = wantId();
      if (!ready || !id) { sync(); return; }
      if (id !== curId) {
        curId = id;
        playing ? yt.loadVideoById(id) : yt.cueVideoById(id);
        setTimeout(sync, 900);
      } else if (playing) yt.playVideo();
      sync();
    }
    function setPlay(on){
      playing = on;
      if (!ready) { want = on; sync(); return; }
      if (on) { if (curId !== wantId()) apply(); else yt.playVideo(); }
      else yt.pauseVideo();
      sync();
    }
    function step(d){ if (!MUS.list.length) return; idx = (idx + d + MUS.list.length) % MUS.list.length; itemId = ''; apply(); }

    musPlay1 = function(){ if (!want && !playing) { want = true; setPlay(true); } };
    musItem = function(id){ if (!id || itemId === id) return; itemId = id; apply(); if (playing) setPlay(true); };
    musBack = function(){ if (!itemId) return; itemId = ''; apply(); };

    btn.addEventListener('click', function(){ pop.hidden = !pop.hidden; });
    document.addEventListener('click', function(e){
      if (!pop.hidden && !pop.contains(e.target) && e.target !== btn) pop.hidden = true;
    });
    elPlay.addEventListener('click', function(){ setPlay(!playing); });
    $('musPrev').addEventListener('click', function(){ step(-1); });
    $('musNext').addEventListener('click', function(){ step(1); });
    elShow.addEventListener('click', function(){
      var on = wrap.classList.toggle('on');
      elShow.classList.toggle('on', on);
      elShow.textContent = on ? '숨김' : '영상';
    });

    window.__musVol = function(v){ MUS.vol = v; if (ready) try { yt.setVolume(v); } catch (e) {} };

    window.onYouTubeIframeAPIReady = function(){
      yt = new YT.Player('ytFrame', {
        width: '196', height: '110',
        playerVars: { autoplay: 0, controls: 1, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3 },
        events: {
          onReady: function(){
            ready = true;
            try { yt.setVolume(MUS.vol); } catch (e) {}
            if (want) { playing = true; }
            apply();
          },
          onStateChange: function(e){
            if (e.data === YT.PlayerState.ENDED) { itemId ? (itemId = '', apply()) : step(1); return; }
            if (e.data === YT.PlayerState.PLAYING) playing = true;
            if (e.data === YT.PlayerState.PAUSED) playing = false;
            sync();
          },
        },
      });
    };
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    sync();
  })();

  /* 비밀번호 — 맞는 비밀번호에 묶인 탭만 남기고 나머지는 지움 */
  var gate = $('gate');
  if (gate) {
    var codes = ${safeJSON(lkCodes)};
    var wrongMsg = ${safeJSON(lk.wrong || '비밀번호가 맞지 않아요')};
    var fnv = function(str){ var h = 0x811c9dc5; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); };
    var unlock = function(allow){
      document.querySelectorAll('.tab').forEach(function(a){ if (allow.indexOf(+a.dataset.tab) < 0) a.remove(); });
      document.querySelectorAll('section').forEach(function(sec){ if (allow.indexOf(+sec.dataset.tab) < 0) sec.remove(); });
      gate.remove(); gate = null;
      body.classList.remove('locked');
      show(allow[0]);
    };
    $('gateForm').addEventListener('submit', function(e){
      e.preventDefault();
      var h = fnv($('gateIn').value.trim()), hit = null;
      for (var i = 0; i < codes.length; i++) if (codes[i].h === h) { hit = codes[i]; break; }
      if (!hit) {
        $('gateErr').textContent = wrongMsg;
        gate.classList.add('shake');
        setTimeout(function(){ gate && gate.classList.remove('shake'); }, 420);
        $('gateIn').select();
        return;
      }
      unlock(hit.t);
    });
    setTimeout(function(){ var g = $('gateIn'); g && g.focus(); }, 400);
  }

  /* 표지 — 누르면 애니메이션 후 열림 */
  var busy = false;
  function enter(){
    if (busy) return; busy = true;
    if (MUS && MUS.auto) musPlay1();
    body.classList.remove('no-anim');
    body.classList.add('popping');
    setTimeout(function(){
      body.classList.add('opened'); busy = false; notify({ opened: true });
      // 사라지는 전환(0.8초)이 끝나면 표지를 아예 빼서 메모리를 돌려줌
      setTimeout(function(){ if (body.classList.contains('opened')) body.classList.add('gone'); }, 900);
    }, ${enterDelay});
  }
  document.querySelectorAll('.enter').forEach(function(el){
    el.addEventListener('click', enter);
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enter(); } });
  });

  /* 드림코어 — 마우스/시간에 따라 공간이 살짝 기울어짐 */
  var cam = $('cam');
  if (cam) {
    var tx = 0, ty = 0, cx = 0, cy = 0, moved = false;
    window.addEventListener('pointermove', function(e){ moved = true; tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; });
    (function loop(t){
      if (!body.classList.contains('opened')) {
        var sx = moved ? tx : Math.sin(t / 3200) * .35, sy = moved ? ty : Math.cos(t / 4100) * .2;
        cx += (sx - cx) * .05; cy += (sy - cy) * .05;
        cam.style.transform = 'rotateY(' + (cx * 12).toFixed(2) + 'deg) rotateX(' + (-cy * 5).toFixed(2) + 'deg)';
      }
      requestAnimationFrame(loop);
    })(0);
  }

  /* 메인 페어 카드 뒤집기 */
  var flips = [].slice.call(document.querySelectorAll('.flip'));
  function flipState(){ return flips.map(function(f, i){ return f.classList.contains('on') ? i : -1; }).filter(function(i){ return i >= 0; }); }
  function setFlip(el, on){
    body.classList.remove('no-anim'); el.classList.toggle('on', on);
    var sec = el.closest('section'), hint = sec && sec.querySelector('.flip-hint');
    if (on && hint) hint.classList.add('seen');
    if (on) { if (el.dataset.mus) musItem(el.dataset.mus); } else if (el.dataset.mus) musBack();
    notify({ flips: flipState() });
  }
  ${safeJSON(init.flips || [])}.forEach(function(i){ if (flips[i]) flips[i].classList.add('on'); });
  flips.forEach(function(el){
    el.addEventListener('click', function(e){ if (e.target.closest('.copyable, a')) return; setFlip(el, !el.classList.contains('on')); });
    el.addEventListener('keydown', function(e){ if (e.target === el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); setFlip(el, !el.classList.contains('on')); } });
  });

  /* 서브 페어 세부 내용 */
  function openSheet(btn){
    var tpl = $('pd-' + btn.dataset.pd); if (!tpl) return;
    var box = $('sheetBody'), card = $('sheetCard');
    box.innerHTML = '';
    box.appendChild(tpl.content.cloneNode(true));
    box.querySelectorAll('img[data-from]').forEach(function(img){
      var p = img.dataset.from.split('-');
      var src = btn.querySelector('.' + p[1] + ' img');
      if (src) img.src = src.src;
    });
    if (btn.dataset.accent) card.style.setProperty('--accent', btn.dataset.accent); else card.style.removeProperty('--accent');
    if (btn.dataset.mus) musItem(btn.dataset.mus);
    $('sheet').classList.add('on');
  }
  function closeSheet(){ if ($('sheet').classList.contains('on')) musBack(); $('sheet').classList.remove('on'); }
  document.querySelectorAll('.dpw').forEach(function(b){ b.addEventListener('click', function(){ openSheet(b); }); });

  /* 서브 페어 목록 칩 */
  document.querySelectorAll('.gchips').forEach(function(bar){
    var wrap = bar.nextElementSibling;
    bar.addEventListener('click', function(e){
      var c = e.target.closest('.gchip'); if (!c) return;
      bar.querySelectorAll('.gchip').forEach(function(x){ x.classList.toggle('on', x === c); });
      var g = c.dataset.g;
      wrap.classList.toggle('filtered', g !== '*');
      var hasAll = !!bar.querySelector('[data-g="*"]');
      wrap.querySelectorAll('.sgrp').forEach(function(s){ s.hidden = g !== '*' && s.dataset.g !== g && (hasAll || s.dataset.g !== ''); });
    });
  });

  /* 갤러리 크게 보기 */
  document.querySelectorAll('.pgal-it').forEach(function(b){
    b.addEventListener('click', function(){
      var img = b.querySelector('img'); if (!img) return;
      var box = $('sheetBody'), card = $('sheetCard');
      box.innerHTML = '<div class="lb"><img alt=""></div>';
      box.querySelector('img').src = img.src;
      if (b.dataset.cap) { var cap = document.createElement('p'); cap.textContent = b.dataset.cap; box.firstChild.appendChild(cap); }
      var pg = b.closest('.pg'), acc = pg && pg.style.getPropertyValue('--accent');
      if (acc) card.style.setProperty('--accent', acc); else card.style.removeProperty('--accent');
      $('sheet').classList.add('on');
    });
  });
  $('xBtn').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', function(e){ if (e.target === this) closeSheet(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

  /* 프롬프트 복사 */
  var toastT;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 1600); }
  function copy(text, btn){
    var done = function(){
      toast('프롬프트를 복사했어요'); btn.classList.add('copied'); btn.dataset.tip = '복사됨 ✓';
      setTimeout(function(){ btn.classList.remove('copied'); btn.dataset.tip = '눌러서 프롬프트 복사'; }, 1800);
    };
    var fallback = function(){
      var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? done() : toast('복사하지 못했어요'); } catch (e) { toast('복사하지 못했어요'); }
      ta.remove();
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }
  document.addEventListener('click', function(e){
    var p = e.target.closest('.copyable[data-prompt]');
    if (p) copy(p.dataset.prompt, p);
  });
  document.addEventListener('keydown', function(e){
    var p = e.target.closest && e.target.closest('.copyable[data-prompt]');
    if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); copy(p.dataset.prompt, p); }
  }, true);

  /* 편집기 → 미리보기 */
  window.addEventListener('message', function(e){
    var m = e.data || {};
    if (m.__cmd === 'cover') { body.classList.add('no-anim'); body.classList.remove('opened', 'popping', 'gone'); busy = false; }
    if (m.__cmd === 'peek') { body.classList.add('no-anim'); body.classList.remove('opened', 'gone'); body.classList.toggle('popping', !!m.on); busy = false; }
    if (m.__cmd === 'tab') { body.classList.remove('no-anim'); body.classList.add('opened', 'gone'); show(m.tab); }
    if (m.__cmd === 'flip' && flips[m.i]) setFlip(flips[m.i], !!m.on);
    if (m.__cmd === 'pic' && flips[m.i]) flips[m.i].querySelector('.back').style.setProperty('--pic', m.v);
    if (m.__cmd === 'musvol' && window.__musVol) window.__musVol(m.v);
    if (m.__cmd === 'vars') for (var k in m.vars) root.style.setProperty(k, m.vars[k]);
  });
  show(tab);
})();
<\/script>
</body></html>`;
}

/* =========================================================
   편집기 UI
   ========================================================= */

function extractPalette(src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const S = 48, c = document.createElement('canvas'); c.width = S; c.height = S;
      const x = c.getContext('2d'); x.drawImage(im, 0, 0, S, S);
      const d = x.getImageData(0, 0, S, S).data, px = [];
      for (let k = 0; k < d.length; k += 4) if (d[k + 3] > 200) px.push([d[k], d[k + 1], d[k + 2]]);
      if (px.length < 5) return res(null);
      const lum = p => p[0] * .299 + p[1] * .587 + p[2] * .114;
      px.sort((a, b) => lum(a) - lum(b));
      let ct = [0, 1, 2, 3, 4].map(k => px[Math.floor((k + .5) / 5 * px.length)].slice());
      for (let it = 0; it < 12; it++) {
        const sum = ct.map(() => [0, 0, 0, 0]);
        px.forEach(p => {
          let bi = 0, bd = Infinity;
          ct.forEach((q, k) => { const dd = (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 + (p[2] - q[2]) ** 2; if (dd < bd) { bd = dd; bi = k; } });
          const t = sum[bi]; t[0] += p[0]; t[1] += p[1]; t[2] += p[2]; t[3]++;
        });
        ct = ct.map((q, k) => sum[k][3] ? sum[k].slice(0, 3).map(v => v / sum[k][3]) : q);
      }
      res(ct.sort((a, b) => lum(a) - lum(b)).map(q => '#' + q.map(v => Math.round(v).toString(16).padStart(2, '0')).join('')));
    };
    im.onerror = () => res(null);
    im.src = src;
  });
}

function itemTitle(listPath, it) {
  if (it.a && it.b) {
    if (it.kind === 'solo') return `● ${it.a.name || '이름'} · 단독`;
    return it.title || `${it.a.name || '캐릭터'} × ${it.b.name || '유저'}`;

function itemCard(listPath, i, len, title, bodyHTML, isOpen, accent, nav) {
  const key = `${listPath}.${i}`;
  const up = nav ? nav.prev : (i === 0 ? -1 : i - 1);
  const dn = nav ? nav.next : (i === len - 1 ? -1 : i + 1);
  return `<details class="item" data-sec="${key}" ${isOpen(key) || forceOpen.has(key) ? 'open' : ''}>
    <summary><span class="dot" style="background:${isHex(accent) ? accent : state.theme.accent}"></span><span class="ttl">${title}</span>
      <button type="button" class="ghost" data-move="${listPath}" data-i="${i}" data-j="${up}" ${up < 0 ? 'disabled' : ''}>↑</button>
      <button type="button" class="ghost" data-move="${listPath}" data-i="${i}" data-j="${dn}" ${dn < 0 ? 'disabled' : ''}>↓</button>
      <button type="button" class="ghost danger" data-del="${listPath}" data-i="${i}">삭제</button>
    </summary>
    <div class="item-body">${bodyHTML}</div>
  </details>`;
}

// AI에게 표지 HTML을 만들어 달라고 할 때 쓰는 지시문 — 기술 조건은 고정, [디자인]만 사용자가 채움
function coverPromptText(c) {
  const wish = String(c.cPrompt || '').trim();
  return `아래 조건에 맞는 "웹페이지 표지(인트로 화면)" 한 장을 HTML로 만들어 주세요.
설명 없이 코드 블록 하나로만 주세요.

[출력 형식]
- <html>, <head>, <body> 태그는 쓰지 말고, 표지 내용만 주세요.
- CSS는 <style> 태그로, 움직임이 필요하면 <script> 태그로 같은 코드 안에 함께 넣어주세요.
- 외부 파일(웹폰트·이미지·라이브러리)은 불러오지 마세요. 그림이 필요하면 CSS 그라데이션·도형,
  이모지, 인라인 SVG 로 표현해 주세요.

[꼭 지켜야 할 것]
1. 어느 요소든 한 곳에 class="enter" 를 넣어주세요. 방문자가 그것을 누르면 페이지가 열립니다.
   예: <button class="my-btn enter">들어가기</button>
2. 이 코드는 이미 완성된 페이지 안에 그대로 끼워 넣어집니다. 스타일이 섞이지 않도록
   모든 class 이름 앞에 my- 를 붙여주세요. (my-wrap, my-title …)
   cover, hint, kicker, tag, tabs, win, cb, card, sub, desc, media, inner, enter
   같은 이름은 이미 쓰고 있으니 단독으로 쓰지 마세요.
   (enter 는 1번처럼 다른 class 와 같이 붙이는 것만 괜찮습니다.)
3. 표지가 놓이는 칸은 화면 전체(가로·세로 100%)이고 내용은 기본으로 가운데 정렬됩니다.
   화면 전체를 덮고 싶으면 position:absolute; inset:0 을 쓰세요.
4. html, body 에는 스타일을 주지 마세요. 표지 안쪽만 꾸며주세요.
5. 휴대폰 화면(가로 390px)에서도 깨지지 않아야 하고, 가로 스크롤이 생기면 안 됩니다.

[알아두면 좋은 것]
- 방문자가 누르면 body 에 popping → opened class 가 차례로 붙습니다.
  들어갈 때 연출을 넣고 싶으면 body.popping .my-무엇 { … } 처럼 쓰면 됩니다.
- 표지 전체는 0.8초에 걸쳐 저절로 사라지니, 사라지는 처리는 따로 하지 않아도 됩니다.

[디자인]
${wish || '(원하는 분위기·색·소재를 여기에 적어주세요. 예: 늦은 밤 창밖으로 눈이 내리는, 남색과 은색 위주의 조용한 느낌)'}`;
}

        <div class="row">${imgField(`${p}.backImg`, '뒷면 배경 이미지 (선택)')}${m.backImg ? range(`${p}.backFade`, '배경색으로 덮기 (0% = 이미지 그대로)', 0, 100, '%') : ''}</div>

// 서브 페어 탭 안의 '세부 탭' — 현재 고른 세부 탭 ('*' 전체 / '' 공통 / 세부 탭 id)
function curSub(B, O) {
  const groups = O.groups || [];
  const sub = view.sub || (view.sub = {});
  let cur = sub[B] ?? '*';
  if (!groups.length) cur = '*';
  else if (cur !== '*' && cur !== '' && !groups.some(g => g.id === cur)) cur = '*';
  sub[B] = cur;
  return cur;
}

function othersPanel(B, isOpen) {
  const L = state.labels, O = getPath(state, B), groups = O.groups || (O.groups = []);
  const gid = g => groups.some(x => x.id === g) ? g : '';
  const cur = curSub(B, O);
  const countOf = k => O.items.filter(p => gid(p.group) === k).length;
  const free = countOf('');

  // ── 세부 탭 고르는 줄
  const chip = (k, label, n) => `<button type="button" class="subtab ${cur === k ? 'on' : ''}" data-subtab="${esc(k)}" data-base="${B}">${esc(label)}${n === null ? '' : `<span class="n">${n}</span>`}</button>`;
  const chips = `<div class="subtabs">
    ${groups.length ? chip('*', '전체', O.items.length) : ''}
    ${groups.length ? chip('', '공통', free) : ''}
    ${groups.map(g => chip(g.id, g.title || '이름 없음', countOf(g.id))).join('')}
    <button type="button" class="subtab new" data-addgroup data-base="${B}">+ 세부 탭</button>
  </div>`;

  // ── 고른 세부 탭 설정 / 전체일 때의 표시 방식
  const gi = groups.findIndex(g => g.id === cur);
  let head = '';
  if (gi >= 0) {
    const g = groups[gi];
    head = `<div class="card">
      <p class="card-title">🗂 세부 탭 설정</p>
      <div class="grp-row">
        <input type="text" data-path="${B}.groups.${gi}.title" value="${esc(g.title || '')}" placeholder="세부 탭 이름">
        <button type="button" class="ghost" data-move="${B}.groups" data-i="${gi}" data-dir="-1" ${gi === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="ghost" data-move="${B}.groups" data-i="${gi}" data-dir="1" ${gi === groups.length - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="ghost danger" data-delgroup="${gi}" data-base="${B}">삭제</button>
      </div>
      <textarea rows="2" data-path="${B}.groups.${gi}.intro" placeholder="이 세부 탭 상단 문구 (선택)">${esc(g.intro || '')}</textarea>
      <p class="hint">아래에서 추가하는 항목은 이 세부 탭에 들어가요. 세부 탭을 지워도 안에 있던 항목은 '공통'으로 남아요.</p>
    </div>`;
  } else if (cur === '') {
    head = `<p class="hint">'공통' 항목은 어느 세부 탭을 골라도 항상 맨 위에 보여요.</p>`;
  } else if (groups.length) {
    head = `<div class="card">
      <p class="card-title">🐳 완성된 페이지에서 보여주는 방식</p>
      ${select(B + '.groupStyle', '세부 탭 표시', { title: '제목으로 구분해서 이어 보기', chips: '위쪽 작은 탭으로 골라 보기' })}
      ${O.groupStyle === 'chips' ? check(B + '.showAll', "맨 앞에 '전체' 탭 넣기") : ''}
      ${O.groupStyle === 'chips' && O.showAll === false ? '<p class="hint">전체 탭이 없으면 첫 번째 세부 탭이 먼저 보여요.</p>' : ''}
      <button type="button" class="add" data-autogroup data-base="${B}">✨ 페어 · 애호캐 · 유저캐로 자동 나누기</button>
    </div>`;
  } else {
    head = `<p class="hint">'+ 세부 탭'으로 항목을 나눠 담을 수 있어요. 완성된 페이지에서도 제목이나 작은 탭으로 나눠서 보여줘요.</p>`;
  }

  // ── 항목 하나 편집칸
  const itemBody = (p, i) => {
    const P = `${B}.items.${i}`, solo = p.kind === 'solo';
    return `
      ${groups.length ? select(`${P}.group`, '세부 탭', Object.fromEntries([['', '공통 (항상 맨 위)'], ...groups.map(g => [g.id, g.title || '이름 없는 세부 탭'])])) : ''}
      <div class="f">형태${picker(`${P}.kind`, PAIR_KINDS, 'two')}</div>
      ${solo ? select(`${P}.role`, '누구인가요', { a: `🤖 캐릭터 (${L.a})`, b: `🙋 유저 (${L.b})` }) : ''}
      ${accentField(`${P}.accent`)}
      ${state.music.on ? text(`${P}.track`, '이 항목의 노래 (유튜브 주소 · 선택)', '눌러서 상세 내용을 보면 이 노래로 바뀌어요') : ''}
      ${solo
        ? charEditor(`${P}.a`, p.role === 'b' ? `🙋 ${esc(L.b)}` : `🤖 ${esc(L.a)}`, { meta: p.role !== 'b', imgLabel: '사진' })
        : `${charEditor(`${P}.a`, `🤖 왼쪽 · ${esc(L.a)}`, { imgLabel: '사진' })}
           ${charEditor(`${P}.b`, `🙋 오른쪽 · ${esc(L.b)}`, { meta: false, imgLabel: '사진' })}`}
      ${moveBar(B, i)}`;
  };
  // 걸러낸 목록 안에서 위/아래 항목끼리만 자리를 바꾸도록 실제 번호를 넘겨줌
  const listOf = entries => entries.map(([p, i], n) => itemCard(B + '.items', i, O.items.length, esc(itemTitle(B + '.items', p)),
    itemBody(p, i), isOpen, p.accent, { prev: n > 0 ? entries[n - 1][1] : -1, next: n < entries.length - 1 ? entries[n + 1][1] : -1 })).join('');
  const entriesOf = k => O.items.map((p, i) => [p, i]).filter(([p]) => gid(p.group) === k);

  let list;
  if (cur === '*' && groups.length) {
    // 전체 보기 — 세부 탭별로 모아서
    const sec = (title, k) => {
      const e = entriesOf(k);
      return e.length ? `<p class="sec-head">${esc(title)}<span class="n">${e.length}</span></p>${listOf(e)}` : '';
    };
    list = sec('공통 · 항상 맨 위', '') + groups.map(g => sec(g.title || '이름 없는 세부 탭', g.id)).join('');
  } else {
    list = listOf(cur === '*' ? O.items.map((p, i) => [p, i]) : entriesOf(cur));
  }
  if (!list) list = '<p class="hint">이 세부 탭에는 아직 항목이 없어요. 아래에서 추가해 주세요.</p>';

  const grp = cur === '*' ? '' : cur;
  return `
    <details class="item" data-sec="${B}.__opts" ${isOpen(`${B}.__opts`) ? 'open' : ''}>
      <summary><span class="ttl">⚙️ 탭 전체 설정 · 모양</span></summary>
      <div class="item-body">
        <div class="row">${colsSelect(B + '.cols', '개')}${select(B + '.namePos', '이름 위치', { in: '알약 안 아래쪽', below: '알약 바로 밑' })}</div>
        <div class="row">${select(B + '.nameFont', '이름 글꼴', { body: '본문 글꼴', serif: '명조', script: '필기체' })}${check(B + '.showName', '알약에 이름 표시')}</div>
        ${check(B + '.showRole', `이름 위에 '${esc(L.a)} · ${esc(L.b)}' 이름표 표시`)}
        ${text(B + '.intro', '탭 상단 문구 (선택)')}
        <div class="f">눌렀을 때 보이는 상세 디자인${picker(B + '.detailStyle', DETAIL_STYLES)}</div>
        <p class="hint">필기체는 영문이 가장 예쁘게 나와요. 한글은 손글씨체로 보여요.</p>
      </div>
    </details>
    ${chips}
    ${head}
    ${list}
    <div class="row">

        </div>
        <p class="hint">이모지는 그림이라 색이 바뀌지 않아요. 색을 바꾸려면 ♪ 같은 글자 기호를 쓰세요.</p>

function lockPanel() {
  const K = state.lock, tabs = state.tabs;
  const codeCard = (cd, i, len) => `
    <div class="card">
      <div class="grp-row">
        <input type="text" data-path="lock.codes.${i}.code" value="${esc(cd.code)}" placeholder="비밀번호 (예: 0000)">
        <button type="button" class="ghost" data-move="lock.codes" data-i="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>↑</button>
        <button type="button" class="ghost" data-move="lock.codes" data-i="${i}" data-dir="1" ${i === len - 1 ? 'disabled' : ''}>↓</button>
        <button type="button" class="ghost danger" data-del="lock.codes" data-i="${i}">✕</button>
      </div>
      ${text(`lock.codes.${i}.label`, '메모 (선택 · 완성된 페이지에는 안 보여요)')}
      <div class="f">이 비밀번호로 볼 수 있는 탭
        <div class="subtabs">${tabs.map(tb => `
          <button type="button" class="subtab ${(cd.tabs || []).includes(tb.id) ? 'on' : ''}" data-ltoggle="${i}" data-tid="${esc(tb.id)}">${esc(tb.icon || '📄')} ${esc(tb.name || '탭')}</button>`).join('')}
        </div>
      </div>
      ${!(cd.tabs || []).length ? '<p class="hint">탭을 하나도 고르지 않으면 이 비밀번호는 없는 것으로 쳐요.</p>' : ''}
      ${!String(cd.code || '').length ? '<p class="hint">비밀번호를 비워두면 이 줄은 무시돼요.</p>' : ''}
    </div>`;

  return `
    <p class="note">표지를 연 다음 비밀번호 칸이 나오고, 맞는 비밀번호를 넣어야 내용이 보여요.
      비밀번호마다 <b>보여줄 탭</b>을 따로 정할 수 있어서, 계정이 여러 개라면 프로필 탭만 바꿔 끼우는 식으로 쓸 수 있어요.</p>
    ${check('lock.on', '비밀번호 잠금 사용')}
    ${!K.on ? '<p class="hint">꺼두면 표지를 열자마자 모든 탭이 보여요.</p>' : `
      <div class="row">${text('lock.title', '잠금 화면 제목')}${text('lock.wrong', '틀렸을 때 문구')}</div>
      ${area('lock.hint', '잠금 화면 안내 문구 (선택)', 2)}
      <p class="grp">비밀번호 ${K.codes.length}개</p>
      ${K.codes.map((cd, i, arr) => codeCard(cd, i, arr.length)).join('')}
      ${K.codes.length ? '' : '<p class="hint">비밀번호를 하나도 넣지 않으면 잠금이 동작하지 않아요.</p>'}
      <button type="button" class="add" data-addcode>+ 비밀번호 추가</button>
      <button type="button" id="btnLockTest" class="${view.lockTest ? 'on' : ''}">${view.lockTest ? '✓ 잠금 화면 보는 중 (누르면 풀고 편집)' : '🔒 미리보기에서 잠금 화면 확인하기'}</button>
      <p class="hint">편집 중에는 잠금을 풀어둔 상태로 보여줘요. 내보내거나 사이트에 올린 파일에는 항상 잠금이 들어가요.</p>
      <p class="note">⚠️ 비밀번호 자체는 알아보기 어렵게 바꿔서 넣지만, <b>가려진 탭의 내용은 파일 안에 그대로 들어있어요.</b>
        마음먹고 파일을 뜯어보면 볼 수 있으니, 정말 숨겨야 하는 내용에는 쓰지 마세요. 가볍게 나눠 보여주는 용도예요.</p>`}`;
}

function renderEdTabs() {
  $('#edTabs').innerHTML = edTabList().map(([k, ic, label]) =>
    `<button type="button" class="ed-tab ${view.edTab === k ? 'on' : ''}" data-edtab="${esc(k)}" title="${esc(label)}"><span class="ic">${esc(ic)}</span><span class="lb">${esc(label)}</span></button>`).join('');
  const on = $('#edTabs .ed-tab.on');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function tabsPanel() {
  const full = state.tabs.length >= MAX_TABS;
  const typeName = t => (BUILTIN_TABS[t.type] || PAGE_TEMPLATES[t.type] || {}).name || t.type;
  return `
    ${text('address', '주소창 문구')}
    <p class="grp">탭 목록 (${state.tabs.length}/${MAX_TABS})</p>
    ${state.tabs.map((tb, i, arr) => `
      <div class="tab-row">
        <input type="text" data-path="tabs.${i}.icon" value="${esc(tb.icon)}" title="아이콘 (이모지)">
        <input type="text" data-path="tabs.${i}.name" value="${esc(tb.name)}" placeholder="탭 이름">
        <span class="badge">${esc(typeName(tb))}</span>
        <div class="tr-btns">
          <button type="button" class="ghost" data-move="tabs" data-i="${i}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button type="button" class="ghost" data-move="tabs" data-i="${i}" data-dir="1" ${i === arr.length - 1 ? 'disabled' : ''}>↓</button>
          <button type="button" data-duptab="${i}" ${full ? 'disabled' : ''} title="내용까지 그대로 복제">⧉ 복제</button>
          <button type="button" class="ghost danger" data-deltab="${i}" ${arr.length <= 1 ? 'disabled' : ''}>삭제</button>
        </div>
      </div>`).join('')}
    <p class="grp">탭 추가 · 템플릿</p>
    <div class="tpls">
      ${[...Object.entries(BUILTIN_TABS), ...Object.entries(PAGE_TEMPLATES)].map(([k, t]) => {
        return `<button type="button" class="tpl" data-addtab="${k}" ${full ? 'disabled' : ''}>
          <span class="ic">${t.icon}</span><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></button>`;
      }).join('')}
    </div>
    <p class="hint">⧉ 복제를 누르면 내용까지 그대로 복사한 탭이 바로 뒤에 생겨요. 비밀번호를 쓰고 있다면 원본과 같은 비밀번호에 묶여요.</p>
    <p class="hint">같은 종류 탭도 여러 개 만들 수 있고, 탭마다 내용이 따로 저장돼요. 처음부터 있던 기본 탭은 삭제해도 내용이 남아서 다시 추가하면 돌아오고, 새로 추가한 탭은 삭제하면 내용도 지워져요 (↶ 되돌리기 가능).</p>`;
}

function pagePanel(tb, isOpen) {
  const P = `pages.${tb.id}`;
  const pg = state.pages[tb.id] || (state.pages[tb.id] = (PAGE_TEMPLATES[tb.type] || PAGE_TEMPLATES.text).make());
  const items = pg.items || (pg.items = []);
  const list = `${P}.items`;
  const add = label => `<button type="button" class="add" data-addto="${list}" data-tpl="${tb.type}">+ ${label}</button>`;
  let body = '';
  switch (tb.type) {
    case 'text':
      body = items.map((b, i, arr) => itemCard(list, i, arr.length, esc(b.title || '블록'), `
        ${text(`${list}.${i}.title`, '소제목 (선택)')}
        ${area(`${list}.${i}.body`, '내용', 5)}`, isOpen)).join('') + add('블록 추가');
      break;
    case 'qna':
      body = check(`${P}.fold`, '답변 접어두기 (질문을 누르면 펼쳐져요)')
        + items.map((x, i, arr) => itemCard(list, i, arr.length, esc(x.q || '질문'), `
        ${text(`${list}.${i}.q`, '질문')}
        ${area(`${list}.${i}.a`, '답변', 3)}`, isOpen)).join('') + add('질문 추가');
      break;
    case 'rules':
      body = `<div class="row3">${text(`${P}.labels.ok`, '○ 제목')}${text(`${P}.labels.no`, '✕ 제목')}${text(`${P}.labels.ask`, '△ 제목')}</div>
        <div class="f">항목
          ${items.map((x, i) => `
            <div class="rule-row">
              <select data-path="${list}.${i}.mark">${[['ok', '○ ' + (pg.labels?.ok || '가능')], ['no', '✕ ' + (pg.labels?.no || '불가')], ['ask', '△ ' + (pg.labels?.ask || '물어보기')]].map(([v, l]) => `<option value="${v}" ${x.mark === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
              <input type="text" data-path="${list}.${i}.text" value="${esc(x.text)}" placeholder="내용">
              <button type="button" class="ghost danger" data-del="${list}" data-i="${i}">✕</button>
            </div>`).join('')}
        </div>` + add('항목 추가');
      break;
    case 'gallery':
      body = `<div class="row">${select(`${P}.cols`, '한 줄에', { 1: '1장씩 (원본 비율)', 2: '2장씩', 3: '3장씩' }, true)}</div>`
        + items.map((g, i, arr) => itemCard(list, i, arr.length, esc(g.caption || `사진 ${i + 1}`), `
        ${imgField(`${list}.${i}.image`, '사진')}
        ${text(`${list}.${i}.caption`, '설명 (선택)')}`, isOpen)).join('') + add('사진 추가');
      break;
    case 'links':
      body = items.map((l, i, arr) => itemCard(list, i, arr.length, esc(`${l.emoji || ''} ${l.label || '링크'}`), `
        <div class="row-icon">
          <label class="f">이모지<input type="text" data-path="${list}.${i}.emoji" value="${esc(l.emoji)}"></label>
          ${text(`${list}.${i}.label`, '버튼 이름')}
        </div>
        ${url(`${list}.${i}.url`, '주소')}`, isOpen)).join('') + add('링크 추가');
      break;
  }
  return `
    ${text(`${P}.intro`, '탭 상단 문구 (선택)')}
    ${accentField(`${P}.accent`)}
    ${body}`;
}

function renderEditor(resetScroll = false) {
  const openSecs = [...document.querySelectorAll('details[open]')].map(d => d.dataset.sec);
  const scrollTop = resetScroll ? 0 : $('#edScroll').scrollTop;
  const isOpen = k => openSecs.includes(k);

  if (!edTabList().some(t => t[0] === view.edTab)) view.edTab = 'window';
  renderEdTabs();

  const L = state.labels;
  const panels = {
    theme: () => ['🎨 테마', state.music.on ? '🎵 음악 켜짐' : '', `
      <div class="row">${color('theme.accent', '포인트 색 (전체)')}${color('theme.text', '글자 색')}</div>
      <div class="row">${color('theme.card', '페이지 배경')}
        <label class="f">본문 글꼴<select data-path="theme.font">${FONTS.map(f => `<option ${f === state.theme.font ? 'selected' : ''}>${f}</option>`).join('')}</select></label>
      </div>
      <div class="row">${text('labels.a', '캐릭터 이름표')}${text('labels.b', '유저 이름표')}</div>
      <p class="hint">블록마다 포인트 색을 따로 정하고 싶다면 각 탭의 항목 안에서 '포인트 색 (이 블록만)'을 바꿔주세요.</p>
      <p class="grp">배경 음악</p>
      ${musicPanel()}`],
    cover: () => ['✨ 표지', COVER_TYPES[state.cover.type]?.label, coverPanel()],
    window: () => ['🧭 탭 관리', `${state.tabs.length}개`, tabsPanel()],
    lock: () => ['🔒 비밀번호', state.lock.on ? `${state.lock.codes.length}개` : '꺼짐', lockPanel()],
    deploy: () => ['🚀 사이트에 올리기', 'GitHub Pages', deployPanel()],
  };
  const tb = state.tabs.find(t => t.id === view.edTab);
  let title, badge, html;
  if (tb) {
    const B = dataPath(tb), data = getPath(state, B) || {};
    title = `${esc(tb.icon || '📄')} ${esc(tb.name || '탭')}`;
    const count = (data.items || []).length;
    [badge, html] = {
      profile: () => ['내 정보', profilePanel(B)],
      mains:   () => [`메인 페어 · ${count}개`, mainsPanel(B, isOpen)],
      others:  () => [`서브 페어 · ${count}개`, othersPanel(B, isOpen)],
      friends: () => [`트친 소개 · ${count}명`, friendsPanel(B, isOpen)],
    }[tb.type]?.() || [(PAGE_TEMPLATES[tb.type] || {}).name, pagePanel(tb, isOpen)];
  } else {
    [title, badge, html] = (panels[view.edTab] || panels.cover)();
  }
  $('#edScroll').innerHTML = `<div class="panel">
    <div class="panel-head"><h2>${title}</h2>${badge ? `<span class="badge">${esc(badge)}</span>` : ''}</div>
    ${bootNote ? `<p class="note">${bootNote} <button type="button" class="ghost" data-shutnote>알겠어요</button></p>` : ''}
    ${html}
  </div>`;
  forceOpen.clear();
  $('#edScroll').scrollTop = scrollTop;
}

/* =========================================================
   GitHub Pages 배포 — 설정·토큰은 이 브라우저에만 저장 (프로젝트 .json 에는 넣지 않음)
   ========================================================= */
const DEPLOY_KEY = 'twt-intro-deploy';
const DEPLOY_BLANK = { owner: '', repo: '', branch: 'main', path: 'index.html', token: '' };
let deployCfg = (() => { try { return Object.assign({}, DEPLOY_BLANK, JSON.parse(localStorage.getItem(DEPLOY_KEY) || '{}')); } catch (_) { return { ...DEPLOY_BLANK }; } })();
let deployStatus = { kind: '', msg: '', url: '' };
function saveDeployCfg() { try { localStorage.setItem(DEPLOY_KEY, JSON.stringify(deployCfg)); } catch (_) {} }

const cfgTrim = () => ({ owner: deployCfg.owner.trim(), repo: deployCfg.repo.trim(), branch: deployCfg.branch.trim() || 'main', path: deployCfg.path.trim().replace(/^\/+/, '') || 'index.html', token: deployCfg.token.trim() });
function siteUrl(c) {
  const base = c.repo.toLowerCase() === `${c.owner.toLowerCase()}.github.io` ? `https://${c.owner}.github.io/` : `https://${c.owner}.github.io/${c.repo}/`;
  return c.path === 'index.html' ? base : base + c.path;
}
const deployReady = () => { const c = cfgTrim(); return !!(c.owner && c.repo && c.token); };

async function gh(method, url, body) {
  const res = await fetch('https://api.github.com' + url, {
    method,
    headers: { Authorization: `Bearer ${cfgTrim().token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (_) {}
  return { ok: res.ok, status: res.status, data };
}
function ghError(r) {
  if (r.status === 401) return '토큰이 올바르지 않거나 만료됐어요. 토큰을 다시 붙여넣어 주세요.';
  if (r.status === 403) return '토큰에 이 저장소 권한이 없어요. 토큰 설정에서 이 저장소를 고르고 Contents 권한을 Read and write로 해주세요.';
  if (r.status === 404) return '저장소를 찾을 수 없어요. 아이디·저장소 이름이 맞는지, 토큰을 만들 때 이 저장소를 골랐는지 확인해주세요.';
  if (r.status === 409) return '저장소가 비어 있어요. 저장소를 만들 때 README 추가를 체크하거나, 아무 파일이나 하나 올린 뒤 다시 시도해주세요.';
  return `GitHub 오류 (${r.status}) ${r.data?.message || ''}`;
}
// UTF-8 문자열 → base64 (한글·이모지 포함)
function b64utf8(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

const deployStatusHTML = () => deployStatus.kind
  ? `<p class="dp-status ${deployStatus.kind}" id="dpStatus">${esc(deployStatus.msg)}${deployStatus.url ? `<br>👉 <a href="${esc(deployStatus.url)}" target="_blank" rel="noopener">${esc(deployStatus.url)}</a>` : ''}</p>`
  : '<p id="dpStatus" hidden></p>';
function setDeploy(kind, msg, url = '') {
  deployStatus = { kind, msg, url };
  const box = $('#dpStatus');
  if (box) box.outerHTML = deployStatusHTML();
  document.querySelectorAll('#dpGo, #dpCheck, #dpLoad, #btnDeploy').forEach(b => { b.disabled = kind === 'busy'; });
}

async function checkDeploy() {
  const c = cfgTrim();
  if (!deployReady()) return setDeploy('err', '아이디, 저장소 이름, 토큰을 모두 입력해주세요.');
  setDeploy('busy', '연결 확인 중…');
  try {
    const r = await gh('GET', `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`);
    if (!r.ok) return setDeploy('err', ghError(r));
    const warn = r.data.private ? ' 단, 비공개 저장소는 무료 계정에서 GitHub Pages가 열리지 않으니 Public으로 바꿔주세요.' : '';
    setDeploy('ok', `연결됐어요: ${r.data.full_name}.${warn}`);
  } catch (e) {
    setDeploy('err', '인터넷 연결을 확인해주세요. (' + e.message + ')');
  }
}

// 편집용 프로젝트 파일: 페이지 파일과 같은 폴더의 intro-project.json
const projectPath = c => c.path.replace(/[^/]*$/, '') + 'intro-project.json';
const encPath = path => path.split('/').map(encodeURIComponent).join('/');

// 파일 하나를 올리기 (이미 있으면 덮어쓰기)
async function ghPutFile(repoPath, branch, path, text, message) {
  const cur = await gh('GET', `${repoPath}/contents/${encPath(path)}?ref=${encodeURIComponent(branch)}`);
  if (!cur.ok && cur.status !== 404) return cur;
  return gh('PUT', `${repoPath}/contents/${encPath(path)}`, {
    message, content: b64utf8(text), branch,
    ...(cur.ok && cur.data?.sha ? { sha: cur.data.sha } : {}),
  });
}

async function loadFromGitHub() {
  const c = cfgTrim();
  if (!deployReady()) return setDeploy('err', '아이디, 저장소 이름, 토큰을 모두 입력해주세요.');
  if (!confirm('GitHub에 올려둔 내용으로 지금 편집 중인 내용을 바꿀까요?\n(바꾼 뒤에도 ↶ 되돌리기로 돌아올 수 있어요)')) return;
  const repoPath = `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
  try {
    setDeploy('busy', 'GitHub에서 불러오는 중…');
    // raw 형식으로 받으면 1MB가 넘는 파일도 그대로 받아짐
    const res = await fetch(`https://api.github.com${repoPath}/contents/${encPath(projectPath(c))}?ref=${encodeURIComponent(c.branch)}`, {
      headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github.raw+json', 'X-GitHub-Api-Version': '2022-11-28' },
    });
    if (res.status === 404) return setDeploy('err', `저장소에 편집용 파일(${projectPath(c)})이 없어요. 이 기능을 넣기 전에 올린 페이지라면, 지금 내용으로 한 번 다시 올린 뒤부터 불러올 수 있어요.`);
    if (!res.ok) return setDeploy('err', ghError({ status: res.status, data: await res.json().catch(() => null) }));
    const data = JSON.parse(await res.text());
    state = migrate(data);
    view.flips = []; view.tab = 0; view.sub = {};
    update({ editor: true });
    markDirty(false); bootNote = '';
    setDeploy('ok', 'GitHub에 올려둔 내용을 불러왔어요. 이어서 편집하고 다시 올리면 돼요.');
  } catch (e) {
    setDeploy('err', '불러오지 못했어요. (' + e.message + ')');
  }
}

async function runDeploy() {
  const c = cfgTrim();
  if (!deployReady()) return setDeploy('err', '아이디, 저장소 이름, 토큰을 모두 입력해주세요.');
  const repoPath = `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
  try {
    setDeploy('busy', '페이지를 만드는 중…');
    const html = buildPage(state, { opened: false, tab: 0 });

    const stamp = new Date().toLocaleString('ko-KR');
    setDeploy('busy', `페이지 올리는 중… (${(html.length / 1048576).toFixed(1)}MB)`);
    const put = await ghPutFile(repoPath, c.branch, c.path, html, `자기소개 페이지 업데이트 (${stamp})`);
    if (!put.ok) return setDeploy('err', ghError(put));

    // 다른 곳에서도 이어서 편집할 수 있도록 편집용 파일도 함께 올림 (배포 설정·토큰은 들어가지 않음)
    setDeploy('busy', '편집용 파일 올리는 중…');
    const proj = await ghPutFile(repoPath, c.branch, projectPath(c), JSON.stringify(state), `편집용 파일 업데이트 (${stamp})`);
    if (!proj.ok) return setDeploy('err', '페이지는 올렸지만 편집용 파일은 올리지 못했어요. ' + ghError(proj));

    // GitHub Pages 가 꺼져 있으면 켜보기 (토큰에 Pages 권한이 없으면 안내만)
    let note = '반영까지 보통 1분쯤 걸려요.';
    const pages = await gh('GET', `${repoPath}/pages`);
    if (pages.status === 404) {
      // 새로 켤 때는 POST (PUT 은 이미 켜진 Pages 설정을 바꿀 때 쓰는 것)
      const on = await gh('POST', `${repoPath}/pages`, { source: { branch: c.branch, path: '/' } });
      note = on.ok
        ? 'GitHub Pages도 켰어요. 처음에는 주소가 열리기까지 1~3분 걸려요.'
        : 'GitHub Pages가 아직 꺼져 있어요. 저장소 Settings → Pages에서 Branch를 main / (root)로 저장해주세요.';
    }
    markDirty(false); bootNote = '';
    setDeploy('ok', `올렸어요! ${note}`, siteUrl(c));
  } catch (e) {
    setDeploy('err', '올리지 못했어요. 인터넷 연결을 확인해주세요. (' + e.message + ')');
  }
}

/* ---------- 페이지 용량 · 사진 줄이기 ---------- */
// 내보낼 페이지 크기(MB) — 사진이 대부분을 차지
const pageMB = () => buildPage(state, { opened: false, tab: 0 }).length / 1048576;
let optimizeNote = '';
// 프로젝트 안의 사진을 모두 찾아 가벼운 형식으로 다시 저장 (충분히 가벼운 사진은 건드리지 않음)
async function optimizeImages(onProgress) {
  const found = [];
  (function walk(o, path) {
    if (typeof o === 'string') {
      if (/^data:image\/(png|jpeg|webp|bmp)/.test(o) && o.length > 120 * 1024) found.push(path);
      return;
    }
    if (o && typeof o === 'object') for (const k of Object.keys(o)) walk(o[k], path ? `${path}.${k}` : k);
  })(state, '');
  let before = 0, after = 0, changed = 0;
  for (let n = 0; n < found.length; n++) {
    const path = found[n], old = getPath(state, path);
    let next = old;
    try { const out = await shrinkImage(old); if (out.length < old.length * 0.85) next = out; } catch (_) {}
    if (next !== old) { setPath(state, path, next); changed++; }
    before += old.length; after += next.length;
    onProgress && onProgress(n + 1, found.length);
  }
  return { count: found.length, changed, before, after };
}
async function runOptimize(btn) {
  btn.disabled = true;
  const mb = x => (x / 1048576).toFixed(1);
  try {
    const r = await optimizeImages((n, total) => { btn.textContent = `줄이는 중… ${n} / ${total}`; });
    optimizeNote = !r.count ? '줄일 만큼 큰 사진이 없어요.'
      : r.changed ? `사진 ${r.changed}장을 줄였어요. 사진 용량 ${mb(r.before)}MB → ${mb(r.after)}MB`
      : '이미 충분히 가벼운 사진들이라 바꾼 게 없어요.';
  } catch (e) { optimizeNote = '줄이는 중에 문제가 생겼어요. (' + e.message + ')'; }
  update({ editor: true });
}
